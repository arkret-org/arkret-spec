  /_cokret/gate/account/register:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ck.gate.account.register
      security: []
      x-cokret-auth:
        public_metadata: false
        proof_in_body: true
        proof_field: proof
        notes: Request is unauthenticated at the transport bearer layer when bootstrapping, but the body proof or an equivalent holder-bound Authorization/DPoP/HTTP Message Signature MUST bind principal_id, device_id, audience, request canonical digest, challenge, issued_at and expires_at.
      summary: Bind or create a deployment-local account record for a principal.
      description: |
        Auth Server lifecycle operation. The request uses principal_id rather
        than did and never accepts a bare handle. display_name is only a
        bootstrap display field; if persisted it lands in Actor Profile
        display_name via the canonical profile path.

        Register MAY return signed handle-claim evidence or digest/ref in the
        AccountRegisterOutcome, but handle issuance, approval, assignment, re-signing,
        and revocation remain issuer/coauth/deployment-governance flows.
      responses:
        '200':
          description: Account record bound or created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRegisterOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegisterRequestBody'
  /_cokret/gate/account/session-grants:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ck.gate.account.issue_session_grant
      security: []
      x-cokret-auth:
        public_metadata: false
        proof_in_body: true
        proof_field: proof
        notes: Request is unauthenticated at the transport bearer layer, but the body MUST carry passkey/OIDC/device/agent proof bound to the request canonical digest and audience.
      responses:
        '200':
          description: Session grant issued from passkey/OIDC/device proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrantResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionGrantRequest'
  /_cokret/gate/account/session-grants/revoke:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ck.gate.account.session_revoke
      security:
      - bearerAuth: []
      summary: Revoke session grant or access-token authority.
      description: |
        Revokes session grant / access-token authority, not device
        authorization and not durable ck.account.status. An omitted request body
        revokes the current request's session grant. target_grant_id,
        target_device_id and all_sessions=true are mutually exclusive selectors.

        Cross grant, cross device, and all_sessions=true revocation requires a
        fresh DID/device proof or explicit capability; a bearer access token
        alone is not enough to revoke other devices or all sessions.
      responses:
        '200':
          description: Session revocation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeOutcome'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRevokeRequestBody'
