              content:
                contentType: application/octet-stream
  /_cokret/self/blob/get:
    head:
      operationId: ck.blob.head
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
      - presignParam: []
      responses:
        '200':
          description: Blob metadata
    get:
      operationId: ck.blob.get
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
      - presignParam: []
      parameters:
      - in: header
        name: Range
        schema:
          type: string
      responses:
        '200':
          description: Blob content
          headers:
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    parameters:
    - name: blob_ref
      in: query
      required: true
      description: Content-addressed blob reference (`ck:blob:sha256:<hex>`) or metadata id (`ck:blob:<uuid>`).
      schema:
        type: string
    - name: presign
      in: query
      required: false
      description: |
        Pre-signed authorization token returned by `ck.blob.presign`. When
        present, the request is authenticated solely by this token — the
        `Authorization` header MUST be absent and is rejected if both are
        supplied. Pre-signed mode is a deliberate carve-out of the
        "no credentials in URL" rule (see zh/security/server-threat-model.md
        §2.1 #21) so that browser primitives (`<img src>`, `<video src>`,
        `<link href>`) can render protected media. Carries a server-signed
        envelope binding `blob_ref`, `expires_at`, `purpose`, requester
        identity hint, and an issuance nonce. The identity hint is diagnostic
        only and does not authenticate the current bearer. Pre-signed URLs MUST
        be short TTL (≤ 1 h), single-blob, read-only, and revocable. NOT permitted
        for E2EE attachment ciphertext fetch — those MUST keep `blob_ref`
        out of the URL the server can log. See zh/crypto-media/media-and-blob.md
        §5.4.
      schema:
        type: string
  /_cokret/self/blob/presign:
    post:
      operationId: ck.blob.presign
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/BlobPresignRequest
      responses:
        '200':
          description: Pre-signed URL issued
          content:
            application/json:
              schema:
                $ref: ../schemas/service-operation-dtos.schema.json#/$defs/BlobPresignResponse
        '403':
          description: |
            `capability_denied` — caller lacks `ck.blob.presign` for this
            blob or this purpose; or the grant's TTL constraint forbids the
            requested `max_age_seconds`; or the target is a minimal-metadata
            Realm-owned blob for which bearer presign is forbidden by
            media-and-blob.md §5.4.4.1.
        '404':
          description: |
            `not_found` — blob does not exist or is not visible to the
            caller. MUST NOT differentiate between non-existence and lack of
            visibility.
