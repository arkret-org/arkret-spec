  /_cokret/self/agent-sidecar-threads:ensure:
    post:
      operationId: ck.agent.sidecar_thread.ensure
      description: |
        Idempotently ensure the controller-agent sidecar Circle, Flow, and relation (CKP-0009 §4.2.1).
        The wire-level idempotency keys are **server-derived**: the sidecar Circle is keyed by
        `(realm_id, controller_principal_id)` and the sidecar private Flow / reuse identity by
        `(controller_principal_id, normalized_context_ref)`. Note that `agent_principal_id` is NOT part of
        either key — a single sidecar Circle is shared across all eligible agents owned by the same controller
        in a given Realm. Clients MUST NOT supply an `Idempotency-Key` header and MUST NOT retry with a different
        body to "force" creation. Concurrent ensure calls converge to the same sidecar refs; repeated calls
        after creation return the existing refs. Existence-privacy failures surface as `sidecar_create_denied`
        (a deliberately generic precondition that hides whether a sidecar with the same derived short_name
        already exists).
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sidecar thread ensured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSidecarThreadEnsureResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSidecarThreadEnsureRequest'
