    # =========================================================================
    # Typed request / response schemas for stable core operations.
    # See zh/sync/service-http-binding.md for normative field semantics.
    # Per OpenAPI binding policy in info.description: events / account /
    # snapshot / identity / authz core surfaces carry typed schemas so SDK
    # generators can derive
    # operation-specific required fields without consulting prose. Remaining
    # extension / deployment-local surfaces use generic OperationRequest /
    # OperationResult only when the operation-registry row declares
    # generic_binding.
    # =========================================================================
    FederationServiceBindingRef:
      type: object
      description: |
        Request-level service binding snapshot carried by federation
        service-to-service ck.events.submit calls. This is metadata for the
        receiver to verify the sender's delivery decision; client writes omit it.
      required:
      - realm_id
      - realm_policy_digest
      - membership_frontier
      - delivery_binding_frontier
      - destination_service_type
      - reducer_profile_digest
      properties:
        realm_id:
          type: string
          pattern: ^ck:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        realm_policy_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        membership_frontier:
          type: array
          items:
            type: string
            pattern: ^ck:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        delivery_binding_frontier:
          type: array
          items:
            type: string
            pattern: ^ck:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        delivery_binding_diagnostics:
          type: object
          additionalProperties: true
        destination_service_type:
          type: string
          minLength: 1
        reducer_profile_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false

    EventSubmitEnvelope:
      allOf:
      - $ref: ../schemas/event-envelope.schema.json
      - type: object
        not:
          anyOf:
          - required:
            - actor_kind
          - required:
            - effective_scope
        description: |
          Actor-supplied ck.events.submit input envelope. It reuses the base Event
          shape for actor intent fields but forbids reducer-managed accepted-output
          projections such as actor_kind and effective_scope. Services stamp those
          fields only after accept and expose them on read/query/sync envelopes.

    EventsSubmitBatchRequest:
      type: object
      description: Batch ck.events.submit request used by account clients.
      required:
      - events
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventSubmitEnvelope'
      additionalProperties: false

    EventsSubmitFederationRequest:
      type: object
      description: Federation service-to-service ck.events.submit request body.
      required:
      - service_binding_ref
      - events
      properties:
        service_binding_ref:
          $ref: '#/components/schemas/FederationServiceBindingRef'
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventSubmitEnvelope'
      additionalProperties: false

    EventsSubmitResponse:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsSubmitResponse
    EventGetResponse:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventGetResponse
    EventsResolveRequest:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsResolveRequest
    EventsResolveResponse:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsResolveResponse
    EventsQueryResponse:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsQueryResponse
    EventsSubscribeFrame:
      type: object
      description: One NDJSON line emitted by ck.events.subscribe. `dropped` requires a usable recovery cursor; if no cursor exists, servers MUST emit `resync_required` instead.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - event
          - frontier
          - heartbeat
          - catchup_complete
          - epoch_rotation
          - dropped
          - resync_required
          - unauthorized
        realm_id:
          type: string
        cursor:
          type: string
          description: Stream cursor. REQUIRED when kind=dropped.
        payload:
          type: object
        reconnect_after_ms:
          type: integer
          minimum: 1
          description: Optional server-directed minimum delay before opening another ck.events.subscribe stream for the same caller/selector scope. MAY appear only on dropped and resync_required frames; clients MUST wait at least this delay before reconnecting, and servers MUST reject earlier reconnect attempts with 429 plus Retry-After.
      allOf:
      - if:
          properties:
            kind:
              const: dropped
          required:
          - kind
        then:
          required:
          - realm_id
          - cursor
      - if:
          properties:
            kind:
              enum:
              - event
              - frontier
              - heartbeat
              - catchup_complete
              - epoch_rotation
              - unauthorized
          required:
          - kind
        then:
          not:
            required:
            - reconnect_after_ms
      additionalProperties: false

    EventsFrontierResponse:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsFrontierResponse
    EventsFrontierAccountClientResponse:
      type: object
      description: Account-client ck.events.frontier response.
      required:
      - frontier
      properties:
        frontier:
          type: object
          description: |
            Either an actor frontier (`{actor_id, actor_seq, event_id}`) or a
            Realm frontier (`{realm_id, anchor_id, state_root, hlc?}`) shape
            depending on which selector was passed; servers MUST NOT leak
            frontiers across visibility boundaries.
        receipts:
          type: array
          items:
            type: object
      additionalProperties: false

    EventsFrontierFederationPeerResponse:
      type: object
      description: Federation peer ck.events.frontier response. Requires S2S signed trust-domain headers.
      required:
      - frontier
      - frontier_root
      - signature
      properties:
        frontier:
          type: object
          description: Realm frontier visible to the authenticated federation peer.
        receipts:
          type: array
          items:
            type: object
        frontier_root:
          type: string
          description: Hash commitment returned for federation_peer and anonymous_health peer_role.
        actor_seq_upper_bounds:
          type: object
          description: Per-actor sequence upper bounds returned for federation_peer peer_role.
        signature:
          type: object
          description: Service signature over the frontier response when peer_role=federation_peer.
      additionalProperties: false

    EventsFrontierAnonymousHealthResponse:
      type: object
      description: Anonymous health ck.events.frontier response. MUST NOT include actor_seq_upper_bounds, receipts, frontier details, or service signature material.
      required:
      - frontier_root
      properties:
        frontier_root:
          type: string
          description: Opaque hash commitment suitable for liveness / freshness checks.
        cache_expires_at:
          type: string
          format: date-time
          description: Earliest time until which clients SHOULD reuse this anonymous health response. Anonymous health responses MUST impose at least a 60 second cache/backoff window; clients MUST treat shorter values as 60 seconds.
        retry_after_ms:
          type: integer
          minimum: 60000
          description: Minimum retry delay for anonymous health probes when the service wants explicit polling backoff. Anonymous health responses MUST impose at least a 60 second cache/backoff window.
      additionalProperties: false

    SnapshotBootstrap:
      type: object
      description: Optional ck.events.query acceleration hint for federation pull / backfill. snapshot_ref is an external pointer and MUST equal the Snapshot manifest id. Verifier MUST validate signature, state_digest, snapshot_frontier, chunk digests, created_by, created_at, and authority_binding before use (manifest fields are bound by the manifest signature transcript — see schemas/snapshot.schema.json).
      required:
      - snapshot_ref
      - state_digest
      - snapshot_frontier
      - created_by
      - created_at
      - authority_binding
      - signature
      properties:
        snapshot_ref:
          type: string
          description: External pointer to the Snapshot manifest; MUST equal schemas/snapshot.schema.json#/properties/id.
        state_digest:
          type: string
        snapshot_frontier:
          type: array
          items:
            type: string
        created_by:
          type: string
          description: DID of the snapshot issuer; bound by the manifest signature transcript.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp ending in 'Z' when the manifest was sealed; bound by the manifest signature transcript.
        authority_binding:
          type: object
          additionalProperties: true
          description: Snapshot issuer authority evidence bound by the manifest signature transcript; mirrors schemas/snapshot.schema.json#/properties/authority_binding.
        signature:
          type: object
        verification_hints:
          type: object

    SnapshotHeadResponse:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SnapshotHeadResponse
    IdentityGetDocumentResponse:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/IdentityGetDocumentResponse
    CellQueryEnvelope:
      type: object
      description: 'Wire envelope for state-query / projection responses on a single
        cell. `status` MUST be `value` when the join is defined, `bottom` when the
        cell resolved to ⊥ on a `bottom=reject` lattice (caller MUST treat as
        fail-closed), and `conflict` when a `bottom=expose` lattice surfaces
        candidate heads to the projection / UI without selecting a winner. See
        zh/sync/service-surface.md §5.3 and zh/authz/event-auth-state-resolution.md
        §5.1.'
      required:
      - cell
      - status
      properties:
        cell:
          type: string
          pattern: ^ck:cell:[A-Za-z0-9._~=-]+(?::[A-Za-z0-9._~=-]+)*$
        status:
          type: string
          enum:
          - value
          - bottom
          - conflict
        value:
          description: 'Effective Lattice value when status=value. Shape is
            cell-type specific (or_set members, mv_register tuple, cas_register
            atom, fsm state, counter integer, ordered_log tail).'
        heads:
          type: array
          uniqueItems: true
          description: Candidate heads when status=conflict on a `bottom=expose`
            cell. Receivers MUST NOT use this for authorization decisions.
          items: true
        bottom:
          $ref: '#/components/schemas/BottomDiagnostic'
        anchor_view:
          type: object
          description: Anchor leaves / state_root the value or bottom was
            observed under. Mirrors `bottom.anchor_view` when status≠value.
          required:
          - leaves
          properties:
            leaves:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                pattern: ^ck:anchor:sha256:[0-9a-f]{64}$
            state_root:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
          additionalProperties: false
      additionalProperties: true
    EventStateView:
      type: object
      description: Per-event protocol-state field surfaced on /account/subscribe and /events
        responses (zh/sync/service-surface.md §5.3, zh/authz/event-auth-state-resolution.md
        §13). Implementations MUST attach this on every reducer-input Event
        included in a timeline/state response so clients can render fail-closed
        UI without recomputing the join.
      required:
      - event_id
      - event_digest
      - event_state
      properties:
        event_id:
          type: string
          pattern: ^ck:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        event_digest:
          type: string
          description: Canonical hash of the event's canonical bytes (excluding
            proofs and unsigned); equals proof.event_digest. Used as the Anchor
            frontier item for this event. Algorithm family aligned with
            schemas/anchor.schema.json#/$defs/event_digest — sha256 / sha3_256 /
            blake3 (64 hex) or sha512 (128 hex).
          pattern: ^(?:sha256|sha3_256|blake3):[0-9a-f]{64}$|^sha512:[0-9a-f]{128}$
        event_state:
          type: string
          enum:
          - pending_anchor
          - effective
          - failed_precondition
          - failed_bottom
          - rejected_anchor
          - anchorer_paused
        bottom:
          $ref: '#/components/schemas/BottomDiagnostic'
      additionalProperties: false
    DeviceMessageEnvelope:
      $ref: ../schemas/device-message.schema.json
    DeviceMessageTarget:
      type: object
      required:
      - kind
      - expires_at
      - content
      properties:
        kind:
          type: string
          pattern: ^ck\.[a-z0-9_]+(\.[a-z0-9_]+)*$
        content:
          type: object
        expires_at:
          type: string
          format: date-time
          pattern: Z$
      additionalProperties: false
