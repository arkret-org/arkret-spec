    get:
      operationId: ck.self.events.query
      x-cokret-required-any-of:
      - - realms
      - - actors
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
      summary: Query / backfill events with cursor pagination.
      description: |
        Returns a page of events according to `before` / `after` cursor anchors.

        Either or both of `before` / `after` may be given:
          - `before=<cursor>` alone: events most recently *before* this cursor
            position (history backfill, UI-friendly). Default `order=descending`.
          - `after=<cursor>` alone: events earliest *after* this cursor position
            (catch-up, reducer-friendly). Default `order=ascending`.
          - both: open interval `(after, before)`. Default `order=descending`.
          - neither: equivalent to `before=<server head>` (latest first page).

        `before` and `after` are both EXCLUSIVE of the cursor position.

        Response `prev_cursor` / `next_cursor` are absolute-direction cursors:
        `prev_cursor` points toward older events (pass to next `before=`);
        `next_cursor` points toward newer events (pass to next `after=`).
        See zh/sync/service-http-binding.md §3.3 and zh/sync/api-conventions.md
        §7.0 for the full semantic table.

      parameters:
      - name: realms
        in: query
        description: Filter by Realm IDs. Multiple values are UNION within the parameter; cross with `actors` is intersection.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RealmId'
          minItems: 1
        style: form
        explode: true
      - name: actors
        in: query
        description: Filter by Actor DIDs. Multiple values are UNION within the parameter; cross with `realms` is intersection.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActorDid'
          minItems: 1
        style: form
        explode: true
      - name: before
        in: query
        description: Return events strictly older than this cursor position. Pair with response `prev_cursor` to walk further backward.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: after
        in: query
        description: Return events strictly newer than this cursor position. Pair with response `next_cursor` to walk further forward.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: order
        in: query
        description: |
          Batch ordering. `default` follows the proximity-to-anchor rule
          (before-only → descending; after-only → ascending; both → descending);
          `ascending` / `descending` force the order.
        schema:
          type: string
          enum:
          - default
          - ascending
          - descending
          default: default
      - name: limit
        in: query
        description: Max events to return; server enforces an upper bound (see scalability-constraints.md).
        schema:
          type: integer
          minimum: 1
      - name: filters
        in: query
        description: Optional structured filter object (kind, payload predicates). See zh/sync/service-http-binding.md §3.3.
        schema:
          type: object
        style: deepObject
        explode: true
      responses:
        '200':
          description: Event query page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsQueryOutcome'
        '400':
          description: |
            `invalid_param` — unrecognized `order` enum value or malformed cursor.
  /_cokret/self/events/query:
    post:
      operationId: ck.self.events.query_post
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
        contentDigest: []
      summary: ck.self.events.query in HTTP POST body form (for long/complex queries).
      description: |
        Semantically identical to `GET /_cokret/self/events` (`ck.self.events.query`); the same
        selector / cursor / order / filter parameter set is transported as a
        JSON request body instead of URL query parameters. Use this form when
        any of:

          - The URL would exceed the deployment's practical limit (proxies /
            CDNs commonly cap at 4–8 KiB). Large `realms[]` / `actors[]` lists
            or a non-trivial `filters` object cross this threshold quickly.
          - Operators would otherwise log full URL query strings (which can
            inadvertently capture sensitive filter contents in access logs).

        The response shape (`events[]`, `prev_cursor`, `next_cursor`,
        `has_more`) matches the GET form exactly. Cursor pagination semantics
        (proximity-to-anchor default order, absolute prev / next directions)
        come from the same source — see zh/sync/service-http-binding.md §3.3.

        gRPC / MQ bindings reuse the canonical `SelfEvents/Query` channel; this
        operation_id is a HTTP-only binding variant of `ck.self.events.query` to keep
        OpenAPI / SDK generators round-trippable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsQueryPostRequestBody
      responses:
        '200':
          description: Event query page (same shape as GET /_cokret/self/events response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsQueryOutcome'
        '400':
          description: |
            `invalid_param` — unrecognized `order` enum value or malformed cursor.
  /_cokret/self/events/subscribe:
    get:
      operationId: ck.self.events.subscribe
      x-cokret-required-any-of:
      - - realms
      - - actors
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
      summary: Streaming event subscription with optional catch-up replay.
      description: |
        Opens a streaming subscription scoped by `realms[]` / `actors[]`. Returns
        events from `after=<cursor>` (exclusive) forward. Subscribe naturally
        moves only toward newer events; there is no `before` / `order`
        parameter.

        With `catchup=true` and `after=<cursor>` the server first replays
        the bounded catch-up range from that cursor up to the current frontier,
        then emits `catchup_complete` per Realm and continues with live frames.
        This is not a request for all historical events; full history is read
        through `GET /_cokret/self/events` pagination / range queries.
      parameters:
      - name: realms
        in: query
        description: Filter by Realm IDs. UNION within, intersection with `actors[]`.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RealmId'
          minItems: 1
        style: form
        explode: true
      - name: actors
        in: query
        description: Filter by Actor DIDs. UNION within, intersection with `realms[]`.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActorDid'
          minItems: 1
        style: form
        explode: true
      - name: after
        in: query
        description: Subscription start cursor (exclusive). Same semantics as ck.self.events.query's `after=` parameter.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: catchup
        in: query
        description: When true and `after` is present, the server first replays the bounded catch-up range from `after=` to the current frontier, then transitions to live. This is not full-history retrieval.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Streaming event subscription with optional catch-up replay
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/EventsSubscribeFrame'
