        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
      summary: Federation peer event pull / backfill query.
      description: |
        Returns a page of events visible to the authenticated federation peer.
        Cursor, selector, order, and response semantics match `ck.self.events.query`,
        but this binding is the server-to-server peer trust surface.
      parameters:
      - name: realms
        in: query
        description: Filter by Realm IDs. Multiple values are UNION within the parameter; cross with `actors` is intersection.
        schema:
          type: array
          items:
