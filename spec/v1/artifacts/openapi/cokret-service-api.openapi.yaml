openapi: 3.1.0
info:
  title: Cokret Service API
  version: 1.0.0
  summary: Canonical Cokret service surface and admin/account bindings
  description: 'Authoritative source for operations and error codes is the contract catalog at

    `artifacts/registry/contract-catalog.json` and the error registry at

    `artifacts/registry/error-code-registry.json`.


    This OpenAPI document is the canonical HTTP binding for registered service

    operations.


    **Typed vs generic schema policy**:


    Stable core operations on the events / account / snapshot / identity /
    authz data path

    carry **typed request/response schemas** so SDK generators can derive

    operation-specific required fields directly from OpenAPI without consulting

    prose. The typed surface currently covers `ck.events.{submit, get, resolve,

    query, query_post, frontier}`, `ck.peer.events.{submit, resolve, query,
    query_post, frontier}`, `ck.account.{viewer, subscribe,
    update_profile, register, session_revoke}`, `ck.self.snapshot.head`,
    `ck.peer.snapshot.head`,

    `ck.identity.{resolve, get_document, get_receipts, submit_did_operation}`, `ck.authz.{check,

    get_effective_grants}`, and the ServiceDescribe envelope. The corresponding

    component schemas are named `EventsSubmitBatchRequestBody`,

    `EventsSubmitFederationRequestBody`, `EventsSubmitOutcome`, `EventView`,

    `EventsResolveRequestBody` / `EventsResolveOutcome`, `EventsQueryOutcome`,

    `EventsFrontierState`, `EphemeralSubmitOutcome`, `SnapshotHeadState`,

    `IdentityResolveOutcome` / `IdentityDocumentView`,
    `DidOperationSubmitRequestBody` / `DidOperationSubmitOutcome`,

    `AuthzCheckRequestBody` / `AuthzCheckOutcome`, `GrantList`,

    `ServiceDescribe`.


    Security-sensitive extension operations such as MLS KeyPackage lifecycle,

    Directory, Applet, MIMI, Push, Blob and media bindings also carry typed DTO

    schemas. The current v1 OpenAPI document does not publish generic

    `OperationRequest` / `OperationResult` components. Any future profile that

    reintroduces a generic binding must declare `generic_binding` in the

    operation registry, carry an explicit profile gate and migration plan, and

    must not claim generated-SDK completeness until a typed DTO lands.


    Default authentication: bearer token plus HTTP Message Signature for

    service-to-service calls (see `zh/sync/service-http-binding.md` §2.2). Public

    metadata endpoints explicitly noted as `public_metadata` may be unauthenticated;

    every other path requires at least one of the declared securitySchemes.


    Path namespace convention: every path is absolute under the negative-space

    root `/_cokret/` and carries NO version segment. The first segment after

    `/_cokret/` is a trust-surface classifier encoding the caller-to-server trust

    relationship and attack-surface class. The "trust circle" terminology is an

    explanatory metaphor, not an authorization result. The current classifiers are:
    `self` (the authenticated session of the caller), `gate` (authentication entry), `root` (identity /

    DID trust root; not root/admin privilege), `find` (directory discovery), `peer` (federation server-to-server

    wire; reserved namespace branch), `open` (external protocol interop or out-of-band handoff, e.g. MIMI / invite locators; not public/no-auth access),

    `edge` (push / bridge gateways).

    Reading the URL therefore reveals the attack surface, but each operation still

    enforces its own session, capability, DID proof, Realm policy, visibility,

    service-delegation, rate-limit, and disclosure checks. The pre-auth capability

    advertisement lives at the root meta position `/_cokret/describe`.


    Versioning is NOT expressed in the path. The protocol version is negotiated via

    `*.describe` / `supported_operations` (and optionally a `Cokret-Protocol-Version`

    request/response header); schema ids carry their own `.v1` suffix. The

    corresponding `operation-registry.json` `http` field records the full absolute

    path verbatim.'
# Default is authenticated. SDKs / lint / threat-model audits still require
# every operation to declare its own `security:` block, but the document-level
# fallback MUST be fail-closed if a future operation is added incorrectly.
# Operations that are truly unauthenticated (public metadata / callback proof
# endpoints) declare `security: []` explicitly.
security:
- bearerAuth: []
servers:
- url: https://{host}
  variables:
    host:
      default: localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        User-session bearer token (passkey / OIDC / device proof). Used for
        operations called by an end-user client. NOT acceptable as the sole
        auth material for S2S federation / inter-service calls — those MUST
        also satisfy the httpMessageSignature + sourceServiceDid +
        destinationServiceDid AND group (see service-http-binding.md §2.2).
    httpMessageSignature:
      type: apiKey
      in: header
      name: Signature
      description: |
        RFC 9421 HTTP Message Signature applied with the source service DID's
        verification key. When present, the request MUST also include
        Source-Service-DID / Destination-Service-DID / Content-Digest (the
        latter only for requests with a body); federation event push also MUST
        include Source-Trust-Domain / Destination-Trust-Domain and
        Request-Canonical-Digest. These are modeled as separate apiKey
        securitySchemes and MUST appear in the same security AND group as
        httpMessageSignature when required by the operation.
    sourceServiceDid:
      type: apiKey
      in: header
      name: Source-Service-DID
      description: |
        Required companion to httpMessageSignature. Identifies the originating
        service DID and MUST be covered by the signature transcript. SDK
        generators MUST treat the absence of this header on S2S endpoints as
        an authentication failure, not a 400.
    destinationServiceDid:
      type: apiKey
      in: header
      name: Destination-Service-DID
      description: |
        Required companion to httpMessageSignature. Identifies the intended
        recipient service DID (anti-misdirection / cross-tenant guard). MUST
        match the deployment-resolved service identity; mismatched requests
        MUST be rejected before reaching reducer / business logic.
    sourceTrustDomain:
      type: apiKey
      in: header
      name: Source-Trust-Domain
      description: |
        Federation companion to httpMessageSignature. Identifies the source
        deployment trust domain (`ck:trust_domain:<scope>`) and MUST be covered
        by the signature transcript.
    destinationTrustDomain:
      type: apiKey
      in: header
      name: Destination-Trust-Domain
      description: |
        Federation companion to httpMessageSignature. Identifies the receiver
        deployment trust domain (`ck:trust_domain:<scope>`) and MUST match the
        destination service / Realm receive context before reducer logic runs.
    requestCanonicalDigest:
      type: apiKey
      in: header
      name: Request-Canonical-Digest
      description: |
        sha256 digest of the canonical request object used for federation
        idempotency / replay detection. MUST be covered by the HTTP Message
        Signature transcript when present.
    contentDigest:
      type: apiKey
      in: header
      name: Content-Digest
      description: |
        Required companion to httpMessageSignature on requests that carry a
        body (POST / PUT / DELETE-with-body). RFC 9530 digest header bound
        into the signature transcript so that body tampering is detected
        before any verification of structured fields. Omitted on body-less
        requests (GET / HEAD / DELETE-without-body).
    presignParam:
      type: apiKey
      in: query
      name: presign
      description: |
        Single-blob, short-TTL pre-signed authorization (ck.self.blob.presign).
        Carries a server-signed envelope binding blob_ref / TTL / scope /
        issuance nonce. The nonce is an envelope/audit/revocation key, not a
        one-use media-load replay guard unless a single-use profile is declared.
        Permitted ONLY on ck.self.blob.get and ck.self.blob.head, and MUST NOT
        co-occur with bearerAuth — implementations enforce mutual exclusion.
        See media-and-blob.md §5.4 and server-threat-model.md §2.1 #21 for the
        carve-out's normative constraints.
    mutualTls:
      type: mutualTLS
      description: |
        Reserved for deployment-controlled internal channels (sovereign /
        enclave operator surfaces). Not used by any registered v1 operation
        in this OpenAPI document; deployments MAY require it on product-local
        management APIs outside the Cokret protocol namespace.
  headers:
    XCokretRequestId:
      description: Stable request identifier.
      schema:
        type: string
    IdempotencyKey:
      description: Idempotency key for write requests.
      schema:
        type: string
    XCokretWaitFor:
      description: Causal frontier token the caller is waiting on.
      schema:
        type: string
    RetryAfter:
      description: Standard retry hint.
      schema:
        type: string
  schemas:
    ActorDid:
      type: string
      pattern: ^did:[a-z0-9]+:[^\s#?]+$
      description: Bare DID used as a Cokret actor/principal identifier. DID URL fragments belong in verification_method, not actor_id/principal_id.
    ServiceDid:
      type: string
      pattern: ^did:[a-z0-9]+:[^\s#?]+$
      description: Bare DID identifying a service endpoint.
    RealmId:
      type: string
      pattern: ^ck:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    FlowId:
      type: string
      pattern: ^ck:flow:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EventId:
      type: string
      pattern: ^ck:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DeviceId:
      type: string
      pattern: ^ck:device:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    GrantId:
      type: string
      pattern: ^ck:grant:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Cursor:
      type: string
      pattern: ^ck:cursor:[A-Za-z0-9_-]+$
    AccountId:
      type: string
      pattern: ^[A-Za-z0-9._:-]{1,128}$
      description: Deployment-local account identifier. It is not a Cokret principal DID and not a protocol object typed ID.
    ErrorEnvelope:
      type: object
      required:
      - ok
      - error
      - request_id
      properties:
        ok:
          const: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Standard error code from artifacts/registry/error-code-registry.json.

                The enum below is generated from that registry; clients MUST treat

                unknown values as forward-compatible failures and SHOULD log them.'
              enum:
              - bad_json
              - bad_query
              - schema_violation
              - missing_param
              - invalid_param
              - unauthenticated
              - auth_expired
              - soft_logged_out
              - did_proof_required
              - invalid_signature
              - capability_denied
              - realm_frozen
              - claim_required
              - policy_violation
              - policy_denied
              - read_receipt_compliance_floor_violated
              - not_found
              - unrecognized_endpoint
              - method_not_allowed
              - conflict
              - cas_conflict
              - causal_conflict
              - dependency_missing
              - discussion_track_disabled
              - epoch_mismatch
              - duplicate_conflict
              - rank_exhausted
              - hlc_logical_overflow
              - payload_too_large
              - digest_mismatch
              - aad_digest_mismatch
              - payload_digest_mismatch
              - key_unavailable
              - state_mismatch
              - audit_receipt_invalidated
              - unknown_did
              - quota_exceeded
              - rate_limited
              - timeout
              - stale_frontier
              - authorized_grant_revoked
              - device_recovery_ssk_generation_mismatch
              - cursor_expired
              - cursor_integrity_invalid
              - cursor_revoked
              - cursor_unrecognized
              - actor_seq_invalid
              - anchor_ref_stale
              - anchor_ref_unknown
              - audience_unknown
              - blob_digest_mismatch
              - blob_expired
              - blob_presign_invalid
              - blob_quota_exceeded
              - cursor_invalid
              - device_unknown
              - did_already_exists
              - did_not_found
              - did_revoked
              - frontier_unavailable
              - handle_unverified
              - key_replay
              - keypackage_already_consumed
              - keypackage_unknown
              - one_time_keys_exhausted
              - policy_stale
              - policy_unavailable
              - principal_unknown
              - push_gateway_unreachable
              - push_payload_too_large
              - push_target_unknown
              - push_token_invalid
              - push_token_unknown
              - quarantine
              - snapshot_authority_unverified
              - snapshot_unavailable
              - stream_dropped
              - stream_resync_required
              - too_large
              - unsupported_did_method
              - unsupported_media_policy
              - unsupported_feature
              - unsupported_event_kind
              - not_implemented
              - projection_incomplete
              - internal_error
              - temporarily_unavailable
              - service_unavailable
              - policy_combination_invalid
              - history_sharing_policy_missing
              - history_not_visible
              - anchorer_recovery_missing
              - unsupported_lattice_type
              - profile_unsupported
              - unsupported_join_rule
              - failed_precondition
              - contact_not_accepted
              - contact_consent_missing
              - unsupported_digest_algorithm
              - anchor_incomplete
              - franking_proof_unavailable
              - turn_credential_expired
              - delivery_binding_stale
              - delivery_binding_handed_over
              - delivery_binding_unresolvable
              - historical_only
              - applet_registration_unauthorized
              - applet_install_plan_mismatch
              - applet_e2ee_join_unauthorized
              - applet_revoked
              - invalid_avatar_blob_ref
              - unsupported_profile_patch_path
              - session_grant_not_found
              - session_revoke_selector_conflict
            message:
              type: string
            retry_after_ms:
              type:
              - integer
              - 'null'
            details:
              type: object
        request_id:
          type: string
    Problem:
      type: object
      description: |
        RFC 9457 (application/problem+json) projection of the default
        ErrorEnvelope, returned by HTTP-binding services only when the request
        carries `Accept: application/problem+json`. This is a content-negotiated
        view over the default `{ok:false, error:{...}}` wire, not a new error
        namespace: `type` carries the same standard `error.code` string from
        artifacts/registry/error-code-registry.json. Field mapping:
        `error.code → type`, `error.message → detail`, HTTP status → `status`,
        `request_id → instance`. See zh/sync/api-conventions.md §5.
      properties:
        type:
          type: string
          description: |
            Problem type identifier. Carries the standard `error.code` string
            (MAY be expressed as a URN or relative URI). Clients MUST treat
            unknown values as forward-compatible failures.
        title:
          type: string
          description: Optional short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code, mirroring the response status line.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Developer-facing diagnostic text (from `error.message`); MUST NOT be used for stable program logic.
        instance:
          type: string
          description: Request identifier (from `request_id`).
      additionalProperties: true
    ServiceDescribe:
      type: object
      description: |
        Service capability descriptor returned by `ck.server.describe` and the
        per-surface `ck.*.describe` operations. Required fields are normatively
        listed in `zh/sync/service-surface.md` §3.0 and §17. Implementations MUST
        emit `plaintext_visibility` so callers can honor the plaintext-boundary
        rule from `zh/overview/architecture.md` §2.3.
      required:
      - protocol_version
      - service_type
      - service_did
      - trust_domain
      - supported_profiles
      - supported_operations
      - supported_bindings
      - supported_features
      - auth_metadata
      - limits
      - plaintext_visibility
      - implemented_features
      - claimed_profiles
      - verified_profiles
      - experimental_features
      - compat_surfaces
      - development_mode
      anyOf:
      - required:
        - rate_limit_policy
      - required:
        - rate_limit_policy_id
      properties:
        protocol_version:
          type: string
        service_type:
          type: string
        service_did:
          type: string
        trust_domain:
          type: string
          pattern: ^ck:trust_domain:[a-z0-9][a-z0-9._\-:]{0,127}$
          description: Deployment trust-domain boundary used for cross-deployment replay protection.
        supported_profiles:
          type: array
          items:
            type: string
        supported_operations:
          type: array
          items:
            type: string
        supported_bindings:
          type: array
          description: |
            HTTP / gRPC / WebSocket / MQ binding declarations for this service.
            Each entry SHOULD specify `kind`, optional `version`, and binding-
            specific endpoint details. See `zh/sync/transport-bindings.md`.
          items:
            type: object
        supported_features:
          type: array
          description: |
            Optional feature identifiers (`ck.feature.*`) this service supports.
            Mirrors the `supported_features[]` declaration in
            `zh/sync/service-surface.md` §3.0. Distinct from `supported_profiles`:
            features are finer-grained capability tokens that may be required
            via `Event.requirements.features[]`.
          items:
            type: string
        plaintext_visibility:
          type: object
          description: |
            Declaration of which closed data classes, event kinds, payload paths,
            blob purposes, or projection outputs the service consumes in
            plaintext (vs encrypted envelope). Privacy-boundary fields per
            `zh/overview/architecture.md` §2.3 and `zh/sync/service-surface.md`
            §17. Omission is NOT equivalent to "no plaintext access" — callers
            MUST treat a missing declaration as untrusted and refuse to register
            this service as a `plaintext_visible_services` member.
          additionalProperties: true
          properties:
            data_classes:
              type: array
              items:
                type: string
                enum:
                  - message_content
                  - flow_content
                  - attachment_plaintext
                  - attachment_preview
                  - thumbnail
                  - full_text_index
                  - search_snippet
                  - embedding
                  - notification_summary
                  - inbox_preview
                  - media_plaintext
                  - derived_plaintext
                  - account_private_state
                  - profile_private_field
            max_visibility:
              type: string
              enum:
                - none
                - derived_plaintext
                - private_plaintext
            event_kinds:
              type: array
              items:
                type: string
            payload_paths:
              type: array
              items:
                type: string
            blob_purposes:
              type: array
              items:
                type: string
            projection_outputs:
              type: array
              items:
                type: string
            notes:
              type: string
        auth_metadata:
          type: object
        supported_reducer_profiles:
          type: array
          items:
            type: string
        supported_schema_profiles:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        rate_limit_policy_id:
          type: string
        rate_limit_policy:
          type: object
          additionalProperties: true
        egress_network_policy:
          type: object
          description: |
            Coarse outbound-network policy for SSRF protection. Public describe
            MAY omit sensitive allowlist entries; authenticated operator
            describe MAY return the complete policy. Normative semantics are
            defined in `zh/sync/api-conventions.md` §11.2.
          required:
          - version
          - private_network_default
          - protected_purposes
          - dns_rebind_protection
          - redirect_recheck
          properties:
            version:
              type: integer
              minimum: 1
            private_network_default:
              type: string
              enum:
              - deny
              - deny_unless_explicit_exception
            protected_purposes:
              type: array
              items:
                type: string
                enum:
                - did_resolution
                - federation
                - media_fetch
                - policy_server
                - snapshot_fetch
                - webhook
                - applet
                - agent
                - directory
                - push
            denied_cidrs:
              type: array
              items:
                type: string
            allowed_cidrs:
              type: array
              items:
                type: string
            allowed_private_exceptions:
              type: array
              items:
                type: object
            dns_rebind_protection:
              type: boolean
            redirect_recheck:
              type: boolean
        implemented_features:
          type: array
          description: |
            Feature ids the service has implementation code for but does NOT
            necessarily claim conformance for. Tooling that builds a
            conformance matrix MUST treat this strictly weaker than
            `claimed_profiles`. See `zh/sync/service-surface.md` §3.0 and
            `ck.schema.service_describe.v1`.
          items:
            type: string
        claimed_profiles:
          type: array
          description: |
            Profiles the service self-claims membership in. `claim_kind` MUST
            be `self_claimed`; cotest-verified entries MUST appear in
            `verified_profiles` instead. See §3.0.
          items:
            type: object
            required:
            - profile_id
            - claim_kind
            properties:
              profile_id:
                type: string
              claim_kind:
                type: string
                enum:
                - self_claimed
        verified_profiles:
          type: array
          description: |
            Profiles for which a cotest run has produced a passing artifact.
            Each entry MUST carry `cotest_run_id`, `artifact_digest`,
            `artifact_ref`, `cotest_issuer_did`, `signature` and `timestamp`.
            When `development_mode=true` this array MUST be
            empty (see `zh/sync/service-surface.md` §3.0 and
            `ck.schema.service_describe.v1`).
          items:
            type: object
            required:
            - profile_id
            - claim_kind
            - cotest_run_id
            - artifact_digest
            - artifact_ref
            - cotest_issuer_did
            - signature
            - timestamp
            properties:
              profile_id:
                type: string
              claim_kind:
                type: string
                enum:
                - cotest_verified
              cotest_run_id:
                type: string
              artifact_digest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              artifact_ref:
                type: string
                minLength: 1
                description: URI or transparency-log reference from which the cotest artifact can be fetched.
              cotest_issuer_did:
                type: string
                pattern: ^did:[a-z0-9]+:[^\s#?]+$
                description: DID of the cotest authority that signed the artifact statement.
              signature:
                type: string
                minLength: 1
                description: Signature over profile_id, cotest_run_id, artifact_digest, artifact_ref, issuer and timestamp.
              timestamp:
                type: string
                format: date-time
              expires_at:
                type: string
                format: date-time
        experimental_features:
          type: array
          description: |
            Feature ids that the service exposes but does NOT promise stable
            interop for. Clients MUST NOT treat these as load-bearing for
            protocol-level decisions.
          items:
            type: string
        compat_surfaces:
          type: array
          description: |
            External-interop surfaces this service exposes outside its
            claimed Cokret v1 conformance.
            `kind` is one of `matrix_passthrough`, `mimi_passthrough`,
            `external_interop`.
          items:
            type: object
            required:
            - name
            - kind
            properties:
              name:
                type: string
              kind:
                type: string
                enum:
                - matrix_passthrough
                - mimi_passthrough
                - external_interop
        development_mode:
          type: boolean
          description: |
            Mirror of the service's development_mode flag. When true,
            `verified_profiles` MUST be empty.
    IdentityResolveOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/IdentityResolveOutcome
    AccountSubscribeFrame:
      $ref: ../schemas/account-subscribe-frame.schema.json
    ActorProfile:
      $ref: ../schemas/actor-profile.schema.json
    HandleClaim:
      $ref: ../schemas/handle-claim.schema.json
    AccountView:
      $ref: ../schemas/account-operations.schema.json#/$defs/account_view
    AccountRegisterRequestBody:
      $ref: ../schemas/account-operations.schema.json#/$defs/account_register_request_body
    AccountRegisterOutcome:
      $ref: ../schemas/account-operations.schema.json#/$defs/account_register_outcome
    ContactRequestRequestBody:
      $ref: ../schemas/contact-operations.schema.json#/$defs/contact_request_request_body
    ContactRequestOutcome:
      $ref: ../schemas/contact-operations.schema.json#/$defs/contact_request_outcome
    ContactRespondRequestBody:
      $ref: ../schemas/contact-operations.schema.json#/$defs/contact_respond_request_body
    ContactRespondOutcome:
      $ref: ../schemas/contact-operations.schema.json#/$defs/contact_respond_outcome
    ContactList:
      $ref: ../schemas/contact-operations.schema.json#/$defs/contact_list
    ContactTombstoneRequestBody:
      $ref: ../schemas/contact-operations.schema.json#/$defs/contact_tombstone_request_body
    ContactTombstone:
      $ref: ../schemas/contact-operations.schema.json#/$defs/contact_tombstone
    DirectConversationResolveRequestBody:
      $ref: ../schemas/contact-operations.schema.json#/$defs/direct_conversation_resolve_request_body
    DirectConversationResolveOutcome:
      $ref: ../schemas/contact-operations.schema.json#/$defs/direct_conversation_resolve_outcome
    AccountUpdateProfileRequestBody:
      $ref: ../schemas/account-operations.schema.json#/$defs/account_update_profile_request_body
    AccountUpdateProfileOutcome:
      $ref: ../schemas/account-operations.schema.json#/$defs/account_update_profile_outcome
    SessionRevokeRequestBody:
      $ref: ../schemas/account-operations.schema.json#/$defs/session_revoke_request_body
    SessionRevokeOutcome:
      $ref: ../schemas/account-operations.schema.json#/$defs/session_revoke_outcome
    BottomDiagnostic:
      $ref: ../schemas/bottom.schema.json
    KeysUploadRequestBody:
      $ref: ../schemas/keys-operations.schema.json#/$defs/keys_upload_request_body
