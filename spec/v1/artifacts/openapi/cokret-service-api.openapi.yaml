  /_cokret/self/events:
    post:
      operationId: ck.events.submit
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
        contentDigest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsSubmitRequest
      responses:
        '200':
          description: Event accepted (or duplicate / partial; see status field)
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            X-Cokret-Request-Id:
              $ref: '#/components/headers/XCokretRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsSubmitResponse'
    get:
      operationId: ck.events.query
      x-cokret-required-any-of:
      - - realms
      - - actors
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
      summary: Query / backfill events with cursor pagination.
      description: |
        Returns a page of events according to `before` / `after` cursor anchors.

        Either or both of `before` / `after` may be given:
          - `before=<cursor>` alone: events most recently *before* this cursor
            position (history backfill, UI-friendly). Default `order=descending`.
          - `after=<cursor>` alone: events earliest *after* this cursor position
            (catch-up, reducer-friendly). Default `order=ascending`.
          - both: open interval `(after, before)`. Default `order=descending`.
          - neither: equivalent to `before=<server head>` (latest first page).

        `before` and `after` are both EXCLUSIVE of the cursor position.

        Response `prev_cursor` / `next_cursor` are absolute-direction cursors:
        `prev_cursor` points toward older events (pass to next `before=`);
        `next_cursor` points toward newer events (pass to next `after=`).
        See zh/sync/service-http-binding.md §3.3 and zh/sync/api-conventions.md
        §7.0 for the full semantic table.

      parameters:
      - name: realms
        in: query
        description: Filter by Realm IDs. Multiple values are UNION within the parameter; cross with `actors` is intersection.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RealmId'
          minItems: 1
        style: form
        explode: true
      - name: actors
        in: query
        description: Filter by Actor DIDs. Multiple values are UNION within the parameter; cross with `realms` is intersection.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActorDid'
          minItems: 1
        style: form
        explode: true
      - name: before
        in: query
        description: Return events strictly older than this cursor position. Pair with response `prev_cursor` to walk further backward.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: after
        in: query
        description: Return events strictly newer than this cursor position. Pair with response `next_cursor` to walk further forward.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: order
        in: query
        description: |
          Batch ordering. `default` follows the proximity-to-anchor rule
          (before-only → descending; after-only → ascending; both → descending);
          `ascending` / `descending` force the order.
        schema:
          type: string
          enum:
          - default
          - ascending
          - descending
          default: default
      - name: limit
        in: query
        description: Max events to return; server enforces an upper bound (see scalability-constraints.md).
        schema:
          type: integer
          minimum: 1
      - name: filters
        in: query
        description: Optional structured filter object (kind, payload predicates). See zh/sync/service-http-binding.md §3.3.
        schema:
          type: object
        style: deepObject
        explode: true
      responses:
        '200':
          description: Event query page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsQueryResponse'
        '400':
          description: |
            `invalid_param` — unrecognized `order` enum value or malformed cursor.
  /_cokret/self/events/query:
    post:
      operationId: ck.events.query_post
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
        contentDigest: []
      summary: ck.events.query in HTTP POST body form (for long/complex queries).
      description: |
        Semantically identical to `GET /_cokret/self/events` (`ck.events.query`); the same
        selector / cursor / order / filter parameter set is transported as a
        JSON request body instead of URL query parameters. Use this form when
        any of:

          - The URL would exceed the deployment's practical limit (proxies /
            CDNs commonly cap at 4–8 KiB). Large `realms[]` / `actors[]` lists
            or a non-trivial `filters` object cross this threshold quickly.
          - Operators would otherwise log full URL query strings (which can
            inadvertently capture sensitive filter contents in access logs).

        The response shape (`events[]`, `prev_cursor`, `next_cursor`,
        `has_more`) matches the GET form exactly. Cursor pagination semantics
        (proximity-to-anchor default order, absolute prev / next directions)
        come from the same source — see zh/sync/service-http-binding.md §3.3.

        gRPC / MQ bindings reuse the canonical `Events/Query` channel; this
        operation_id is a HTTP-only binding variant of `ck.events.query` to keep
        OpenAPI / SDK generators round-trippable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsQueryPostRequest
      responses:
        '200':
          description: Event query page (same shape as GET /_cokret/self/events response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsQueryResponse'
        '400':
          description: |
            `invalid_param` — unrecognized `order` enum value or malformed cursor.
  /_cokret/self/events/subscribe:
    get:
      operationId: ck.events.subscribe
      x-cokret-required-any-of:
      - - realms
      - - actors
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
      summary: Streaming event subscription with optional catch-up replay.
      description: |
        Opens a streaming subscription scoped by `realms[]` / `actors[]`. Returns
        events from `after=<cursor>` (exclusive) forward. Subscribe naturally
        moves only toward newer events; there is no `before` / `order`
        parameter.

        With `catchup=true` and `after=<cursor>` the server first replays
        the bounded catch-up range from that cursor up to the current frontier,
        then emits `catchup_complete` per Realm and continues with live frames.
        This is not a request for all historical events; full history is read
        through `GET /_cokret/self/events` pagination / range queries.
      parameters:
      - name: realms
        in: query
        description: Filter by Realm IDs. UNION within, intersection with `actors[]`.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RealmId'
          minItems: 1
        style: form
        explode: true
      - name: actors
        in: query
        description: Filter by Actor DIDs. UNION within, intersection with `realms[]`.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActorDid'
          minItems: 1
        style: form
        explode: true
      - name: after
        in: query
        description: Subscription start cursor (exclusive). Same semantics as ck.events.query's `after=` parameter.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: catchup
        in: query
        description: When true and `after` is present, the server first replays the bounded catch-up range from `after=` to the current frontier, then transitions to live. This is not full-history retrieval.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Streaming event subscription with optional catch-up replay
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/EventsSubscribeFrame'
  /_cokret/self/events/describe:
    get:
      operationId: ck.events.describe
      security: []
      responses:
        '200':
          description: Events API capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescribe'
  /_cokret/self/events/{event_id}:
    get:
      operationId: ck.events.get
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EventId'
      - name: include_payload
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Event envelope with optional visibility / receipt hints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventGetResponse'
  /_cokret/self/events/resolve:
    post:
      operationId: ck.events.resolve
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        contentDigest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsResolveRequest'
      responses:
        '200':
          description: Resolved events keyed by event_id / event_digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResolveResponse'
  /_cokret/self/events/frontier:
    get:
      operationId: ck.events.frontier
      x-cokret-required-any-of:
      - - actor_id
      - - realm_id
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
      - {}
      parameters:
      - name: actor_id
        in: query
        schema:
          $ref: '#/components/schemas/ActorDid'
      - name: realm_id
        in: query
        schema:
          $ref: '#/components/schemas/RealmId'
      - name: peer_role
        in: query
        schema:
          type: string
          enum:
          - account_client
          - federation_peer
          - anonymous_health
          default: account_client
        description: Frontier caller role. federation_peer requires service-to-service authentication with Source/Destination trust-domain headers and Request-Canonical-Digest; anonymous_health MAY be unauthenticated but MUST be rate-limited and only returns frontier_root summaries.
      responses:
        '200':
          description: Event frontier visible to caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsFrontierResponse'
  /_cokret/self/ephemeral:
    post:
      operationId: ck.ephemeral.send
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        contentDigest: []
      summary: Send a broadcast ephemeral signal.
      description: |
        Sends a `ck.schema.ephemeral_envelope.v1` broadcast signal (`ck.presence`,
        `ck.typing`, `ck.receipt.read`, or `ck.call.signal`) into the Sync
        Service fanout path. This endpoint never persists the signal as a
        durable Event and never advances actor_seq, Anchor state, or Realm
        frontier. Point-to-point device verification signals use
        `ck.device_messages.put` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/ephemeral-envelope.schema.json
      responses:
        '200':
          description: Ephemeral signal accepted into fanout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EphemeralSubmitResponse'
        '400':
          description: |
            `invalid_param` or `schema_violation` — malformed envelope, unsupported
            kind, expired signal, or TTL above the hard ceiling.
        '403':
          description: |
            `capability_denied` or `policy_violation` — caller cannot broadcast
            this signal in the Realm, or the effective read-receipt policy
            disables `ck.receipt.read`.
  /_cokret/self/rtc/token:
    post:
      operationId: ck.call.media.token_exchange
      security:
      - bearerAuth: []
      summary: Exchange Cokret capability proof for a backend media token.
      description: |
        Media service token exchange operation (CKP-0010,
        zh/crypto-media/media-service-binding.md §3). Issues a short-lived
        (TTL ≤ 600s, SHOULD ≤ 300s) backend_token + participant_binding for
        joining a focus declared in `ck.realm.media_service.foci[]`.

        Same wire across all backend types (livekit / mediasoup / janus /
        cokret-native); only `backend_token` shape is type-specific and opaque
        to the protocol layer (parsed by backend SDK only).

        Token issuer MUST be one of the Realm-authorized media service DIDs;
        clients MUST reject otherwise (`token_issuer_unauthorised`). Issuer
        MUST validate: device proof, `ck.call.join` capability, focus_id
        membership in current `foci[]`, session_focus persistence, MLS
        governance binding policy_root freshness, and `media_service_decrypts`
        pre-conditions (§10.5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/CallMediaTokenExchangeRequest
      responses:
        '200':
          description: Token exchange accepted; backend_token + participant_binding returned.
          content:
            application/json:
              schema:
                $ref: ../schemas/service-operation-dtos.schema.json#/$defs/CallMediaTokenExchangeResponse
        '403':
          description: |
            `capability_denied` — actor lacks `ck.call.join` or
            requested `desired_media` exceeds granted sub-capabilities; or
            `token_issuer_unauthorised` when the issuing DID is not registered
            in `ck.realm.media_service.service_id`.
        '409':
          description: |
            `focus_mismatch` — requested `focus_id` differs from the
            already-committed `ck.call.state.session_focus`; clients MUST
            re-target the established focus rather than retrying.
        '412':
          description: |
            `mls_governance_binding_stale` — current MLS epoch policy_root
            does not cover the `ck.realm.media_service` cell; or
            `media_plaintext_service_not_authorised` for SFUs negotiating
            decryption role without `plaintext_visible_services` entry.
        '422':
          description: |
            `unknown_focus_type` — `focus_id` resolves to a `foci[]` entry
            whose `type` is unsupported by this token issuer; or
            `media_service_foci_required` when `ck.realm.media_service` does
            not declare explicit media foci.
  /_cokret/self/account/viewer:
    get:
      operationId: ck.account.viewer
      security:
      - bearerAuth: []
      summary: Holder-bound one-shot read of the current account projection.
      description: |
        Returns the authenticated principal's account projection: principal_id,
        lifecycle state, device summaries, optional ActorProfile, and signed
        handle-claim evidence or refs. This endpoint is distinct from
        ck.account.describe, which describes service capabilities.

        The response MUST NOT use an unsigned bare handle as authoritative
        identity. When present, primary_handle_claim is a complete
        ck.schema.handle_claim.v1 object; otherwise clients use
        primary_handle_claim_ref and handle_claim_digests to refresh their
        local claim cache.
      responses:
        '200':
          description: Current account viewer projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountViewerResponse'
  /_cokret/self/account/subscribe:
    get:
      operationId: ck.account.subscribe
      security:
      - bearerAuth: []
      summary: Streaming push of account-aggregate deltas (NDJSON frames).
      description: |
        Long-lived streaming subscription that pushes cross-Realm
        account-aggregate deltas (cross-Realm frontier, to_device queue,
        account_data, device_lists, presence, unread / notification counts)
        as new data becomes available. Response is `application/x-ndjson`;
        each line is a self-contained frame object — see
        AccountSubscribeFrame for frame kinds (`delta`, `frontier`,
        `heartbeat`, `catchup_complete`, `dropped`, `resync_required`,
        `unauthorized`).

        Symmetric with ck.events.subscribe (per-Realm event log streaming);
        both share resume semantics (`after=<cursor>` exclusive start).
        `dropped` requires account-aggregate catch-up by reconnecting with
        `after=<cursor>&catchup=true`; `resync_required` requires local
        rebuild / initial account sync. `dropped` / `resync_required` may
        carry `reconnect_after_ms`, a minimum server-directed delay before
        opening another subscription for the same principal/device/filter
        scope. Replaces the prior Matrix-derived long-poll ck.account.sync.
      parameters:
      - in: header
        name: X-Cokret-Wait-For
        required: false
        description: Barrier cursor (purpose=barrier) returned from a prior write. Server holds the first delta frame until the local frontier covers target.event_id, or emits an error frame (timeout / stale_frontier / temporarily_unavailable).
        schema:
          type: string
          pattern: '^ck:cursor:.+$'
      - name: after
        in: query
        description: |
          Subscription start cursor (exclusive). Frames are pushed after this
          cursor position. Omit when there is no usable account cursor; with
          `catchup=true` this starts initial account sync and the
          server first emits a baseline delta.
        schema:
          type: string
          pattern: '^ck:cursor:.+$'
      - name: catchup
        in: query
        description: |
          When true and `after` is present, server first replays the bounded
          account-aggregate catch-up range after the `after=` cursor, emits
          `catchup_complete`, then transitions to real-time push. When true
          and `after` is omitted, this is initial account sync: server first
          emits a current baseline delta, then `catchup_complete`, then
          real-time push. This parameter never means "return all history";
          complete event history is retrieved via `GET /_cokret/self/events`.
        schema:
          type: boolean
          default: false
      - name: filter
        in: query
        description: Optional structured filter object (Realm subset, kinds, event-fields). See zh/sync/client-sync.md §2.
        schema:
          type: object
        style: deepObject
        explode: true
      - name: set_presence
        in: query
        description: Presence intent for this connection — propagated to other Realms on accept. Equivalent to the field of the same name in the legacy long-poll request body.
        schema:
          type: string
          enum:
          - online
          - offline
          - unavailable
      responses:
        '200':
          description: |
            Streaming NDJSON frame channel. Each newline-delimited JSON object
            conforms to AccountSubscribeFrame. Frames continue until the client
            disconnects, the server emits `dropped` / `resync_required`, or the
            connection is closed for transport reasons.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AccountSubscribeFrame'
  /_cokret/self/account/profile:
    post:
