      summary: Update the authenticated principal's Actor Profile projection.
      description: |
        Holder-bound service wrapper around ck.profile.update / Actor Profile
        projection. The request body is UpdateProfileRequest {patch}; patch
        paths are limited to display_name, avatar_blob_ref, and
        profile_fields.<key>. Existing bio fields migrate to profile_fields.bio.

        The Cokret protocol path rejects avatar_url and any handle, lifecycle,
        principal, actor_kind, accountability, authorization, or handle-claim
        path. Implementations that need avatar_url compatibility must resolve or
        upload it to a Blob in a compatibility layer before writing
        avatar_blob_ref.
      responses:
