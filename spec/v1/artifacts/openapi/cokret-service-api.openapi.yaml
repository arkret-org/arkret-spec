        schema:
          $ref: '#/components/schemas/Cursor'
      - name: order
        in: query
        description: Batch ordering. `default` follows the proximity-to-anchor rule.
        schema:
          type: string
          enum:
          - default
          - ascending
          - descending
          default: default
      - name: limit
        in: query
        description: Max events to return; server enforces an upper bound.
        schema:
          type: integer
          minimum: 1
      - name: filters
        in: query
        description: Optional structured filter object.
        schema:
          type: object
        style: deepObject
        explode: true
