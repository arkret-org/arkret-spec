  /blob/get:
    head:
      operationId: cx.blob.head
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
      - presignParam: []
      responses:
        '200':
          description: Blob metadata
    get:
      operationId: cx.blob.get
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
      - presignParam: []
      parameters:
      - in: header
        name: Range
        schema:
          type: string
      responses:
        '200':
          description: Blob content
          headers:
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    parameters:
    - name: blob_ref
      in: query
      required: true
      description: Content-addressed blob reference (`cx:blob:sha256:<hex>`) or metadata id (`cx:blob:<uuid>`).
      schema:
        type: string
    - name: presign
      in: query
      required: false
      description: |
        Pre-signed authorization token returned by `cx.blob.presign`. When
        present, the request is authenticated solely by this token — the
        `Authorization` header MUST be absent and is rejected if both are
        supplied. Pre-signed mode is a deliberate carve-out of the
        "no credentials in URL" rule (see zh/security/server-threat-model.md
        §2.1 #21) so that browser primitives (`<img src>`, `<video src>`,
        `<link href>`) can render protected media. Carries a server-signed
        envelope binding `blob_ref`, `expires_at`, `purpose`, requester
        identity hint, and an issuance nonce. The identity hint is diagnostic
        only and does not authenticate the current bearer. Pre-signed URLs MUST
        be short TTL (≤ 1 h), single-blob, read-only, and revocable. NOT permitted
        for E2EE attachment ciphertext fetch — those MUST keep `blob_ref`
        out of the URL the server can log. See zh/crypto-media/media-and-blob.md
        §5.4.
      schema:
        type: string
  /blob/presign:
    post:
      operationId: cx.blob.presign
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - blob_ref
              properties:
                blob_ref:
                  type: string
                  description: Target blob. MUST be a content-addressed ref or visible blob metadata id.
                realm_id:
                  type: string
                  description: Realm binding for Realm-owned blobs. Servers MUST include the same realm_id in the presign envelope and reject mismatches with blob metadata; only deployment-public/global blobs may omit this field.
                max_age_seconds:
                  type: integer
                  minimum: 1
                  maximum: 3600
                  description: Client-requested TTL upper bound. Server clamps to the smaller of this value, the issuing grant's `blob_presign_max_ttl_seconds` constraint, and the deployment-level cap.
                purpose:
                  type: string
                  enum:
                  - media_inline
                  - thumbnail
                  - download
                  description: Intended rendering / download mode. Servers MAY apply purpose-specific Content-Disposition or rate limits.
      responses:
        '200':
          description: Pre-signed URL issued
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - expires_at
                properties:
                  url:
                    type: string
                    format: uri
                    description: Fully-qualified URL clients can pass to browser primitives. Contains the `presign` query parameter, `blob_ref`, and a presign envelope bound to `realm_id` for Realm-owned blobs.
                  expires_at:
                    type: string
                    format: date-time
                    description: Server-determined expiry; SHOULD be earlier than `now() + max_age_seconds`.
                  purpose:
                    type: string
                    description: Echo of the issued `purpose`.
        '403':
          description: |
            `capability_denied` — caller lacks `cx.blob.presign` for this
            blob or this purpose; or the grant's TTL constraint forbids the
            requested `max_age_seconds`.
        '404':
          description: |
            `not_found` — blob does not exist or is not visible to the
            caller. MUST NOT differentiate between non-existence and lack of
            visibility.
