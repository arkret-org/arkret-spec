openapi: 3.1.0
info:
  title: Contrix Service API
  version: 1.0.0
  summary: Canonical Contrix service surface and admin/account bindings
  description: 'Authoritative source for operations and error codes is the contract catalog at

    `artifacts/registry/contract-catalog.json` and the error registry at

    `artifacts/registry/error-code-registry.json`.


    This OpenAPI document is the canonical HTTP binding for registered service

    operations.


    **Typed vs generic schema policy**:


    Stable core operations on the events / account / snapshot / identity /
    authz data path

    carry **typed request/response schemas** so SDK generators can derive

    operation-specific required fields directly from OpenAPI without consulting

    prose. The typed surface currently covers `cx.events.{submit, get, resolve,

    query, query_post, frontier}`, `cx.account.subscribe`, `cx.snapshot.head`,

    `cx.identity.{resolve, get_document, get_receipts, submit_did_operation}`, `cx.authz.{check,

    get_effective_grants}`, and the ServiceDescribe envelope. The corresponding

    component schemas are named `EventsSubmitBatchRequest`,

    `EventsSubmitFederationRequest`, `EventsSubmitResponse`, `EventGetResponse`,

    `EventsResolveRequest` / `EventsResolveResponse`, `EventsQueryResponse`,

    `EventsFrontierResponse`, `EphemeralSubmitResponse`, `SnapshotHeadResponse`,

    `IdentityResolveResponse` / `IdentityGetDocumentResponse`,
    `DidOperationSubmitRequest` / `DidOperationSubmitResponse`,

    `AuthzCheckRequest` / `AuthzCheckResponse`, `GrantListResponse`,

    `ServiceDescribe`.


    Extension / interop / deployment-local operations (directory, applet, MIMI,

    push, moderation, admin, etc.) continue to use the

    generic `OperationRequest` / `OperationResult` envelope as their HTTP

    binding shape. Operation-specific required fields for these are defined by

    the normative sections under `zh/sync/` and by the referenced JSON Schemas;

    when an extension surface stabilizes (e.g. graduates from interop_bridge

    tier toward extension), its OpenAPI binding SHOULD be tightened to a typed

    schema.


    Default authentication: bearer token plus HTTP Message Signature for

    service-to-service calls (see `zh/sync/service-http-binding.md` §2.2). Public

    metadata endpoints explicitly noted as `public_metadata` may be unauthenticated;

    every other path requires at least one of the declared securitySchemes.


    Path prefix convention: bare paths (e.g. `/events`, `/identity/resolve`)

    inherit the global servers prefix `/api/v1`.

    Paths under the deployment-local namespaces `/contrix/v1/*`, `/auth/account/*`,

    `/admin/*`, and `/.well-known/*` MUST carry a path-level

    `servers: - url: https://{host}` override so the URL is absolute and does not

    get the protocol `/api/v1` prefix. Implementations and SDK generators MUST

    honor path-level `servers` overrides; the corresponding `operation-registry.json`

    `http` field always records the bare (post-prefix) path.'
# Default is authenticated. SDKs / lint / threat-model audits still require
# every operation to declare its own `security:` block, but the document-level
# fallback MUST be fail-closed if a future operation is added incorrectly.
# Operations that are truly unauthenticated (public metadata / callback proof
# endpoints) declare `security: []` explicitly.
security:
- bearerAuth: []
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        User-session bearer token (passkey / OIDC / device proof). Used for
        operations called by an end-user client. NOT acceptable as the sole
        auth material for S2S federation / inter-service calls — those MUST
        also satisfy the httpMessageSignature + sourceServiceDid +
        destinationServiceDid AND group (see service-http-binding.md §2.2).
    httpMessageSignature:
      type: apiKey
      in: header
      name: Signature
      description: |
        RFC 9421 HTTP Message Signature applied with the source service DID's
        verification key. When present, the request MUST also include
        Source-Service-DID / Destination-Service-DID / Content-Digest (the
        latter only for requests with a body); federation event push also MUST
        include Source-Trust-Domain / Destination-Trust-Domain and
        Request-Canonical-Hash. These are modeled as separate apiKey
        securitySchemes and MUST appear in the same security AND group as
        httpMessageSignature when required by the operation.
    sourceServiceDid:
      type: apiKey
      in: header
      name: Source-Service-DID
      description: |
        Required companion to httpMessageSignature. Identifies the originating
        service DID and MUST be covered by the signature transcript. SDK
        generators MUST treat the absence of this header on S2S endpoints as
        an authentication failure, not a 400.
    destinationServiceDid:
      type: apiKey
      in: header
      name: Destination-Service-DID
      description: |
        Required companion to httpMessageSignature. Identifies the intended
        recipient service DID (anti-misdirection / cross-tenant guard). MUST
        match the deployment-resolved service identity; mismatched requests
        MUST be rejected before reaching reducer / business logic.
    sourceTrustDomain:
      type: apiKey
      in: header
      name: Source-Trust-Domain
      description: |
        Federation companion to httpMessageSignature. Identifies the source
        deployment trust domain (`cx:trust_domain:<scope>`) and MUST be covered
        by the signature transcript.
    destinationTrustDomain:
      type: apiKey
      in: header
      name: Destination-Trust-Domain
      description: |
        Federation companion to httpMessageSignature. Identifies the receiver
        deployment trust domain (`cx:trust_domain:<scope>`) and MUST match the
        destination service / Realm receive context before reducer logic runs.
    requestCanonicalHash:
      type: apiKey
      in: header
      name: Request-Canonical-Hash
      description: |
        sha256 digest of the canonical request object used for federation
        idempotency / replay detection. MUST be covered by the HTTP Message
        Signature transcript when present.
    contentDigest:
      type: apiKey
      in: header
      name: Content-Digest
      description: |
        Required companion to httpMessageSignature on requests that carry a
        body (POST / PUT / DELETE-with-body). RFC 9530 digest header bound
        into the signature transcript so that body tampering is detected
        before any verification of structured fields. Omitted on body-less
        requests (GET / HEAD / DELETE-without-body).
    presignParam:
      type: apiKey
      in: query
      name: presign
      description: |
        Single-blob, short-TTL pre-signed authorization (cx.blob.presign).
        Carries a server-signed envelope binding blob_ref / TTL / scope /
        issuance nonce. The nonce is an envelope/audit/revocation key, not a
        one-use media-load replay guard unless a single-use profile is declared.
        Permitted ONLY on cx.blob.get and cx.blob.head, and MUST NOT
        co-occur with bearerAuth — implementations enforce mutual exclusion.
        See media-and-blob.md §5.4 and server-threat-model.md §2.1 #21 for the
        carve-out's normative constraints.
    mutualTls:
      type: mutualTLS
      description: |
        Reserved for deployment-controlled internal channels (sovereign /
        enclave operator surfaces). Not used by any registered v1 operation
        in this OpenAPI document; deployments MAY require it as an additional
        AND constraint on admin endpoints via deployment-local profile.
  headers:
    XContrixRequestId:
      description: Stable request identifier.
      schema:
        type: string
    IdempotencyKey:
      description: Idempotency key for write requests.
      schema:
        type: string
    XContrixWaitFor:
      description: Causal frontier token the caller is waiting on.
      schema:
        type: string
    RetryAfter:
      description: Standard retry hint.
      schema:
        type: string
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - ok
      - error
      - request_id
      properties:
        ok:
          const: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Standard error code from artifacts/registry/error-code-registry.json.

                The enum below is generated from that registry; clients MUST treat

                unknown values as forward-compatible failures and SHOULD log them.'
              enum:
              - bad_json
              - bad_query
              - schema_violation
              - missing_param
              - invalid_param
              - unauthenticated
              - auth_expired
              - soft_logged_out
              - invalid_signature
              - capability_denied
              - space_frozen
              - claim_required
              - not_found
              - unrecognized_endpoint
              - method_not_allowed
              - conflict
              - cas_conflict
              - causal_conflict
              - dependency_missing
              - discussion_track_disabled
              - epoch_mismatch
              - duplicate_conflict
              - rank_exhausted
              - hlc_logical_overflow
              - payload_too_large
              - digest_mismatch
              - aad_digest_mismatch
              - payload_digest_mismatch
              - key_unavailable
              - state_mismatch
              - audit_receipt_invalidated
              - unknown_did
              - quota_exceeded
              - rate_limited
              - timeout
              - stale_frontier
              - cursor_expired
              - unsupported_feature
              - unsupported_event_kind
              - projection_incomplete
              - internal_error
              - temporarily_unavailable
              - delivery_binding_stale
              - delivery_binding_handed_over
              - historical_only
            message:
              type: string
            retry_after_ms:
              type:
              - integer
              - 'null'
            details:
              type: object
        request_id:
          type: string
    ServiceDescribe:
      type: object
      description: |
        Service capability descriptor returned by `cx.server.describe` and the
        per-surface `cx.*.describe` operations. Required fields are normatively
        listed in `zh/sync/service-surface.md` §3.0 and §17. Implementations MUST
        emit `plaintext_visibility` so callers can honor the plaintext-boundary
        rule from `zh/overview/architecture.md` §2.3.
      required:
      - protocol_version
      - service_type
      - service_did
      - trust_domain
      - supported_profiles
      - supported_operations
      - supported_bindings
      - supported_features
      - auth_metadata
      - limits
      - plaintext_visibility
      - implemented_features
      - claimed_profiles
      - verified_profiles
      - experimental_features
      - compat_surfaces
      - development_mode
      anyOf:
      - required:
        - rate_limit_policy
      - required:
        - rate_limit_policy_ref
      properties:
        protocol_version:
          type: string
        service_type:
          type: string
        service_did:
          type: string
        trust_domain:
          type: string
          pattern: ^cx:trust_domain:[a-z0-9][a-z0-9._\-:]{0,127}$
          description: Deployment trust-domain boundary used for cross-deployment replay protection.
        supported_profiles:
          type: array
          items:
            type: string
        supported_operations:
          type: array
          items:
            type: string
        supported_bindings:
          type: array
          description: |
            HTTP / gRPC / WebSocket / MQ binding declarations for this service.
            Each entry SHOULD specify `kind`, optional `version`, and binding-
            specific endpoint details. See `zh/sync/transport-bindings.md`.
          items:
            type: object
        supported_features:
          type: array
          description: |
            Optional feature identifiers (`cx.feature.*`) this service supports.
            Mirrors the `supported_features[]` declaration in
            `zh/sync/service-surface.md` §3.0. Distinct from `supported_profiles`:
            features are finer-grained capability tokens that may be required
            via `Event.requirements.features[]`.
          items:
            type: string
        plaintext_visibility:
          type: object
          description: |
            Declaration of which closed data classes, event kinds, payload paths,
            blob purposes, or projection outputs the service consumes in
            plaintext (vs encrypted envelope). Privacy-boundary fields per
            `zh/overview/architecture.md` §2.3 and `zh/sync/service-surface.md`
            §17. Omission is NOT equivalent to "no plaintext access" — callers
            MUST treat a missing declaration as untrusted and refuse to register
            this service as a `plaintext_visible_services` member.
          additionalProperties: true
          properties:
            data_classes:
              type: array
              items:
                type: string
                enum:
                  - message_body
                  - flow_body
                  - attachment_plaintext
                  - attachment_preview
                  - thumbnail
                  - full_text_index
                  - search_snippet
                  - embedding
                  - notification_summary
                  - inbox_preview
                  - media_plaintext
                  - derived_plaintext
                  - account_private_state
                  - profile_private_field
            max_visibility:
              type: string
              enum:
                - none
                - derived_plaintext
                - private_plaintext
            event_kinds:
              type: array
              items:
                type: string
            payload_paths:
              type: array
              items:
                type: string
            blob_purposes:
              type: array
              items:
                type: string
            projection_outputs:
              type: array
              items:
                type: string
            notes:
              type: string
        auth_metadata:
          type: object
        supported_reducer_profiles:
          type: array
          items:
            type: string
        supported_schema_profiles:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        rate_limit_policy_ref:
          type: string
        rate_limit_policy:
          type: object
          additionalProperties: true
        implemented_features:
          type: array
          description: |
            Feature ids the service has implementation code for but does NOT
            necessarily claim conformance for. Tooling that builds a
            conformance matrix MUST treat this strictly weaker than
            `claimed_profiles`. See `zh/sync/service-surface.md` §3.0 and
            `cx.schema.service_describe.v1`.
          items:
            type: string
        claimed_profiles:
          type: array
          description: |
            Profiles the service self-claims membership in. `claim_kind` MUST
            be `self_claimed`; cotest-verified entries MUST appear in
            `verified_profiles` instead. See §3.0.
          items:
            type: object
            required:
            - profile_id
            - claim_kind
            properties:
              profile_id:
                type: string
              claim_kind:
                type: string
                enum:
                - self_claimed
        verified_profiles:
          type: array
          description: |
            Profiles for which a cotest run has produced a passing artifact.
            Each entry MUST carry `cotest_run_id`, `artifact_hash`,
            `artifact_ref`, `cotest_issuer_did`, `signature` and `timestamp`.
            When `development_mode=true` this array MUST be
            empty (see `zh/sync/service-surface.md` §3.0 and
            `cx.schema.service_describe.v1`).
          items:
            type: object
            required:
            - profile_id
            - claim_kind
            - cotest_run_id
            - artifact_hash
            - artifact_ref
            - cotest_issuer_did
            - signature
            - timestamp
            properties:
              profile_id:
                type: string
              claim_kind:
                type: string
                enum:
                - cotest_verified
              cotest_run_id:
                type: string
              artifact_hash:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              artifact_ref:
                type: string
                minLength: 1
                description: URI or transparency-log reference from which the cotest artifact can be fetched.
              cotest_issuer_did:
                type: string
                pattern: '^did:'
                description: DID of the cotest authority that signed the artifact statement.
              signature:
                type: string
                minLength: 1
                description: Signature over profile_id, cotest_run_id, artifact_hash, artifact_ref, issuer and timestamp.
              timestamp:
                type: string
                format: date-time
              expires_at:
                type: string
                format: date-time
        experimental_features:
          type: array
          description: |
            Feature ids that the service exposes but does NOT promise stable
            interop for. Clients MUST NOT treat these as load-bearing for
            protocol-level decisions.
          items:
            type: string
        compat_surfaces:
          type: array
          description: |
            Legacy or external-interop surfaces this service exposes for
            compatibility, not as part of its claimed Contrix v1 conformance.
            `kind` is one of `matrix_passthrough`, `mimi_passthrough`,
            `legacy_alias`, `external_interop`, `deprecated_alias`.
          items:
            type: object
            required:
            - name
            - kind
            properties:
              name:
                type: string
              kind:
                type: string
                enum:
                - matrix_passthrough
                - mimi_passthrough
                - legacy_alias
                - external_interop
                - deprecated_alias
        development_mode:
          type: boolean
          description: |
            Mirror of the service's development_mode flag. When true,
            `verified_profiles` MUST be empty.
    IdentityResolveResponse:
      type: object
      properties:
        did_document:
          type: object
        key_log_head:
          type: string
        seq:
          type: integer
        receipts:
          type: array
          items:
            $ref: ../schemas/identity-receipt.schema.json
    AccountSubscribeFrame:
      $ref: ../schemas/account-subscribe-frame.schema.json
    BottomDiagnostic:
      $ref: ../schemas/bottom.schema.json

    # =========================================================================
    # Typed request / response schemas for stable core operations.
    # See zh/sync/service-http-binding.md for normative field semantics.
    # Per OpenAPI binding policy in info.description: events / account /
    # snapshot / identity / authz core surfaces carry typed schemas so SDK
    # generators can derive
    # operation-specific required fields without consulting prose. Extension /
    # interop / deployment-local surfaces continue to use generic
    # OperationRequest / OperationResult envelopes.
    # =========================================================================
    FederationServiceBindingRef:
      type: object
      description: |
        Request-level service binding snapshot carried by federation
        service-to-service cx.events.submit calls. This is metadata for the
        receiver to verify the sender's delivery decision; client writes omit it.
      required:
      - realm_id
      - space_policy_hash
      - membership_frontier
      - delivery_binding_frontier
      - destination_service_type
      - reducer_profile_hash
      properties:
        realm_id:
          type: string
          pattern: ^cx:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        space_policy_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        membership_frontier:
          type: array
          items:
            type: string
            pattern: ^cx:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        delivery_binding_frontier:
          type: array
          items:
            type: string
            pattern: ^cx:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        delivery_binding_diagnostics:
          type: object
          additionalProperties: true
        destination_service_type:
          type: string
          minLength: 1
        reducer_profile_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false

    EventsSubmitBatchRequest:
      type: object
      description: Batch cx.events.submit request used by account clients.
      required:
      - events
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: ../schemas/event-envelope.schema.json
      additionalProperties: false

    EventsSubmitFederationRequest:
      type: object
      description: Federation service-to-service cx.events.submit request body.
      required:
      - service_binding_ref
      - events
      properties:
        service_binding_ref:
          $ref: '#/components/schemas/FederationServiceBindingRef'
        events:
          type: array
          minItems: 1
          items:
            $ref: ../schemas/event-envelope.schema.json
      additionalProperties: false

    EventsSubmitResponse:
      type: object
      description: |
        Result of cx.events.submit. Tracks per-event acceptance / duplication /
        rejection along with the post-write frontier and an optional barrier
        cursor for read-your-writes.
      required:
      - status
      - accepted
      properties:
        status:
          type: string
          enum:
          - accepted
          - duplicate
          - partial
        accepted:
          type: array
          items:
            type: string
          description: Event IDs that entered the accepted set (including idempotent re-accepts of identical bodies).
        duplicate:
          type: array
          items:
            type: string
          description: Event IDs whose canonical bytes matched a prior accepted event (idempotent no-op).
        rejected:
          type: array
          items:
            type: object
            required:
            - id
            - reason_code
            properties:
              id:
                type: string
              reason_code:
                type: string
              detail:
                type: string
        quarantine:
          type: array
          items:
            type: string
          description: Event IDs deferred to async / human verification.
        actor_frontier:
          type: object
          description: Per-actor frontier after this submit (subset of full frontier visible to caller).
        realm_frontier:
          type: object
          description: Per-Realm frontier after this submit. (Renamed from the legacy 'space_frontier' field name — in v1 the replication/security boundary is the Realm, not an in-Realm Space container; the legacy name is forbidden on the current wire.)
        cursor:
          type: string
          description: Optional barrier cursor (purpose=barrier) bound to the most recently accepted event.

    EventGetResponse:
      type: object
      description: Result of cx.events.get — a single Event Envelope with optional visibility / receipt hints.
      required:
      - event
      properties:
        event:
          $ref: ../schemas/event-envelope.schema.json
        visibility:
          type: object
          description: Caller-visible policy hint for this event (history visibility class, E2EE envelope class).
        receipts:
          type: array
          description: Event batch receipts witnessing this event, if visible.
          items:
            type: object

    EventsResolveRequest:
      type: object
      description: cx.events.resolve request body. At least one of event_ids or event_hashes MUST be non-empty.
      properties:
        event_ids:
          type: array
          items:
            type: string
        event_hashes:
          type: array
          items:
            type: string
        include_payload:
          type: boolean
          default: true
      additionalProperties: false

    EventsResolveResponse:
      type: object
      description: cx.events.resolve result. `events[]` and `missing[]` plus optional `unauthorized[]` form a partition of the requested set.
      required:
      - events
      - missing
      properties:
        events:
          type: array
          items:
            $ref: ../schemas/event-envelope.schema.json
        missing:
          type: array
          description: IDs / hashes that were requested but do not exist or are not visible (indistinguishable per visibility rules).
          items:
            type: string
        unauthorized:
          type: array
          description: Optional split of missing into a separately-named bucket when policy explicitly distinguishes auth failure from non-existence.
          items:
            type: string

    EventsQueryResponse:
      type: object
      description: |
        Result of cx.events.query (GET form) and cx.events.query_post (POST/body
        form). Ordering follows the "近邻先返回" rule unless `order` was
        explicitly set on the request; see service-http-binding.md §3.3.3.
      required:
      - events
      - has_more
      properties:
        events:
          type: array
          items:
            $ref: ../schemas/event-envelope.schema.json
        prev_cursor:
          type: string
          description: Absolute-direction cursor toward older events; pass to next request's `before=`.
        next_cursor:
          type: string
          description: Absolute-direction cursor toward newer events; pass to next request's `after=`.
        has_more:
          type: boolean
          description: True if more events remain in the `prev_cursor` (older) direction; SHOULD ignore `next_cursor` direction (subscribe / poll instead).
        snapshot_bootstrap:
          $ref: '#/components/schemas/SnapshotBootstrap'

    EventsSubscribeFrame:
      type: object
      description: One NDJSON line emitted by cx.events.subscribe. `dropped` requires a usable recovery cursor; if no cursor exists, servers MUST emit `resync_required` instead.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - event
          - frontier
          - heartbeat
          - catchup_complete
          - epoch_rotation
          - dropped
          - resync_required
          - unauthorized
        realm_id:
          type: string
        cursor:
          type: string
          description: Stream cursor. REQUIRED when kind=dropped.
        payload:
          type: object
      allOf:
      - if:
          properties:
            kind:
              const: dropped
          required:
          - kind
        then:
          required:
          - realm_id
          - cursor
      additionalProperties: false

    EventsFrontierResponse:
      oneOf:
      - $ref: '#/components/schemas/EventsFrontierAccountClientResponse'
      - $ref: '#/components/schemas/EventsFrontierFederationPeerResponse'
      - $ref: '#/components/schemas/EventsFrontierAnonymousHealthResponse'

    EventsFrontierAccountClientResponse:
      type: object
      description: Account-client cx.events.frontier response.
      required:
      - frontier
      properties:
        frontier:
          type: object
          description: |
            Either an actor frontier (`{actor_id, actor_seq, event_id}`) or a
            Realm frontier (`{realm_id, anchor_id, state_root, hlc?}`) shape
            depending on which selector was passed; servers MUST NOT leak
            frontiers across visibility boundaries.
        receipts:
          type: array
          items:
            type: object
      additionalProperties: false

    EventsFrontierFederationPeerResponse:
      type: object
      description: Federation peer cx.events.frontier response. Requires S2S signed trust-domain headers.
      required:
      - frontier
      - frontier_root
      - signature
      properties:
        frontier:
          type: object
          description: Realm frontier visible to the authenticated federation peer.
        receipts:
          type: array
          items:
            type: object
        frontier_root:
          type: string
          description: Hash commitment returned for federation_peer and anonymous_health peer_role.
        actor_seq_upper_bounds:
          type: object
          description: Per-actor sequence upper bounds returned for federation_peer peer_role.
        signature:
          type: object
          description: Service signature over the frontier response when peer_role=federation_peer.
      additionalProperties: false

    EventsFrontierAnonymousHealthResponse:
      type: object
      description: Anonymous health cx.events.frontier response. MUST NOT include actor_seq_upper_bounds, receipts, frontier details, or service signature material.
      required:
      - frontier_root
      properties:
        frontier_root:
          type: string
          description: Opaque hash commitment suitable for liveness / freshness checks.
        cache_until:
          type: string
          format: date-time
          description: Earliest time until which clients SHOULD reuse this anonymous health response. Anonymous health responses MUST impose at least a 60 second cache/backoff window; clients MUST treat shorter values as 60 seconds.
        retry_after_ms:
          type: integer
          minimum: 60000
          description: Minimum retry delay for anonymous health probes when the service wants explicit polling backoff. Anonymous health responses MUST impose at least a 60 second cache/backoff window.
      additionalProperties: false

    SnapshotBootstrap:
      type: object
      description: Optional cx.events.query acceleration hint for federation pull / backfill. Verifier MUST validate signature, state_hash, snapshot_frontier, chunk digests, created_by, created_at, and authority_binding before use (these fields are bound by the manifest signature transcript — see schemas/snapshot.schema.json).
      required:
      - snapshot_ref
      - state_hash
      - snapshot_frontier
      - created_by
      - created_at
      - authority_binding
      - signature
      properties:
        snapshot_ref:
          type: string
        state_hash:
          type: string
        snapshot_frontier:
          type: array
          items:
            type: string
        created_by:
          type: string
          description: DID of the snapshot issuer; bound by the manifest signature transcript.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp ending in 'Z' when the manifest was sealed; bound by the manifest signature transcript.
        authority_binding:
          type: object
          additionalProperties: true
          description: Snapshot issuer authority evidence bound by the manifest signature transcript; mirrors schemas/snapshot.schema.json#/properties/authority_binding.
        signature:
          type: object
        verification_hints:
          type: object

    SnapshotHeadResponse:
      type: object
      description: Result of cx.snapshot.head — a signed snapshot pointer for fast bootstrap. created_by, created_at, and authority_binding are part of the signed manifest transcript (see schemas/snapshot.schema.json#/properties/signature x-canonical-bytes-include) and MUST be returned to verifiers.
      required:
      - snapshot_ref
      - state_hash
      - frontier
      - event_set_commitment
      - created_by
      - created_at
      - authority_binding
      - signature
      properties:
        snapshot_ref:
          type: string
        state_hash:
          type: string
        frontier:
          type: object
        event_set_commitment:
          type: object
        verification_hints:
          type: object
        created_by:
          type: string
          description: DID of the snapshot issuer; bound by the manifest signature transcript.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp ending in 'Z' when the manifest was sealed; bound by the manifest signature transcript.
        authority_binding:
          type: object
          additionalProperties: true
          description: Snapshot issuer authority evidence bound by the manifest signature transcript; mirrors schemas/snapshot.schema.json#/properties/authority_binding.
        signature:
          type: object
          description: Detached proof of the snapshot manifest; verifier MUST validate against signer's verification method.

    IdentityGetDocumentResponse:
      type: object
      description: Result of cx.identity.get_document — current DID Document plus normalized view hints.
      required:
      - did_document
      properties:
        did_document:
          type: object
          description: Raw DID Core document with W3C field names preserved.
        normalized_view:
          type: object
          description: |
            Optional Contrix normalized principal view (snake_case) — derived
            projection only, NOT a re-publishable DID Document. See
            zh/identity/identity-did.md §6.
        method_evidence:
          type: object
          description: Method-specific proof material (e.g. did:webvh history head, witness signatures).
        cached_at:
          type: string
          format: date-time


    CellQueryEnvelope:
      type: object
      description: 'Wire envelope for state-query / projection responses on a single
        cell. `status` MUST be `value` when the join is defined, `bottom` when the
        cell resolved to ⊥ on a `bottom=reject` lattice (caller MUST treat as
        fail-closed), and `conflict` when a `bottom=expose` lattice surfaces
        candidate heads to the projection / UI without selecting a winner. See
        zh/sync/service-surface.md §5.3 and zh/authz/event-auth-state-resolution.md
        §5.1.'
      required:
      - cell
      - status
      properties:
        cell:
          type: string
          pattern: ^cx:cell:[A-Za-z0-9._~=-]+(?::[A-Za-z0-9._~=-]+)*$
        status:
          type: string
          enum:
          - value
          - bottom
          - conflict
        value:
          description: 'Effective Lattice value when status=value. Shape is
            cell-type specific (or_set members, mv_register tuple, cas_register
            atom, fsm state, counter integer, ordered_log tail).'
        heads:
          type: array
          uniqueItems: true
          description: Candidate heads when status=conflict on a `bottom=expose`
            cell. Receivers MUST NOT use this for authorization decisions.
          items: true
        bottom:
          $ref: '#/components/schemas/BottomDiagnostic'
        anchor_view:
          type: object
          description: Anchor leaves / state_root the value or bottom was
            observed under. Mirrors `bottom.anchor_view` when status≠value.
          required:
          - leaves
          properties:
            leaves:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                pattern: ^cx:anchor:sha256:[0-9a-f]{64}$
            state_root:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
          additionalProperties: false
      additionalProperties: true
    EventStateView:
      type: object
      description: Per-event protocol-state field surfaced on /account/subscribe and /events
        responses (zh/sync/service-surface.md §5.3, zh/authz/event-auth-state-resolution.md
        §13). Implementations MUST attach this on every reducer-input Event
        included in a timeline/state response so clients can render fail-closed
        UI without recomputing the join.
      required:
      - event_id
      - event_digest
      - event_state
      properties:
        event_id:
          type: string
          pattern: ^cx:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        event_digest:
          type: string
          description: Canonical hash of the event's canonical bytes (excluding
            proofs and unsigned); equals proof.event_digest. Used as the Anchor
            frontier item for this event. Algorithm family aligned with
            schemas/anchor.schema.json#/$defs/event_digest — sha256 / sha3_256 /
            blake3 (64 hex) or sha512 (128 hex).
          pattern: ^(?:sha256|sha3_256|blake3):[0-9a-f]{64}$|^sha512:[0-9a-f]{128}$
        event_state:
          type: string
          enum:
          - pending_anchor
          - effective
          - failed_precondition
          - failed_bottom
          - rejected_anchor
          - anchorer_paused
        bottom:
          $ref: '#/components/schemas/BottomDiagnostic'
      additionalProperties: false
    DeviceMessageEnvelope:
      $ref: ../schemas/device-message.schema.json
    DeviceMessageTarget:
      type: object
      required:
      - kind
      - expires_at
      - content
      properties:
        kind:
          type: string
          pattern: ^cx\.[a-z0-9_]+(\.[a-z0-9_]+)*$
        content:
          type: object
        expires_at:
          type: string
          format: date-time
          pattern: Z$
      additionalProperties: false
    DeviceMessagesPutRequest:
