              - oidc_code_exchange
            challenge:
              type: string
              minLength: 16
            request_canonical_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            audience:
              type: string
            expires_at:
              type: string
              format: date-time
            signature:
