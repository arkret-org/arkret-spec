openapi: 3.1.0
info:
  title: Contrix Service API
  version: 1.0.0
  summary: Canonical Contrix service surface and admin/account bindings
  description: 'Authoritative source for operations and error codes is the contract catalog at

    `artifacts/registry/contract-catalog.json` and the error registry at

    `artifacts/registry/error-code-registry.json`.


    This OpenAPI document is the canonical HTTP binding for registered service

    operations. Request and response objects that are intentionally extensible are

    modeled with `OperationRequest` / `OperationResult`; operation-specific required

    fields, profile gates, and fail-closed behavior remain fixed by the corresponding

    normative sections under `zh/sync/` and by the referenced JSON Schemas.


    Default authentication: bearer token plus HTTP Message Signature for

    service-to-service calls (see `zh/sync/service-http-binding.md` §2.2). Public

    metadata endpoints explicitly noted as `public_metadata` may be unauthenticated;

    every other path requires at least one of the declared securitySchemes.'
security:
- bearerAuth: []
- httpMessageSignature: []
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    httpMessageSignature:
      type: apiKey
      in: header
      name: Signature
    mutualTls:
      type: mutualTLS
  headers:
    XContrixRequestId:
      description: Stable request identifier.
      schema:
        type: string
    IdempotencyKey:
      description: Idempotency key for write requests.
      schema:
        type: string
    XContrixWaitFor:
      description: Causal frontier token the caller is waiting on.
      schema:
        type: string
    RetryAfter:
      description: Standard retry hint.
      schema:
        type: string
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - ok
      - error
      - request_id
      properties:
        ok:
          const: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Standard error code from artifacts/registry/error-code-registry.json.

                The enum below is generated from that registry; clients MUST treat

                unknown values as forward-compatible failures and SHOULD log them.'
              enum:
              - bad_json
              - bad_query
              - schema_violation
              - missing_param
              - invalid_param
              - unauthenticated
              - auth_expired
              - soft_logged_out
              - invalid_signature
              - capability_denied
              - space_frozen
              - claim_required
              - not_found
              - unrecognized_endpoint
              - method_not_allowed
              - conflict
              - cas_conflict
              - causal_conflict
              - dependency_missing
              - discussion_track_disabled
              - epoch_mismatch
              - duplicate_conflict
              - rank_exhausted
              - hlc_logical_overflow
              - payload_too_large
              - digest_mismatch
              - aad_digest_mismatch
              - payload_digest_mismatch
              - key_unavailable
              - state_mismatch
              - audit_receipt_invalidated
              - unknown_did
              - quota_exceeded
              - rate_limited
              - timeout
              - stale_frontier
              - cursor_expired
              - unsupported_feature
              - unsupported_event_kind
              - projection_incomplete
              - internal_error
              - temporarily_unavailable
            message:
              type: string
            retry_after_ms:
              type:
              - integer
              - 'null'
            details:
              type: object
        request_id:
          type: string
    ServiceDescribe:
      type: object
      required:
      - protocol_version
      - service_type
      - service_did
      - supported_profiles
      - supported_operations
      - supported_bindings
      properties:
        protocol_version:
          type: string
        service_type:
          type: string
        service_did:
          type: string
        supported_profiles:
          type: array
          items:
            type: string
        supported_operations:
          type: array
          items:
            type: string
        supported_bindings:
          type: array
          items:
            type: object
        auth_metadata:
          type: object
        supported_reducer_profiles:
          type: array
          items:
            type: string
        supported_schema_profiles:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        rate_limit_policy_ref:
          type: string
        rate_limit_policy:
          type: object
          additionalProperties: true
    IdentityResolveResponse:
      type: object
      properties:
        did_document:
          type: object
        key_log_head:
          type: string
        seq:
          type: integer
        receipts:
          type: array
          items:
            $ref: ../schemas/identity-receipt.schema.json
    SyncResponse:
      $ref: ../schemas/client-sync-response.schema.json
    BottomDiagnostic:
      $ref: ../schemas/bottom.schema.json
    CellQueryEnvelope:
      type: object
      description: 'Wire envelope for state-query / projection responses on a single
        cell. `status` MUST be `value` when the join is defined, `bottom` when the
        cell resolved to ⊥ on a `bottom=reject` lattice (caller MUST treat as
        fail-closed), and `conflict` when a `bottom=expose` lattice surfaces
        candidate heads to the projection / UI without selecting a winner. See
        zh/sync/service-surface.md §5.5 and zh/authz/event-auth-state-resolution.md
        §5.1.'
      required:
      - cell
      - status
      properties:
        cell:
          type: string
          pattern: ^cx:cell:[A-Za-z0-9._~=-]+(?::[A-Za-z0-9._~=-]+)*$
        status:
          type: string
          enum:
          - value
          - bottom
          - conflict
        value:
          description: 'Effective Lattice value when status=value. Shape is
            cell-type specific (or-set members, mv-register tuple, cas-register
            atom, fsm state, counter integer, ordered-log tail).'
        heads:
          type: array
          uniqueItems: true
          description: Candidate heads when status=conflict on a `bottom=expose`
            cell. Receivers MUST NOT use this for authorization decisions.
          items: true
        bottom:
          $ref: '#/components/schemas/BottomDiagnostic'
        anchor_view:
          type: object
          description: Anchor leaves / state_root the value or bottom was
            observed under. Mirrors `bottom.anchor_view` when status≠value.
          required:
          - leaves
          properties:
            leaves:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                pattern: ^cx:anchor:sha256:[0-9a-f]{64}$
            state_root:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
          additionalProperties: false
      additionalProperties: true
    MoveStateView:
      type: object
      description: Per-Move protocol-state field surfaced on /sync and /events
        responses (zh/sync/service-surface.md §5.5, zh/authz/event-auth-state-resolution.md
        §13). Implementations MUST attach this on every Move included in a
        timeline/state response so clients can render fail-closed UI without
        recomputing the join.
      required:
      - move_id
      - event_state
      properties:
        move_id:
          type: string
          pattern: ^cx:move:sha256:[0-9a-f]{64}$
        event_state:
          type: string
          enum:
          - pending_anchor
          - effective
          - failed_precondition
          - failed_bottom
          - rejected_anchor
          - anchorer_paused
        bottom:
          $ref: '#/components/schemas/BottomDiagnostic'
      additionalProperties: false
    DeviceMessageEnvelope:
      $ref: ../schemas/device-message.schema.json
    DeviceMessageTarget:
      type: object
      required:
      - kind
      - expires_at
      - content
      properties:
        kind:
          type: string
          pattern: ^cx\.[a-z0-9_]+(\.[a-z0-9_]+)*$
        content:
          type: object
        expires_at:
          type: string
          format: date-time
          pattern: Z$
      additionalProperties: false
    DeviceMessagesPutRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/DeviceMessageTarget'
      additionalProperties: false
    DeviceMessagesPutResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
        delivered:
          type: object
        unknown_devices:
          type: object
      additionalProperties: false
    DeviceMessagesGetResponse:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/DeviceMessageEnvelope'
        next_cursor:
          type: string
        limited:
          type: boolean
      additionalProperties: false
    GrantListResponse:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: ../schemas/capability-grant.schema.json
        state_hash:
          type: string
        evaluated_at:
          type: string
    AuthzCheckRequest:
      type: object
      required:
      - actor
      - action
      - resource
      properties:
        actor:
          type: string
        action:
          type: string
        resource:
          type: object
        context:
          type: object
      additionalProperties: false
    AuthzCheckResponse:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - allow
          - deny
          - quarantine
          - require_review
          - soft_fail
        matched_grants:
          type: array
          items:
            type: object
        applied_constraints:
          type: array
          items:
            type: object
        policy_results:
          type: array
          items:
            type: object
        missing_proofs:
          type: array
          items:
            type: object
        frontier:
          type: object
        cache_valid_until:
          type: string
          format: date-time
          pattern: Z$
        reason_code:
          type: string
        obligations:
          type: array
          items:
            type: object
      additionalProperties: false
    ModerationQueueResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: ../schemas/moderation-queue-item.schema.json
        next_cursor:
          type: string
        counts:
          type: object
      additionalProperties: false
    ModerationReportResponse:
      type: object
      required:
      - report_id
      - status
      properties:
        report_id:
          type: string
          pattern: ^cx:report:[0-9a-hjkmnp-z]{26}$
        status:
          type: string
          enum:
          - submitted
          - triaged
          - reviewing
          - actioned
          - dismissed
          - appealed
          - closed
        routed_to:
          type: array
          items:
            type: string
            pattern: ^did:[a-z0-9:.\-_]+:[^\s]+$
      additionalProperties: false
    FieldFilter:
      type: object
      required:
      - field
      - op
      properties:
        field:
          type: string
          pattern: ^[a-zA-Z0-9_]+(\.[a-zA-Z0-9_]+)*$
        op:
          type: string
          enum:
          - eq
          - neq
          - in
          - not_in
          - lt
          - lte
          - gt
          - gte
          - contains
          - exists
          - prefix
          - full_text
        value: {}
      additionalProperties: false
    BooleanFilter:
      type: object
      properties:
        and:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QueryFilter'
        or:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QueryFilter'
        not:
          $ref: '#/components/schemas/QueryFilter'
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
    QueryFilter:
      oneOf:
      - $ref: '#/components/schemas/FieldFilter'
      - $ref: '#/components/schemas/BooleanFilter'
    SortSpec:
      type: object
      required:
      - field
      - direction
      properties:
        field:
          type: string
          minLength: 1
        direction:
          type: string
          enum:
          - asc
          - desc
        nulls:
          type: string
          enum:
          - first
          - last
      additionalProperties: false
    RelationQuery:
      type: object
      required:
      - kind
      - direction
      properties:
        kind:
          type: string
          minLength: 1
        direction:
          type: string
          enum:
          - out
          - in
          - both
        source_ref:
          type: string
          pattern: ^(cx:(space|flow|message|morph|relation):[0-9a-hjkmnp-z]{26}|did:.+)$
        source_actor_id:
          type: string
        source_space_id:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        target_ref:
          type: string
          pattern: ^(cx:(space|flow|message|morph|relation):[0-9a-hjkmnp-z]{26}|did:.+)$
        target_actor_id:
          type: string
        target_space_id:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        depth:
          type: integer
          minimum: 0
          maximum: 32
      allOf:
      - not:
          anyOf:
          - required:
            - source_ref
            - source_actor_id
          - required:
            - source_ref
            - source_space_id
          - required:
            - source_actor_id
            - source_space_id
          - required:
            - target_ref
            - target_actor_id
          - required:
            - target_ref
            - target_space_id
          - required:
            - target_actor_id
            - target_space_id
      additionalProperties: false
    FacetName:
      type: string
      enum:
      - container
      - replyable
      - schedulable
      - assignable
      - stateful
      - rankable
      - reviewable
      - notifiable
      - documentable
      - renderable
    ViewRenderer:
      type: string
      enum:
      - board
      - card
      - row
      - table
      - calendar
      - gantt
      - timeline
      - thread
      - chat
      - forum
      - graph
      - tree
      - document
      - dashboard
      - custom
    QueryRequest:
      type: object
      properties:
        space_ids:
          type: array
          items:
            type: string
            pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
          minItems: 1
        view_id:
          type: string
          pattern: ^cx:view:[0-9a-hjkmnp-z]{26}$
        projection:
          type: string
          enum:
          - raw
          - collection
          - timeline
          - graph
          - document
          - composite
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        object_types:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        morph_types:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        facets:
          type: array
          items:
            $ref: '#/components/schemas/FacetName'
          minItems: 1
          uniqueItems: true
        relation:
          oneOf:
          - $ref: '#/components/schemas/RelationQuery'
          - type: 'null'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/QueryFilter'
        order_by:
          type: array
          items:
            $ref: '#/components/schemas/SortSpec'
        cursor:
          oneOf:
          - type: string
            pattern: ^cx:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        wait_for:
          type: string
          minLength: 1
      additionalProperties: false
      allOf:
      - if:
          properties:
            projection:
              const: raw
          required:
          - projection
        then:
          not:
            required:
            - renderer
      - if:
          properties:
            projection:
              enum:
              - collection
              - graph
              - timeline
              - document
              - composite
          required:
          - projection
        then:
          required:
          - view_id
    ObjectRef:
      type: string
      pattern: ^cx:(space|flow|message|morph|relation|view):[0-9a-hjkmnp-z]{26}$
    ObjectLookupResponse:
      type: object
      required:
      - object
      - visibility
      properties:
        object:
          $ref: '#/components/schemas/ProjectionObject'
        state_after:
          $ref: '#/components/schemas/StateFrontier'
        visibility:
          type: string
          enum:
          - visible
          - redacted
          - partial
      additionalProperties: false
    FlowDiscussionTimelineResponse:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineProjectionEntry'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionObject'
        next_cursor:
          type: string
        state_after:
          $ref: '#/components/schemas/StateFrontier'
      additionalProperties: false
    FlowDiscussionSummary:
      type: object
      required:
      - flow
      properties:
        flow:
          $ref: '#/components/schemas/ProjectionObject'
        relation:
          type: object
        summary:
          type: object
        unread:
          type: integer
          minimum: 0
      additionalProperties: false
    FlowDiscussionsResponse:
      type: object
      required:
      - flows
      properties:
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowDiscussionSummary'
        summaries:
          type: object
        next_cursor:
          type: string
        state_after:
          $ref: '#/components/schemas/StateFrontier'
      additionalProperties: false
    NotificationProjectionResponse:
      type: object
      required:
      - notifications
      properties:
        notifications:
          type: array
          items:
            $ref: ../schemas/notification.schema.json
        counts:
          type: object
        next_cursor:
          type: string
      additionalProperties: false
    InboxResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionItem'
        next_cursor:
          type: string
        frontier:
          $ref: '#/components/schemas/StateFrontier'
      additionalProperties: false
    SearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
        space_ids:
          type: array
          items:
            type: string
            pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        object_types:
          type: array
          items:
            type: string
        morph_types:
          type: array
          items:
            type: string
        time_range:
          type: object
        cursor:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 1000
      additionalProperties: false
    SearchResult:
      type: object
      required:
      - object
      properties:
        object:
          $ref: '#/components/schemas/ProjectionObject'
        score:
          type: number
        highlights:
          type: array
          items:
            type: object
      additionalProperties: false
    SearchResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        next_cursor:
          type: string
        total_estimate:
          type: integer
          minimum: 0
      additionalProperties: false
    SpaceHierarchyResponse:
      type: object
      required:
      - root_space_id
      - children
      properties:
        root_space_id:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        root:
          $ref: '#/components/schemas/ProjectionObject'
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpaceHierarchyChild'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SpaceHierarchyEdge'
        next_cursor:
          type: string
        cycle_detected:
          type: boolean
      additionalProperties: false
    SpaceHierarchyEdgeStatus:
      type: string
      description: Derived status of a parent-child hierarchy edge.
      enum:
      - confirmed
      - unconfirmed_link
      - rejected
      - tombstoned
    SpaceHierarchyChild:
      type: object
      required:
      - space_id
      - edge_status
      properties:
        space_id:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        edge_status:
          $ref: '#/components/schemas/SpaceHierarchyEdgeStatus'
        accessible:
          type: boolean
        lazy_link:
          type: boolean
        summary:
          type: object
      additionalProperties: false
    SpaceHierarchyEdge:
      type: object
      required:
      - parent_ref
      - child_ref
      - edge_status
      properties:
        parent_ref:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        child_ref:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        edge_status:
          $ref: '#/components/schemas/SpaceHierarchyEdgeStatus'
        relation_kind:
          type: string
      additionalProperties: false
    StateFrontier:
      type: object
      required:
      - state_hash
      properties:
        state_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        event_ids:
          type: array
          items:
            type: string
            pattern: ^cx:event:[0-9a-hjkmnp-z]{26}$
        actor_frontiers:
          type: array
          items:
            type: object
            required:
            - actor_id
            - actor_seq
            - event_id
            properties:
              actor_id:
                type: string
                pattern: ^did:[a-z0-9:.\-_]+:[^\s]+$
              actor_seq:
                type: integer
                minimum: 0
              event_id:
                type: string
                pattern: ^cx:event:[0-9a-hjkmnp-z]{26}$
              hlc:
                type: string
                pattern: ^[0-9a-f]{12}-[0-9a-f]{4}-[0-9a-f]{8}$
            additionalProperties: false
      additionalProperties: false
    RawQueryResponse:
      type: object
      required:
      - projection
      - results
      - frontier
      properties:
        projection:
          type: string
          const: raw
        results:
          type: array
          items:
            type: object
        next_cursor:
          type: string
          pattern: ^cx:cursor:[A-Za-z0-9_-]+$
        total_estimate:
          type: integer
          minimum: 0
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        stale:
          type: boolean
      additionalProperties: false
    CollectionFieldValueGroupSource:
      type: object
      required:
      - model
      - field
      - value
      properties:
        model:
          type: string
          const: field_value
        field:
          type: string
          pattern: ^[a-zA-Z0-9_]+(\.[a-zA-Z0-9_]+)*$
        value:
          oneOf:
          - type: string
          - type: number
          - type: boolean
      additionalProperties: false
    CollectionRelationGroupSource:
      type: object
      required:
      - model
      - scope_container_id
      - container_id
      - relation_kind
      properties:
        model:
          type: string
          const: relation_container
        scope_container_id:
          type: string
          pattern: ^cx:(space|flow|message|morph|relation|view):[0-9a-hjkmnp-z]{26}$
        container_id:
          type: string
          pattern: ^cx:(space|flow|message|morph|relation|view):[0-9a-hjkmnp-z]{26}$
        relation_kind:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionTimeBucketGroupSource:
      type: object
      required:
      - model
      - start
      - end
      - timezone
      properties:
        model:
          type: string
          const: time_bucket
        start:
          type: string
          format: date-time
          pattern: Z$
        end:
          type: string
          format: date-time
          pattern: Z$
        timezone:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionCrosstabGroupSource:
      type: object
      required:
      - model
      - row_key
      - column_key
      properties:
        model:
          type: string
          const: crosstab_cell
        row_key:
          type: string
          minLength: 1
        column_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionGroupSource:
      oneOf:
      - $ref: '#/components/schemas/CollectionFieldValueGroupSource'
      - $ref: '#/components/schemas/CollectionRelationGroupSource'
      - $ref: '#/components/schemas/CollectionTimeBucketGroupSource'
      - $ref: '#/components/schemas/CollectionCrosstabGroupSource'
    CollectionFieldValuePosition:
      type: object
      required:
      - model
      - container_id
      - rank
      properties:
        model:
          type: string
          const: field_value
        container_id:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: ^[0-9A-Za-z]{1,128}$
      additionalProperties: false
    CollectionRelationPosition:
      type: object
      required:
      - model
      - scope_container_id
      - container_id
      - relation_kind
      - relation_id
      - rank
      properties:
        model:
          type: string
          const: relation
        scope_container_id:
          type: string
          pattern: ^cx:(space|flow|message|morph|relation|view):[0-9a-hjkmnp-z]{26}$
        container_id:
          type: string
          pattern: ^cx:(space|flow|message|morph|relation|view):[0-9a-hjkmnp-z]{26}$
        relation_kind:
          type: string
          minLength: 1
        relation_id:
          type: string
          pattern: ^cx:relation:[0-9a-hjkmnp-z]{26}$
        rank:
          type: string
          pattern: ^[0-9A-Za-z]{1,128}$
      additionalProperties: false
    CollectionTimeWindowPosition:
      type: object
      required:
      - model
      - start
      - sort_key
      properties:
        model:
          type: string
          const: time_window
        start:
          type: string
          format: date-time
          pattern: Z$
        end:
          type:
          - string
          - 'null'
          format: date-time
        timezone:
          type: string
          minLength: 1
        sort_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionCrosstabPosition:
      type: object
      required:
      - model
      - row_key
      - column_key
      - sort_key
      properties:
        model:
          type: string
          const: crosstab_cell
        row_key:
          type: string
          minLength: 1
        column_key:
          type: string
          minLength: 1
        sort_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionProjectionGroup:
      type: object
      required:
      - key
      - title
      - source
      - items
      - limited
      properties:
        key:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: ^[0-9A-Za-z]{1,128}$
        source:
          $ref: '#/components/schemas/CollectionGroupSource'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionItem'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^cx:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        limited:
          type: boolean
        wip_state:
          type: string
          enum:
          - ok
          - over_limit
          - unknown
        total_estimate:
          type: integer
          minimum: 0
      allOf:
      - if:
          properties:
            source:
              properties:
                model:
                  const: field_value
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionItem'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionFieldValuePosition'
      - if:
          properties:
            source:
              properties:
                model:
                  const: relation_container
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionItem'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionRelationPosition'
      - if:
          properties:
            source:
              properties:
                model:
                  const: time_bucket
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionItem'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionTimeWindowPosition'
      - if:
          properties:
            source:
              properties:
                model:
                  const: crosstab_cell
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionItem'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionCrosstabPosition'
      additionalProperties: false
    CollectionProjectionResponse:
      type: object
      required:
      - projection
      - view_id
      - frontier
      properties:
        projection:
          type: string
          const: collection
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        view_id:
          type: string
          pattern: ^cx:view:[0-9a-hjkmnp-z]{26}$
        space_id:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CollectionProjectionGroup'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionItem'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^cx:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        total_estimate:
          type: integer
          minimum: 0
        stale:
          type: boolean
      anyOf:
      - required:
        - groups
      - required:
        - items
      additionalProperties: false
    ProjectionObject:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: string
          pattern: ^cx:(space|flow|message|morph):[0-9a-hjkmnp-z]{26}$
        type:
          type: string
          enum:
          - space
          - flow
          - message
          - morph
        morph_type:
          type: string
        facets:
          type: array
          items:
            $ref: '#/components/schemas/FacetName'
          uniqueItems: true
        title:
          type: string
        fields:
          type: object
      additionalProperties: false
    ProjectionItem:
      type: object
      required:
      - object
      properties:
        object:
          $ref: '#/components/schemas/ProjectionObject'
        render:
          type: string
          enum:
          - card
          - row
          - tile
          - compact
          - badge
          - message
        display:
          type: object
        position:
          oneOf:
          - $ref: '#/components/schemas/CollectionFieldValuePosition'
          - $ref: '#/components/schemas/CollectionRelationPosition'
          - $ref: '#/components/schemas/CollectionTimeWindowPosition'
          - $ref: '#/components/schemas/CollectionCrosstabPosition'
          - type: object
            required:
            - sort_key
            properties:
              sort_key:
                type: string
                minLength: 1
            additionalProperties: false
        state:
          type: object
      additionalProperties: false
    TimelineProjectionEntry:
      type: object
      required:
      - id
      - entry_type
      - sort_key
      properties:
        id:
          type: string
          minLength: 1
        entry_type:
          type: string
          enum:
          - event
          - message
          - activity
          - system
          - tombstone
        event_id:
          type: string
          pattern: ^cx:(evt|event):[0-9a-hjkmnp-z]{26}$
        object:
          $ref: '#/components/schemas/ProjectionObject'
        actor_id:
          type: string
        created_at:
          type: string
          format: date-time
          pattern: Z$
        sort_key:
          type: string
          minLength: 1
        thread_id:
          type: string
          pattern: ^cx:(flow|message):[0-9a-hjkmnp-z]{26}$
        body:
          type: object
        redacted:
          type: boolean
      additionalProperties: false
    TimelineProjectionResponse:
      type: object
      required:
      - projection
      - view_id
      - entries
      - frontier
      properties:
        projection:
          type: string
          const: timeline
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        view_id:
          type: string
          pattern: ^cx:view:[0-9a-hjkmnp-z]{26}$
        space_id:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineProjectionEntry'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^cx:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        limited:
          type: boolean
        stale:
          type: boolean
      additionalProperties: false
    GraphProjectionNode:
      type: object
      required:
      - object
      - depth
      properties:
        object:
          $ref: '#/components/schemas/ProjectionObject'
        depth:
          type: integer
          minimum: 0
        lazy:
          type: boolean
        truncated:
          type: boolean
      additionalProperties: false
    GraphProjectionEdge:
      type: object
      required:
      - relation_id
      - relation_kind
      - from_ref
      - to_ref
      properties:
        relation_id:
          type: string
          pattern: ^cx:relation:[0-9a-hjkmnp-z]{26}$
        relation_kind:
          type: string
          minLength: 1
        from_ref:
          type: string
          pattern: ^(cx:(space|flow|message|morph):[0-9a-hjkmnp-z]{26}|did:.+)$
        to_ref:
          type: string
          pattern: ^(cx:(space|flow|message|morph):[0-9a-hjkmnp-z]{26}|did:.+)$
        rank:
          type: string
          pattern: ^[0-9A-Za-z]{1,128}$
        truncated:
          type: boolean
      additionalProperties: false
    GraphProjectionResponse:
      type: object
      required:
      - projection
      - view_id
      - nodes
      - edges
      - frontier
      properties:
        projection:
          type: string
          const: graph
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        view_id:
          type: string
          pattern: ^cx:view:[0-9a-hjkmnp-z]{26}$
        space_id:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphProjectionNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphProjectionEdge'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^cx:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        limited:
          type: boolean
        stale:
          type: boolean
      additionalProperties: false
    DocumentProjectionSection:
      type: object
      required:
      - object
      - sort_key
      properties:
        object:
          $ref: '#/components/schemas/ProjectionObject'
        sort_key:
          type: string
          minLength: 1
        depth:
          type: integer
          minimum: 0
        body:
          type: object
        redacted:
          type: boolean
      additionalProperties: false
    DocumentProjectionResponse:
      type: object
      required:
      - projection
      - view_id
      - sections
      - frontier
      properties:
        projection:
          type: string
          const: document
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        view_id:
          type: string
          pattern: ^cx:view:[0-9a-hjkmnp-z]{26}$
        space_id:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/DocumentProjectionSection'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^cx:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        stale:
          type: boolean
      additionalProperties: false
    CompositeProjectionWidget:
      type: object
      required:
      - id
      - title
      - projection
      - frontier
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        projection:
          type: string
          enum:
          - collection
          - timeline
          - graph
          - document
          - composite
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        result:
          type: object
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
      additionalProperties: false
    CompositeProjectionResponse:
      type: object
      required:
      - projection
      - view_id
      - widgets
      - frontier
      properties:
        projection:
          type: string
          const: composite
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        view_id:
          type: string
          pattern: ^cx:view:[0-9a-hjkmnp-z]{26}$
        space_id:
          type: string
          pattern: ^cx:space:[0-9a-hjkmnp-z]{26}$
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/CompositeProjectionWidget'
        stale:
          type: boolean
      additionalProperties: false
    OperationRequest:
      type: object
      description: Operation-specific JSON request object. Required fields and profile gates are defined by the operation
        binding in the normative sync/service documents.
      additionalProperties: true
    OperationResult:
      type: object
      description: Operation-specific JSON response object. Standard error responses use ErrorEnvelope; successful result
        fields are defined by the operation binding in the normative sync/service documents.
      additionalProperties: true
  responses:
    NotFound:
      description: Not found or not visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TemporarilyUnavailable:
      description: Temporarily unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
paths:
  /server/describe:
    get:
      operationId: cx.server.describe
      responses:
        '200':
          description: Service description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescribe'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /identity/resolve:
    post:
      operationId: cx.identity.resolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - did
              properties:
                did:
                  type: string
                include:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: DID resolution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolveResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /identity/document:
    get:
      operationId: cx.identity.get_document
      responses:
        '200':
          description: DID document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
  /identity/log:
    get:
      operationId: cx.identity.get_log
      responses:
        '200':
          description: DID key log
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: ../schemas/did-key-log-entry.schema.json
                  next_cursor:
                    type: string
  /identity/submit-did-operation:
    post:
      operationId: cx.identity.submit_did_operation
      security:
      - bearerAuth: []
      - httpMessageSignature: []
      responses:
        '200':
          description: DID operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
  /identity/receipts:
    get:
      operationId: cx.identity.get_receipts
      responses:
        '200':
          description: Identity receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipts:
                    type: array
                    items:
                      $ref: ../schemas/identity-receipt.schema.json
  /events:
    post:
      operationId: cx.events.submit
      security:
      - bearerAuth: []
      - httpMessageSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: ../schemas/event-envelope.schema.json
              - type: object
                required:
                - events
                properties:
                  events:
                    type: array
                    items:
                      $ref: ../schemas/event-envelope.schema.json
      responses:
        '200':
          description: Event accepted
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            X-Contrix-Request-Id:
              $ref: '#/components/headers/XContrixRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
    get:
      operationId: cx.events.list
      responses:
        '200':
          description: Event history page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
  /events/describe:
    get:
      operationId: cx.events.describe
      responses:
        '200':
          description: Events API capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
  /events/{event_id}:
    get:
      operationId: cx.events.get
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event envelope
          content:
            application/json:
              schema:
                $ref: ../schemas/event-envelope.schema.json
  /events/batch-get:
    post:
      operationId: cx.events.batch_get
      responses:
        '200':
          description: Event batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
  /events/frontier:
    get:
      operationId: cx.events.frontier
      responses:
        '200':
          description: Event frontier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
  /sync:
    post:
      operationId: cx.sync.client_sync
      responses:
        '200':
          description: Client sync response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
      parameters:
      - in: header
        name: X-Contrix-Wait-For
        required: false
        description: Barrier cursor (purpose=barrier) returned from a prior write. Server blocks the response until the local frontier covers target.event_id, or returns timeout / stale_frontier / temporarily_unavailable.
        schema:
          type: string
          pattern: '^cx:cursor:.+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
  /sync/subscribe:
    get:
      operationId: cx.sync.subscribe
      responses:
        '200':
          description: Streaming sync subscription
          content:
            text/event-stream:
              schema:
                type: string
  /sync/backfill:
    get:
      operationId: cx.sync.backfill
      responses:
        '200':
          description: Historical backfill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
  /sync/snapshot-head:
    get:
      operationId: cx.sync.get_snapshot_head
      responses:
        '200':
          description: Snapshot manifest head
          content:
            application/json:
              schema:
                $ref: ../schemas/snapshot.schema.json
  /directory/resolve-handle:
    post:
      operationId: cx.directory.resolve_handle
      responses:
        '200':
          description: Handle resolution result
          content:
            application/json:
              schema:
                $ref: ../schemas/handle-claim.schema.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
  /directory/private-contact-discovery:
    post:
      operationId: cx.directory.private_contact_discovery
      security:
      - bearerAuth: []
      - httpMessageSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '200':
          description: Time-bound private contact discovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
  /blob/upload:
    post:
      operationId: cx.blob.upload
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Blob accepted
          headers:
            X-Contrix-Request-Id:
              $ref: '#/components/headers/XContrixRequestId'
          content:
            application/json:
              schema:
                $ref: ../schemas/blob.schema.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
  /blob/get:
    head:
      operationId: cx.blob.head
      responses:
        '200':
          description: Blob metadata
    get:
      operationId: cx.blob.get
      parameters:
      - in: header
        name: Range
        schema:
          type: string
      responses:
        '200':
          description: Blob content
          headers:
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /push/register-device:
    post:
      operationId: cx.push.register_device
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Device registration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
  /push/unregister-device:
    post:
      operationId: cx.push.unregister_device
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Device unregistration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
  /push/notify:
    post:
      operationId: cx.push.notify
      security:
      - httpMessageSignature: []
      responses:
        '200':
          description: Blind push delivery result
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected:
                    type: array
                    items:
                      type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
  /authz/check:
    post:
      operationId: cx.authz.check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthzCheckRequest'
      responses:
        '200':
          description: Authorization decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzCheckResponse'
  /authz/effective-grants:
    get:
      operationId: cx.authz.get_effective_grants
      responses:
        '200':
          description: Effective grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantListResponse'
  /device_messages/{txn_id}:
    put:
      operationId: cx.device_messages.put
      parameters:
      - in: path
