      operationId: cx.events.resolve
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        contentDigest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsResolveRequest'
      responses:
        '200':
          description: Resolved events keyed by event_id / event_hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResolveResponse'
  /events/frontier:
    get:
      operationId: cx.events.frontier
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalHash: []
      - {}
      parameters:
      - name: actor_id
        in: query
        schema:
          type: string
      - name: realm_id
        in: query
        schema:
          type: string
      - name: peer_role
        in: query
        schema:
          type: string
          enum:
          - account_client
          - federation_peer
          - anonymous_health
          default: account_client
        description: Frontier caller role. federation_peer requires service-to-service authentication with Source/Destination trust-domain headers and Request-Canonical-Hash; anonymous_health MAY be unauthenticated but MUST be rate-limited and only returns frontier_root summaries.
      responses:
        '200':
          description: Event frontier visible to caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsFrontierResponse'
  /ephemeral:
    post:
      operationId: cx.ephemeral.send
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceDid: []
        destinationServiceDid: []
        contentDigest: []
      summary: Send a broadcast ephemeral signal.
      description: |
        Sends a `cx.schema.ephemeral_envelope.v1` broadcast signal (`cx.presence`,
        `cx.typing`, `cx.receipt.read`, or `cx.call.signal`) into the Sync
        Service fanout path. This endpoint never persists the signal as a
        durable Event and never advances actor_seq, Anchor state, or Realm
        frontier. Point-to-point device verification signals use
        `cx.device_messages.put` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/ephemeral-envelope.schema.json
      responses:
        '200':
          description: Ephemeral signal accepted into fanout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EphemeralSubmitResponse'
        '400':
          description: |
            `invalid_param` or `schema_violation` — malformed envelope, unsupported
            kind, expired signal, or TTL above the hard ceiling.
        '403':
          description: |
            `capability_denied` or `policy_violation` — caller cannot broadcast
            this signal in the Realm, or the effective read-receipt policy
            disables `cx.receipt.read`.
  /account/subscribe:
    get:
      operationId: cx.account.subscribe
      security:
      - bearerAuth: []
      summary: Streaming push of account-aggregate deltas (NDJSON frames).
      description: |
        Long-lived streaming subscription that pushes cross-Realm
        account-aggregate deltas (cross-Realm frontier, to_device queue,
        account_data, device_lists, presence, unread / notification counts)
        as new data becomes available. Response is `application/x-ndjson`;
        each line is a self-contained frame object — see
        AccountSubscribeFrame for frame kinds (`delta`, `frontier`,
        `heartbeat`, `catchup_complete`, `dropped`, `resync_required`,
        `unauthorized`).

        Symmetric with cx.events.subscribe (per-Realm event log streaming);
        both share resume semantics (`after=<cursor>` exclusive start).
        `dropped` requires account-aggregate catch-up by reconnecting with
        `after=<cursor>&catchup=true`; `resync_required` requires local
        rebuild / initial account sync. Replaces the prior Matrix-derived
        long-poll cx.account.sync.
      parameters:
      - in: header
        name: X-Contrix-Wait-For
        required: false
        description: Barrier cursor (purpose=barrier) returned from a prior write. Server holds the first delta frame until the local frontier covers target.event_id, or emits an error frame (timeout / stale_frontier / temporarily_unavailable).
        schema:
          type: string
          pattern: '^cx:cursor:.+$'
      - name: after
        in: query
        description: |
          Subscription start cursor (exclusive). Frames are pushed after this
          cursor position. Omit when there is no usable account cursor; with
          `catchup=true` this starts initial account sync and the
          server first emits a baseline delta.
        schema:
          type: string
          pattern: '^cx:cursor:.+$'
      - name: catchup
        in: query
        description: |
          When true and `after` is present, server first replays the bounded
          account-aggregate catch-up range after the `after=` cursor, emits
          `catchup_complete`, then transitions to real-time push. When true
          and `after` is omitted, this is initial account sync: server first
          emits a current baseline delta, then `catchup_complete`, then
          real-time push. This parameter never means "return all history";
          complete event history is retrieved via `GET /events`.
        schema:
          type: boolean
          default: false
      - name: filter
        in: query
        description: Optional structured filter object (Realm subset, kinds, event-fields). See zh/sync/client-sync.md §2.
        schema:
          type: object
        style: deepObject
        explode: true
      - name: set_presence
        in: query
        description: Presence intent for this connection — propagated to other Realms on accept. Equivalent to the field of the same name in the legacy long-poll request body.
        schema:
          type: string
          enum:
          - online
          - offline
          - unavailable
      responses:
        '200':
          description: |
            Streaming NDJSON frame channel. Each newline-delimited JSON object
            conforms to AccountSubscribeFrame. Frames continue until the client
            disconnects, the server emits `dropped` / `resync_required`, or the
            connection is closed for transport reasons.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AccountSubscribeFrame'
  /account/cursor/revoke:
    post:
      operationId: cx.account.cursor_revoke
      security:
      - bearerAuth: []
      summary: Revoke a previously issued cursor authority.
      description: |
        High-assurance optional endpoint. The issuing service records the cursor
        digest or stateful handle in a revocation set until the cursor's maximum
        TTL would have expired. A revoked cursor returns `cursor_revoked` and
        MUST NOT advance to-device acknowledgement, account subscribe position,
        wait-for barrier state, or dropped recovery state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cursor
              - reason_code
              properties:
                cursor:
                  type: string
                  pattern: '^cx:cursor:.+$'
                reason_code:
                  type: string
                revoke_scope:
                  type: string
                  enum:
                  - this_cursor
                  - same_device
                  - same_session
                  default: this_cursor
              additionalProperties: false
      responses:
        '200':
          description: Cursor revocation accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                - revoked
                properties:
                  revoked:
                    type: boolean
                  expires_at:
                    type: string
                    format: date-time
