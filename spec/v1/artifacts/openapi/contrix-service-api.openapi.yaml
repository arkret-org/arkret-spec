      - realm_id
      - request_canonical_hash
      - action
      - actor
      - source
      properties:
        request_id:
          type: string
        realm_id:
          type: string
          pattern: ^cx:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        request_canonical_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        action:
          type: string
        actor:
          type: string
          pattern: ^did:[a-z0-9]+:[^\s]+$
        device_id:
          type: string
        source:
          type: object
          required:
          - service_did
          - service_type
          - signed_transport
          properties:
            service_did:
              type: string
              pattern: ^did:[a-z0-9]+:[^\s]+$
            service_type:
              type: string
            source_ip_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            signed_transport:
              type: boolean
          additionalProperties: true
        event_preview:
          type: object
          additionalProperties: true
        auth_context:
          type: object
          additionalProperties: true
      additionalProperties: false
    PolicyCheckResponse:
      type: object
      description: Result of cx.policy.check — signed decision bound to authorization, policy, and membership frontier hashes.
      required:
      - request_id
      - bound_to
      - decision
      - reason_code
      - expires_at
      - auth_state_hash
      - policy_frontier_hash
      - membership_frontier_hash
      - signature
      properties:
        request_id:
          type: string
        bound_to:
          type: object
          description: Request context covered by the policy decision signature. Allows receivers to verify a forwarded decision without guessing transcript fields.
          required:
          - realm_id
          - actor
          - action
          - request_canonical_hash
          - policy_server_id
          properties:
            realm_id:
              type: string
              pattern: ^cx:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            actor:
              type: string
              pattern: ^did:[a-z0-9]+:[^\s]+$
            action:
              type: string
            request_canonical_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            policy_server_id:
              type: string
              pattern: ^did:[a-z0-9]+:[^\s]+$
          additionalProperties: false
        decision:
          type: string
          enum:
          - allow
          - soft_deny
          - hard_deny
          - quarantine
          - require_review
        reason_code:
          type: string
        expires_at:
          type: string
          format: date-time
        auth_state_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Accepted authorization state hash used when producing the decision.
        policy_frontier_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Policy source frontier / digest used when producing the decision.
        membership_frontier_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Membership / role frontier digest used when producing the decision.
        next_retry_at:
          type: string
          format: date-time
        obligations:
          type: array
          items:
            type: object
            additionalProperties: true
        signature:
          type: object
          required:
          - kid
          - sig
          properties:
            kid:
              type: string
              pattern: ^did:[a-z0-9]+:[^\s]+#.+$
              description: DID URL of the policy server verification method.
            sig:
              type: string
              description: Detached signature over the policy decision transcript.
          additionalProperties: false
      additionalProperties: false
    SessionGrantRequest:
      type: object
      additionalProperties: false
      required:
