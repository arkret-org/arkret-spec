      properties:
        kind:
          type: string
          minLength: 1
        direction:
          type: string
          enum:
          - out
          - in
          - both
        source_ref:
          type: string
          pattern: ^(cx:(realm|flow|message|morph|relation):[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|did:.+)$
        source_actor_id:
          type: string
        source_realm_id:
          type: string
          pattern: ^cx:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        target_ref:
          type: string
          pattern: ^(cx:(realm|flow|message|morph|relation):[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|did:.+)$
        target_actor_id:
          type: string
        target_realm_id:
          type: string
          pattern: ^cx:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        depth:
          type: integer
          minimum: 0
          maximum: 32
      allOf:
      - not:
          anyOf:
          - required:
            - source_ref
            - source_actor_id
          - required:
            - source_ref
            - source_realm_id
          - required:
            - source_actor_id
            - source_realm_id
          - required:
            - target_ref
            - target_actor_id
          - required:
            - target_ref
            - target_realm_id
          - required:
            - target_actor_id
            - target_realm_id
      additionalProperties: false
