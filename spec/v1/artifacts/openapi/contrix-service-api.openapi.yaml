      additionalProperties: false
    GrantListResponse:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: ../schemas/capability-grant.schema.json
        state_hash:
          type: string
        evaluated_at:
          type: string
    AuthzCheckRequest:
      type: object
      description: |
        cx.authz.check input — single capability decision query. `resource` is
        optional because some actions (e.g. `cx.realm.create`, identity-scoped
        actions) have no Realm-bound target.
      required:
      - actor_id
      - action
      properties:
        actor_id:
          type: string
          description: Subject DID whose authorization is being checked.
        action:
          type: string
          description: Capability action id (e.g. `cx.flow.update`).
        resource:
          type: object
          description: Optional resource selector (Realm / Flow / Space / Morph / etc.).
        context:
          type: object
          description: Optional decision context — claim presentations, frontier reference, request metadata.
      additionalProperties: false
    AuthzCheckResponse:
      type: object
      description: cx.authz.check decision. See zh/authz/capabilities.md §18.
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - allow
          - deny
          - quarantine
          - require_review
          - soft_fail
          description: |
            `allow` / `deny` are terminal decisions. `quarantine` / `require_review`
            are policy-server-mediated soft outcomes (the request enters async
            review). `soft_fail` is a transient retryable failure; callers MUST
            treat it as fail-closed for high-risk actions unless a profile
            explicitly allows local pending behavior.
        matched_grants:
          type: array
          items:
            type: object
        applied_constraints:
          type: array
          items:
            type: object
        policy_results:
          type: array
          items:
            type: object
        missing_proofs:
          type: array
          items:
            type: object
        frontier:
          type: object
        freshness_state:
          type: string
          enum:
          - fresh
          - stale
          - unknown
          description: Frontier freshness classification for revocation-sensitive decisions; see zh/authz/capabilities.md §18.2.
        last_known_frontier_age_ms:
          type: integer
          minimum: 0
          description: Age of the newest revocation/auth frontier evidence used for this decision. Present when freshness_state is stale or unknown.
        anchorer_status:
          type: string
          enum:
          - fresh
          - lagging
          - unreachable
          - unknown
          description: Coarse status of the anchorer/frontier source used to diagnose stale or unknown revocation freshness.
        cache_expires_at:
          type: string
          format: date-time
          pattern: Z$
        reason_code:
          type: string
          description: Registered reason code. High-risk stale or unknown revocation freshness returns revocation_freshness_unknown.
        retry_after_ms:
          type: integer
          minimum: 0
          description: Set when `decision=soft_fail` or `freshness_state ∈ {stale,unknown}`; client SHOULD back off this amount before retry.
        obligations:
          type: array
          description: Policy server obligations (challenge / rate_limit / drop_attachment) the caller MUST satisfy before the action proceeds.
          items:
            type: object
      additionalProperties: false
    ModerationQueueResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: ../schemas/moderation-queue-item.schema.json
        next_cursor:
          type: string
        counts:
          type: object
      additionalProperties: false
    ModerationReportResponse:
      type: object
      required:
