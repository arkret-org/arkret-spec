  /_arkret/self/events:
    query:
      operationId: ak.self.events.read.scan
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Read a filtered Event range with cursor pagination.
      description: |
        Canonical RFC 10008 QUERY binding for `ak.self.events.read.scan`.
        The JSON content carries the selector, cursor, ordering, filter, and
        completeness inputs.
      requestBody:
        required: true
