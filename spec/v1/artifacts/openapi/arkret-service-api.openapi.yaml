          type: string
          pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
      responses:
        '200':
          description: Current authenticated service-resolution closure.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store, no-transform
          content:
            application/json:
              schema:
                $ref: ../schemas/identity-resolution.schema.json#/$defs/authenticated_service_resolution
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
