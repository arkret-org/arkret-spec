                $ref: '#/components/schemas/InviteLocatorIssueOutcome'
  /_arkret/self/invite-locators/revoke:
    post:
      operationId: ak.self.invite_locator.command.revoke
      security:
      - bearerAuth: []
        dpopProof: []
      summary: Revoke an authenticated-principal-owned invite locator.
