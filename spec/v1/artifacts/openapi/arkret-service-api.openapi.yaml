        title:
          type: string
        parent_space_id:
          type:
          - string
          - 'null'
        rank:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - active
          - archived
          - tombstoned
        created_by:
          type:
          - string
          - 'null'
        created_at:
          $ref: ../schemas/time.schema.json#/$defs/nullable_timestamp
        updated_by:
          type:
          - string
          - 'null'
        updated_at:
          $ref: ../schemas/time.schema.json#/$defs/nullable_timestamp
        state_changed_at:
          $ref: ../schemas/time.schema.json#/$defs/nullable_timestamp
    ProjectionStrandList:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/ProjectionStrandList
    ProjectionStrandRow:
      type: object
      additionalProperties: false
      required:
      - strand_id
      - realm_id
      - state
      properties:
        strand_id:
          type: string
          pattern: ^ak:strand:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        realm_id:
          type: string
          pattern: ^ak:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        state:
          type: string
          enum:
          - active
          - archived
          - redacted
        state_changed_at:
          $ref: ../schemas/time.schema.json#/$defs/nullable_timestamp
        title:
          type:
          - string
          - 'null'
          description: Derived display title from plaintext-visible Strand metadata.title; null when metadata is encrypted or hidden from the service profile.
        summary:
          type:
          - string
          - 'null'
          description: Derived display summary from plaintext-visible Strand metadata.summary; null when metadata is encrypted or hidden from the service profile.
        board_space_id:
          type:
          - string
          - 'null'
          pattern: ^ak:space:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Derived board Space id from ak.component.strand.position.v1; not canonical Strand object state.
        list_space_id:
          type:
          - string
          - 'null'
          pattern: ^ak:space:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: Derived list Space id from ak.component.strand.position.v1; not canonical Strand object state.
        rank:
          type:
          - string
          - 'null'
          description: Derived rank within list_space_id from ak.component.strand.position.v1.
        assigned_actor_ids:
          type: array
          items:
            type: string
            pattern: ^did:[a-z0-9]+:[^\s#?]+$
          description: Derived current assignee Actor DIDs from visible active Relation(relation_kind=assigned_to, from_ref=strand_id). Empty or absent means the Strand is unassigned for this projection caller. This is read-model state, not canonical Strand object metadata.
        assigned_to_relations:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionAssignedToRelation'
          description: Read-only active assigned_to Relation edges backing assigned_actor_ids. Clients use relation_id to tombstone assignments.
        created_by:
          type:
          - string
          - 'null'
        created_at:
          $ref: ../schemas/time.schema.json#/$defs/nullable_timestamp
        updated_at:
          $ref: ../schemas/time.schema.json#/$defs/nullable_timestamp
    PsiPaddedErrorEnvelope:
      type: object
      description: >-
        Closed PSI Class B projection of the standard ErrorEnvelope with the
        required padding extension. Details and retry_after_ms are intentionally
        absent so the maximal semantic body size is bounded.
      required: [ok, error, request_id, padding]
      additionalProperties: false
      properties:
        ok:
          const: false
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - duplicate_conflict
              - policy_denied
              - psi_batch_unavailable
              - psi_quota_exhausted
            message:
              type: string
              minLength: 1
              maxLength: 256
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        padding:
          $ref: '#/components/schemas/PsiResponsePadding'
    PsiPaddedProblem:
      type: object
      description: >-
        Closed RFC 9457 projection of PsiPaddedErrorEnvelope. padding is an RFC
        9457 extension member and the only extension allowed on this surface.
      required: [type, status, detail, instance, padding]
      additionalProperties: false
      properties:
        type:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 128
        status:
          type: integer
          enum: [403, 409, 410, 429]
        detail:
          type: string
          maxLength: 256
        instance:
          type: string
          minLength: 1
          maxLength: 128
        padding:
          $ref: '#/components/schemas/PsiResponsePadding'
    PsiResponsePadding:
      type: string
      pattern: '^ *$'
      maxLength: 262144
      description: >-
        ASCII-SP padding chosen so the RFC 8785 JCS UTF-8 JSON HTTP entity body
        has exactly the phase Content-Length bucket advertised by
        ServiceDescribe.private_contact_discovery.
