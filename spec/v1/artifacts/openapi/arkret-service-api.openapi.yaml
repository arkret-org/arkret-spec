  /_arkret/find/directory/private-contact-discovery:
    post:
      operationId: ak.find.directory.read.private_contact_discovery
      description: >-
        Two-round OPRF set-membership PSI (zh/discovery/discovery-directory.md
        §6.2/§6.3); the request/response phase field discriminates the blind and
        match rounds correlated by batch_id. Per-target conditions are encoded
        as unmatched bits inside the fixed-cardinality hit_bitmap and never
        surface as error codes.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryPrivateContactDiscoveryRequestBody'
      responses:
        '200':
          description: >-
            Phase-discriminated PSI success outcome (blind evaluations or
            fixed-cardinality match hit bitmap), padded to the exact advertised
            phase Content-Length bucket
          headers:
            Cache-Control:
              schema: {type: string, const: 'no-store, no-transform'}
            Content-Length:
              schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryPrivateContactDiscoveryOutcome'
        '403':
          $ref: '#/components/responses/PsiPolicyDenied'
        '409':
          $ref: '#/components/responses/PsiDuplicateConflict'
        '410':
          $ref: '#/components/responses/PsiBatchUnavailable'
        '429':
          $ref: '#/components/responses/PsiQuotaExhausted'
