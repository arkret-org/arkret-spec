      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Relay encrypted Signal Extension envelopes to one peer.
      description: |
        Optional `ak.profile.signal_peer_relay.v1` single-hop, best-effort
        relay. The request contains 1..128 original producer-signed encrypted
        SignalEnvelope values for one Realm and has a 1 MiB canonical body
        ceiling. The peer signature expires-created window is at most 5
        seconds. Idempotency-Key is forbidden; uncertain outcomes are dropped.
        This operation never creates a durable Event, receipt, Seal, actor_seq
        or Realm frontier update, and the destination cannot forward a received
        envelope to a third peer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/signal-relay.schema.json
      responses:
        '200':
          description: |
            Opaque request takeover result. It does not reveal whether any
            Realm, scope, sender, binding or recipient exists and does not
            promise delivery.
          content:
            application/json:
              schema:
                $ref: ../schemas/signal-relay.schema.json#/$defs/signal_relay_outcome
        '400':
          description: Malformed or cross-Realm relay request.
        '403':
          description: |
            Unified minimally disclosing outer peer authentication, trust-domain,
            destination-endpoint or request-policy rejection. Per-envelope
            sender/member binding and delivery-policy failures are silently
            dropped behind the opaque 200 outcome.
        '413':
          description: Canonical request body exceeds 1 MiB.
  /_arkret/self/signal:
    post:
      operationId: ak.self.signal.command.send
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        contentDigest: []
      summary: Send an encrypted Signal Extension envelope.
      description: |
        Sends a `ak.schema.signal_envelope.v1` encrypted envelope. Exact
        payload type and product target remain inside ciphertext. This endpoint
        never persists the envelope as a durable Event and never advances
        actor_seq, Seal state, or Realm frontier. Point-to-point device
        verification and secret distribution use the to-device queue instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/signal-envelope.schema.json
      responses:
        '200':
          description: Encrypted signal envelope accepted into the live rail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalSubmitOutcome'
        '400':
          description: |
            `param_invalid` or `schema_violation` — malformed envelope, expired
            signal, or TTL/body above the hard ceiling.
        '403':
          description: |
            `capability_denied` or `policy_violation` — caller cannot send the
