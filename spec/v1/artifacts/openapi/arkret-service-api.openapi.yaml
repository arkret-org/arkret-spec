      properties:
        object:
          $ref: '#/components/schemas/ProjectionObject'
        score:
          # lint-waiver(type:number): Search ranking score is a non-canonical, non-signed
          # query-time annotation. It MUST NOT enter canonical Event bytes or any signed
          # artefact. The query-time ranking score is therefore a JSON number; any signed
