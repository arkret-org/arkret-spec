  /_arkret/peer/principal-genesis:
    post:
      operationId: ak.peer.principal_genesis.command.submit
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Atomically accept a root-committed PCR genesis unit.
      description: |
        Account Authority relays the client's exact signed unit. Its service
        signature authenticates transport and correlation only. The Principal
        Server independently verifies the identity-root creation transcript,
        ordered root-signed realm create, founding-device possession signature,
        event-derived PCR id, account-dimension create-once fence and all
        payload commitments. The PCR id is retype(create.event_id); it is never
        derived from the principal DID or subject and is never server-chosen.
        It accepts both Events or neither and returns a durable batch receipt
        whose scope.kind is pcr_genesis_unit. Exact retries return that receipt;
        a conflicting genesis for an existing PCR performs zero writes.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.peer.principal_genesis.command.submit.v1
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PcrGenesisSubmitRequestBody'
      responses:
        '200':
          description: PCR genesis atomically accepted or replayed byte-identically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PcrGenesisSubmitOutcome'
        '409':
          description: The account already has a different authoritative PCR genesis. Event-derived ids never collide across two genesis attempts, so this uniqueness is enforced at the account dimension rather than by realm_id equality.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /_arkret/peer/account-status/resolve:
    post:
      operationId: ak.peer.account_status.read.resolve
