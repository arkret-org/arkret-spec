  responses:
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PsiBatchUnavailable:
      description: The match batch is unknown, belongs to another device, or expired (error code psi_batch_unavailable). Causes
        are intentionally merged and use the match-phase Class B shape. The pinned epoch is retained for the full advertised
        completion TTL.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store, no-transform
        Content-Length:
          schema:
            type: integer
            enum:
            - 4096
            - 16384
            - 65536
            - 262144
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type:
                  const: https://arkret.org/problems/psi_batch_unavailable
                status:
                  const: 410
    PsiDuplicateConflict:
      description: The device-scoped batch_id was reused with different canonical blind or match bytes (error code duplicate_conflict).
        No evaluation is performed.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store, no-transform
        Content-Length:
          schema:
            type: integer
            enum:
            - 4096
            - 16384
            - 65536
            - 262144
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type:
                  const: https://arkret.org/problems/duplicate_conflict
                status:
                  const: 409
    PsiPolicyDenied:
      description: Requester/batch-level policy denial (error code policy_denied). This is a PSI Class B failure and uses
        the request phase's exact body bucket and advertised delay distribution; it contains no per-target information.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store, no-transform
        Content-Length:
          schema:
            type: integer
            enum:
            - 4096
            - 16384
            - 65536
            - 262144
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type:
                  const: https://arkret.org/problems/policy_denied
                status:
                  const: 403
    PsiQuotaExhausted:
      description: PSI window quota exhausted (error code psi_quota_exhausted), returned only at first blind admission. The
        body has the exact blind-phase Content-Length bucket and advertised delay distribution. Retry-After is decimal seconds
        until quota-window roll, rounded up to a 300-second multiple with minimum 300. See discovery-directory.md §6.4.
      headers:
        Retry-After:
          description: Decimal seconds, a positive multiple of 300.
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
        Cache-Control:
          schema:
            type: string
            const: no-store, no-transform
        Content-Length:
          schema:
            type: integer
            enum:
            - 4096
            - 16384
            - 65536
            - 262144
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type:
                  const: https://arkret.org/problems/psi_quota_exhausted
                status:
                  const: 429
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TemporarilyUnavailable:
      description: Temporarily unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
paths:
  /_arkret/describe:
    get:
      operationId: ak.server.read.describe
      security: []
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.server.read.describe.v1
      - name: service_kind
        in: query
        required: false
        description: Registered service_describe role to select. Required when one public binding exposes multiple co-located
          roles; the response describes exactly the selected role. Omission on a multi-role binding returns param_missing;
          an illegal or unavailable role returns param_invalid.
        schema:
          $ref: '#/components/schemas/ServiceDescribe/properties/service_kind'
      responses:
        '200':
          description: Service description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescribe'
        '400':
          description: param_missing when a shared multi-role binding requires service_kind; param_invalid for an illegal
            or unavailable role.
        '404':
