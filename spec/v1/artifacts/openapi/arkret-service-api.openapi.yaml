    post:
      operationId: ak.self.realm_link.command.create
      security:
      - bearerAuth: []
      summary: Submit a ak.realm.link Move.
      description: |
        Submits the caller-signed ak.realm.link from realm_id to
        target_realm_id; the service MUST NOT co-sign or rebuild it. The reducer
        runs realm_link_* validators (cycle detection, self-reference, kind
