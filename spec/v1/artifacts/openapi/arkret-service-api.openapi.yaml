  /_arkret/peer/service-resolution/publish:
    post:
      operationId: ak.peer.service_resolution.command.publish
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Durably mirror one exact target-signed service route artifact.
      description: |
        The authenticated Realm peer publishes exactly one ServiceResolutionRecord
        or ServiceRouteHandoverNotice. The receiver verifies current peer and target
        visibility, exact target proof, full-to-core projection, basis/chain/time
        rules and the 256 KiB body bound before durable acceptance. Idempotency-Key
        is required, is covered by the HTTP Message Signature and MUST equal body.request_id.
        Exact transport replay returns the original signed ack; an artifact integrity
        key reused with different bytes is a zero-overwrite duplicate conflict. The ack
        binds both keys and is receipt evidence, not URL authority.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.peer.service_resolution.command.publish.v1
      - name: Idempotency-Key
        in: header
        required: true
        description: MUST equal body.request_id byte-for-byte and be covered by the HTTP Message Signature.
        schema:
          type: string
          minLength: 1
          maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceResolutionPublishRequestBody'
      responses:
        '200':
          description: Receiver-signed durable exact-digest acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResolutionPublishOutcome'
        '409':
          description: Duplicate conflict, stale basis, notice conflict or route fork; zero overwrite.
        '413':
          description: Canonical request body exceeds 256 KiB.
  /_arkret/peer/service-resolution/resolve:
    query:
      operationId: ak.peer.service_resolution.read.resolve
      parameters:
      - name: Arkret-Operation
        in: header
