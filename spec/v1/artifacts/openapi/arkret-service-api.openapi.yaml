        '200':
          description: Exact actor-chain and Realm Seal authoring frontiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatusAuthoringFrontiersOutcome'
        '409':
          description: The PCR has no current fully verifiable accepted authoring frontier.
