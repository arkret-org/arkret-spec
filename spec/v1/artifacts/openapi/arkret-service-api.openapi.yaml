              $ref: '#/components/schemas/DidBindingChallengeRequestBody'
  /_arkret/gate/account/identity-abandonment-challenges:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.issue_identity_abandonment_challenge
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.issue_identity_abandonment_challenge.v1
      security:
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        holder_bound_authorization: true
        notes: Authorization is `DPoP <account_handoff_grant>` and MUST match the DPoP header key, current lease holder, and lease fence. The PCR was never accepted, so the holder has no principal and no principal-bound ak.session.grant can exist.
      summary: Issue a challenge that makes abandoning a provisional identity explicit.
      description: |
        Issues a server-generated single-use challenge for giving up a
        provisional identity whose Principal Control Realm was never accepted
        and whose identity root is lost. The Account Authority requires the
        supplied principal_id and did_version_id to equal the
        holder-authenticated reserved_identity_creation checkpoint, and MUST
        refuse once that PCR is accepted.

        The challenge binds the authenticated service account, handoff holder
        key, lease and fence, the abandoned principal and DID entry, the closed
        consequence disclosure, audience, origin, trust domain, purpose, and an
        expiry no more than 300 seconds out. Challenge state is durable shared
        state; expiry and prior consumption are distinct terminal states.

        This operation abandons nothing on its own. Ordinary login, session
        resume, lease fence advance and any other automated flow never fetch a
        challenge, which is what makes the abandonment structurally explicit.
      responses:
        '200':
          description: Persisted identity-abandonment challenge transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAbandonmentChallengeOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAbandonmentChallengeRequestBody'
  /_arkret/gate/account/identity-abandonments:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.abandon_identity_creation
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.abandon_identity_creation.v1
      security:
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        holder_bound_authorization: true
        notes: Authorization is `DPoP <account_handoff_grant>` and MUST match the DPoP header key. The presented handoff MUST be a fresh one and MUST NOT be the grant presented when the challenge was issued; the authentication strength behind it is deployment governance.
      summary: Explicitly abandon a provisional identity whose PCR was never accepted.
      description: |
        Consumes the abandonment challenge and performs the abandonment in one
        transaction: record the orphan-anchor tombstone / audit reservation,
        suppress the reserved_identity_creation checkpoint on every
        holder-readable surface, and release the identity-creation lease. Any
        step failing means zero writes.

        If the PCR was accepted between challenge issuance and confirmation the
        request fails with identity_creation_already_accepted and abandons
        nothing: an established identity is removed through account deletion,
        not through provisional-identity abandonment.

        Replaying the same request_id returns the recorded terminal outcome and
        never produces a second tombstone. The abandoned entry 0 remains a
        permanently unusable orphan anchor that cannot be deactivated; whether
        it is annotated on a discovery surface, when its handle and namespace
        are released and how long the reservation is retained are deployment
        governance.
      responses:
        '200':
          description: Recorded terminal outcome of the explicit abandonment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAbandonmentOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAbandonmentRequestBody'
  /_arkret/gate/account/register:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.register
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.register.v1
      security:
      - {}
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        proof_in_body: true
        proof_field: proof
        notes: Generic DID-first registration may use the closed body proof branch. Account-first identity_creation MUST use `DPoP <account_handoff_grant>` plus matching DPoP and the current lease/fence; the root control proof binds the persisted challenge transcript and exact DID operation digest.
      summary: Bind or create a deployment-local account record for a principal.
      description: |
        Auth Server lifecycle operation. The request uses principal_id rather
        than did and never accepts a bare handle. display_name is only a
        bootstrap display field; if persisted it lands in Actor Profile
        display_name via the canonical profile path.

        In the account-first identity_creation branch, the client sends the
        exact reserved unpublished DID operation. The Account Authority verifies
        the current holder/lease/fence and a fresh proof signed by the
        did:webvh entry-0 parameters.updateKeys[0] root, then submits the DID
        operation internally and writes the service-account binding only after
        accepted or byte-identical duplicate resolution. Identity root material
        is never accepted. The operation is idempotent by account, principal_id,
        and canonical operation digest.

        Register MAY return signed handle-claim evidence or digest/ref in the
        AccountRegisterOutcome, but handle issuance, approval, assignment, re-signing,
        and revocation remain issuer/coauth/deployment-governance strands.
      responses:
        '200':
          description: Account record bound or created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRegisterOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegisterRequestBody'
  /_arkret/gate/account/session-grants:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.issue_session_grant
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.issue_session_grant.v1
      security:
      - {}
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        proof_in_body: true
        proof_field: proof
        notes: |
          HumanSessionGrantRequest requires `Authorization: DPoP
          <account_handoff_grant>` plus matching DPoP and a closed accepted
          device possession proof in the body; it forbids requested_scope and
          a second holder body signature. AgentSessionGrantRequest uses the
          independent agent_key_proof branch and requires requested_scope.
          OIDC authorization codes are consumed only by authentication-handoffs.
      responses:
        '200':
          description: Standard SessionGrant issued after authorized human-device or Agent-runtime admission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrantOutcome'
        '403':
          description: Human device is unauthorized (device_unauthorized, zero grant) or Agent high-risk scope requires out-of-band controller approval (claim_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflicting canonical intent, terminal recorded replay, or replay record no longer decidable. A terminal replay carries closed session_grant_id/state details and never creates a replacement grant.
          content:
            application/problem+json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      error:
                        type: object
                        required: [code]
                        properties:
                          code:
                            enum: [duplicate_conflict, session_grant_replay_indeterminate, device_revocation_pending, device_revoked, device_generation_fenced]
                - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      error:
                        type: object
                        required: [code, details]
                        properties:
                          code:
                            const: session_grant_replay_terminal
                          details:
                            $ref: '#/components/schemas/SessionGrantReplayTerminalProblem'
        '410':
          description: The recorded exact-replay outcome has expired; the issuer returns its session_grant_id/state and creates no replacement.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    error:
                      type: object
                      required: [code, details]
                      properties:
                        code:
                          const: session_grant_replay_expired
                        details:
                          $ref: '#/components/schemas/SessionGrantReplayExpiredProblem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionGrantRequestBody'
  /_arkret/gate/account/session-grants/revoke:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.revoke_session
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.revoke_session.v1
      security:
      - bearerAuth: []
      summary: Revoke session grant or access-token authority.
      description: |
        Revokes session grant authority, not device
        authorization and does not create an AccountStatusRecord. An omitted request body
        revokes the current request's session grant. target_session_grant_id,
        target_device_id and all_sessions=true are mutually exclusive selectors.

        Cross grant, cross device, and all_sessions=true revocation requires a
        fresh DID/device proof or explicit capability; a bearer session credential
        alone is not enough to revoke other devices or all sessions. The issuer
        durably records the mutation outcome under a stable request identity;
        exact replay returns the recorded outcome and conflicting canonical
        intent returns duplicate_conflict without further state changes.
      responses:
        '200':
          description: Session revocation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeOutcome'
        '409':
          description: The stable revoke request identity conflicts with a different canonical intent, or replay retention no longer proves whether the mutation committed. Both outcomes fail closed with zero new state changes.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    error:
                      type: object
                      required: [code]
                      properties:
                        code:
                          enum: [duplicate_conflict, session_grant_replay_indeterminate]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRevokeRequestBody'
  /_arkret/gate/account/session-grants/refresh:
