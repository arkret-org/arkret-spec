  /_arkret/peer/device-revocations/check:
    post:
      operationId: ak.peer.device_revocations.command.check
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.peer.device_revocations.command.check.v1
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Derive the current device binding and linearize an exact immutable device-bound action intent against origin revocation state.
      description: The authenticated Account Authority supplies only selectors it can verify itself. The origin Station derives the current authorization Event and PCR-local integer generation from its own durable device projection under the same serializable fence used for revoke acceptance, compares them with any expected binding in the request, and persists an exact-intent signed decision receipt. A validated request always returns HTTP 200 with a closed allow, revocation_pending, revoked, authority_mismatch or generation_mismatch receipt; 409 device_revocation_pending/device_revoked belongs only to the protected business operation. Only allow carries the derived binding, which is the sole source for the issued grant device_binding. An allow receipt is valid for at most 30 seconds and only for the exact issue/refresh intent bytes; introspection carries no receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRevocationGateCheckRequestBody'
      responses:
        '200':
          description: Signed durable allow, revocation_pending, revoked, authority_mismatch or generation_mismatch decision receipt. A validated request always uses this typed 200 outcome; 409 gate errors belong to the blocked business operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRevocationGateCheckOutcome'
  /_arkret/peer/events:
    query:
      operationId: ak.peer.events.read.scan
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.peer.events.read.scan.v1
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Read a federation peer Event range with cursor pagination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsQueryPostRequestBody
      responses:
        '200':
          description: Federation peer Event read page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsQueryOutcome'
    post:
      operationId: ak.peer.events.command.submit
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Federation peer event push.
      description: |
        Accepts a service-to-service federation event batch. This is the only
        canonical HTTP binding for federation event push; client/self event
        submission remains under `/_arkret/self/events`. A federated
        `ak.member.state` compensation submission carries the unchanged
        transport-only `membership_compensation_evidence`; the receiver applies
        the same exact admission, incarnation, action, executor and single-use
        checks as initial submission. The request union also registers the
        discriminated `direct_conversation_founding` branch for the Direct
        Conversation founding exception (zh/sync/federation.md §4.0.4): it carries
        exactly four ordered Events, the source founding acceptance receipt and
        bounded dependencies, omits `service_binding_ref` because the Realm does
        not yet exist at the receiver, and reports a missing dependency as the
        top-level 409 below rather than a per-item partial.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.peer.events.command.submit.v1
      - in: header
        name: Idempotency-Key
        required: false
        description: |
          Conditional batch idempotency / replay key (federation.md section 3.2
          and 8.5). Required whenever the sender wants request-level idempotency,
          a batch replay key, or uncertain-outcome transport retry dedup; when
          present it MUST be covered by the HTTP Message Signature transcript.
          A byte-identical retry reuses the same key only when no response was
          received. Every received submit response terminates that key; any later
          evaluation, including a byte-identical post-backfill submit, MUST use a
          fresh key (or omit the header).
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsSubmitFederationRequestBody
      responses:
        '200':
          description: Federation event batch accepted, duplicated, partially rejected, or quarantined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsSubmitOutcome'
        '409':
          description: Registered atomic federation unit rejected with zero writes because exact Event or CBA dependencies are missing. error.code is dependency_missing and error.details conforms to EventsDependencyMissingProblem.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          const: dependency_missing
                        details:
                          $ref: '#/components/schemas/EventsDependencyMissingProblem'
