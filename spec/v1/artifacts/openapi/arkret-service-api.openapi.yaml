  /_arkret/peer/account-status:
    post:
      operationId: ak.peer.account_status.command.submit
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Replicate an authoritative AccountStatusRecord to a Station.
      description: |
        Accepts exactly one Account Authority-signed immutable record. The
        receiver verifies its identity, proof, binding tuple, strict sequence
        and predecessor before atomically advancing a monotonic local replica.
        Receipted fanout carries the same original record bytes. A retry
        with the same key and identical canonical body
        returns the latest durable operation state; reuse with different bytes
        is `duplicate_conflict`.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.peer.account_status.command.submit.v1
      - in: header
        name: Idempotency-Key
        required: true
        description: |
          Durable publication operation key. It MUST be covered by the HTTP
          Message Signature. Byte-identical retries reuse it while fanout is
          progressing; a different canonical
          body under the same key is rejected with `duplicate_conflict`.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusPublicationRequestBody'
      responses:
        '200':
          description: Durable local acceptance and propagation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatusPublicationOutcome'
        '409':
          description: Idempotency-Key conflict or invalid account-status transition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /_arkret/peer/mls/group-state-material:
    post:
      operationId: ak.peer.mls.read.group_state_material
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
