    FederationServiceBindingRef:
      type: object
      description: |
        Request-level service binding snapshot carried by federation
        service-to-service ak.peer.events.command.submit calls. This is metadata for the
        receiver to verify the sender's delivery decision; client writes omit it.
      required:
      - realm_id
      - realm_policy_digest
      - membership_frontier
      - delivery_binding_frontier
      - destination_service_type
      - reducer_profile_digest
      properties:
        realm_id:
          type: string
          pattern: ^ak:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        realm_policy_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        membership_frontier:
          type: array
          items:
            type: string
            pattern: ^ak:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        delivery_binding_frontier:
          type: array
          items:
            type: string
            pattern: ^ak:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        delivery_binding_diagnostics:
          type: object
          additionalProperties: true
        destination_service_type:
          type: string
          minLength: 1
        reducer_profile_digest:
          type: string
          description: SHA-256 over the Arkret canonical JSON bytes of the locally rebuilt content-addressed resolved_digest_input closure declared by artifacts/registry/reducer-profile-registry.json. Receivers independently resolve local event-kind, schema, fixture, and reducer-contract content and reject the whole federation batch with reducer_profile_mismatch on mismatch.
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false
