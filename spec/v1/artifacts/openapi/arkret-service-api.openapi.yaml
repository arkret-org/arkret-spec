            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatusPublicationOutcome'
        '409':
          description: Idempotency-Key conflict or invalid account-status transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /_arkret/peer/mls/group-state-material:
    post:
      operationId: ak.peer.mls.read.group_state_material
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Resolve verified MLS epoch-0 public group-state bytes.
      description: |
        Resolves one accepted `ak.mls.genesis` Event and returns its exact RFC
        9420 GroupInfo and ratchet_tree extension bytes. Before disclosure the
        provider verifies every request selector against the Event, recomputes
        SHA-256 over both raw byte strings, compares explicit digests and the
        hashes embedded in the content-addressed refs, and validates
        GroupInfo/tree consistency. The response is all-or-nothing and never
        contains private tree material, MLS secrets or inferred leaf DTOs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MlsGroupStateMaterialRequestBody'
