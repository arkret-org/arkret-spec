  /_arkret/gate/account/authentication-handoffs:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.exchange.create_handoff
      security:
      - dpopProof: []
      x-arkret-auth:
        public_metadata: false
        proof_in_body: true
        proof_field: proof
        notes: The OIDC code-exchange proof and request DPoP proof MUST resolve to the same holder key. The Account Authority binds the returned account_handoff_grant to that key's RFC 7638 thumbprint.
      summary: Exchange account authentication for a holder-bound onboarding handoff.
      description: |
        Exchanges an OIDC authorization code at the issuer token endpoint and
        returns an opaque short-lived account_handoff_grant. The handoff is not
        ak.session.grant and has no refresh-token semantics. It can be used only
        at the operations in allowed_operations.

        For an unbound service account this operation atomically acquires or
        renews the current holder's identity-creation lease. A different holder
        receives identity_creation_busy while the lease is live. After expiry,
        a newly authenticated holder for the same service account fences the old
        lease and inherits any reserved DID-operation checkpoint. For a
        bound account the response carries principal_id so the handoff can be
        exchanged at /session-grants.
      responses:
        '200':
          description: Holder-bound account handoff and current binding/lease state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHandoffOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountHandoffRequestBody'
  /_arkret/gate/account/onboarding:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    get:
      operationId: ak.gate.account.read.onboarding
      security:
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        holder_bound_authorization: true
        notes: Authorization is `DPoP <account_handoff_grant>` and the DPoP header key MUST match the live handoff holder. The operation is read-only and grants no command authority.
      summary: Read the Account Authority's current onboarding projection.
      description: |
        Reloads the durable identity-creation lease or established binding for
        the authenticated account handoff. Clients MUST reconcile local
        onboarding artifacts against this projection after reload, callback,
        process restart, or an uncertain command result. The client supplies no
        phase, goal, checkpoint, or recovery material to this operation.
      responses:
        '200':
          description: Fresh server-authored onboarding projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOnboardingSnapshot'
  /_arkret/gate/account/identity-binding-challenges:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.issue_identity_binding_challenge
      security:
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        holder_bound_authorization: true
        notes: Authorization is `DPoP <account_handoff_grant>` and MUST match the DPoP header key, current lease holder, and lease fence.
      summary: Reserve a DID inception operation and issue a fresh root-control challenge.
      description: |
        Validates the complete unpublished DID operation, derives principal_id
        and its canonical digest, persists the holder-authenticated operation checkpoint, and
        issues a server-generated single-use challenge with a freshness window
        no longer than 300 seconds. Challenge state is durable shared state and
        binds the authenticated service account, handoff holder key, lease and
        fence, principal, operation digest, audience, origin, trust domain,
        purpose, and expiry.

        Repeating the same request_id returns the same unconsumed challenge.
        Reissuing with a new request_id invalidates any older unconsumed
        challenge for the same lease/fence without changing the reserved DID
        operation.
      responses:
        '200':
          description: Persisted identity-binding challenge transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityBindingChallengeOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityBindingChallengeRequestBody'
  /_arkret/gate/account/did-binding-challenges:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.issue_did_binding_challenge
      security:
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        holder_bound_authorization: true
        notes: Authorization is `DPoP <account_handoff_grant>` and MUST match the DPoP header key.
      summary: Issue a control challenge for binding an already-published DID.
      description: |
        Resolves the supplied already-published DID at the high freshness tier
        (synchronous refresh or fail closed), derives did_version_id,
        log_head_digest and control_key_digest from the resolved current entry,
        and issues a server-generated single-use challenge with a freshness
        window no longer than 300 seconds.

        Caller-supplied DID history is never accepted. Deployments that do not
        host the DID additionally require method-native witness or freshness
        evidence, because co-locating the registry with the Principal Server
        does not extend that trust to third-party DIDs.

        This operation reserves no principal and performs no PCR genesis; it
        only proves current control of an existing DID. Repeating the same
        request_id returns the same unconsumed challenge.
      responses:
        '200':
          description: Persisted DID-binding challenge transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DidBindingChallengeOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DidBindingChallengeRequestBody'
  /_arkret/gate/account/identity-abandonment-challenges:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.issue_identity_abandonment_challenge
      security:
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        holder_bound_authorization: true
        notes: Authorization is `DPoP <account_handoff_grant>` and MUST match the DPoP header key, current lease holder, and lease fence. The PCR was never accepted, so the holder has no principal and no principal-bound ak.session.grant can exist.
      summary: Issue a challenge that makes abandoning a provisional identity explicit.
      description: |
        Issues a server-generated single-use challenge for giving up a
        provisional identity whose Principal Control Realm was never accepted
        and whose identity root is lost. The Account Authority requires the
        supplied principal_id and did_version_id to equal the
        holder-authenticated reserved_identity_creation checkpoint, and MUST
        refuse once that PCR is accepted.

        The challenge binds the authenticated service account, handoff holder
        key, lease and fence, the abandoned principal and DID entry, the closed
        consequence disclosure, audience, origin, trust domain, purpose, and an
        expiry no more than 300 seconds out. Challenge state is durable shared
        state; expiry and prior consumption are distinct terminal states.

        This operation abandons nothing on its own. Ordinary login, session
        resume, lease fence advance and any other automated flow never fetch a
        challenge, which is what makes the abandonment structurally explicit.
      responses:
        '200':
          description: Persisted identity-abandonment challenge transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAbandonmentChallengeOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAbandonmentChallengeRequestBody'
  /_arkret/gate/account/identity-abandonments:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.abandon_identity_creation
      security:
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        holder_bound_authorization: true
        notes: Authorization is `DPoP <account_handoff_grant>` and MUST match the DPoP header key. The presented handoff MUST be a fresh one and MUST NOT be the grant presented when the challenge was issued; the authentication strength behind it is deployment governance.
      summary: Explicitly abandon a provisional identity whose PCR was never accepted.
      description: |
        Consumes the abandonment challenge and performs the abandonment in one
        transaction: record the orphan-anchor tombstone / audit reservation,
        suppress the reserved_identity_creation checkpoint on every
        holder-readable surface, and release the identity-creation lease. Any
        step failing means zero writes.

        If the PCR was accepted between challenge issuance and confirmation the
        request fails with identity_creation_already_accepted and abandons
        nothing: an established identity is removed through account deletion,
        not through provisional-identity abandonment.

        Replaying the same request_id returns the recorded terminal outcome and
        never produces a second tombstone. The abandoned entry 0 remains a
        permanently unusable orphan anchor that cannot be deactivated; whether
        it is annotated on a discovery surface, when its handle and namespace
        are released and how long the reservation is retained are deployment
        governance.
      responses:
        '200':
          description: Recorded terminal outcome of the explicit abandonment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAbandonmentOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAbandonmentRequestBody'
  /_arkret/gate/account/register:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.register
      security:
      - {}
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        proof_in_body: true
        proof_field: proof
        notes: Generic DID-first registration may use the closed body proof branch. Account-first identity_creation MUST use `DPoP <account_handoff_grant>` plus matching DPoP and the current lease/fence; the root control proof binds the persisted challenge transcript and exact DID operation digest.
      summary: Bind or create a deployment-local account record for a principal.
      description: |
        Auth Server lifecycle operation. The request uses principal_id rather
        than did and never accepts a bare handle. display_name is only a
        bootstrap display field; if persisted it lands in Actor Profile
        display_name via the canonical profile path.

        In the account-first identity_creation branch, the client sends the
        exact reserved unpublished DID operation. The Account Authority verifies
        the current holder/lease/fence and a fresh proof signed by the
        did:webvh entry-0 parameters.updateKeys[0] root, then submits the DID
        operation internally and writes the service-account binding only after
        accepted or byte-identical duplicate resolution. Identity root material
        is never accepted. The operation is idempotent by account, principal_id,
        and canonical operation digest.

        Register MAY return signed handle-claim evidence or digest/ref in the
        AccountRegisterOutcome, but handle issuance, approval, assignment, re-signing,
        and revocation remain issuer/coauth/deployment-governance strands.
      responses:
        '200':
          description: Account record bound or created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRegisterOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegisterRequestBody'
  /_arkret/gate/account/session-grants:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.issue_session_grant
      security:
      - {}
      - accountHandoffAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        proof_in_body: true
        proof_field: proof
        notes: |
          DID/passkey/OIDC/device/agent branches authenticate in the body.
          proof_kind=pre_registration_handoff instead requires `Authorization:
          DPoP <account_handoff_grant>` plus matching DPoP; the handoff account
          MUST already be bound to the required principal_id. Principal session
          provisioning is internal.
      responses:
        '200':
          description: Session grant issued from passkey/OIDC/device proof. This is the single client-visible login result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrantOutcome'
        '403':
          description: Agent high-risk scope requires out-of-band controller approval. Returns error.code=claim_required and closed error.details; no CAPTCHA, OTP, or browser challenge is exposed to the agent runtime.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - type: object
                  properties:
                    error:
                      type: object
                      required:
                      - code
                      - details
                      properties:
                        code:
                          const: claim_required
                        details:
                          $ref: '#/components/schemas/AgentHumanApprovalProblem'
        '409':
          description: Conflicting canonical intent, terminal recorded replay, or replay record no longer decidable. A terminal replay carries closed grant_id/state details and never creates a replacement grant.
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        required: [code]
                        properties:
                          code:
                            enum: [duplicate_conflict, session_grant_replay_indeterminate]
                - allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        required: [code, details]
                        properties:
                          code:
                            const: session_grant_replay_terminal
                          details:
                            $ref: '#/components/schemas/SessionGrantReplayTerminalProblem'
        '410':
          description: The recorded exact-replay outcome has expired; the issuer returns its grant_id/state and creates no replacement.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - type: object
                  properties:
                    error:
                      type: object
                      required: [code, details]
                      properties:
                        code:
                          const: session_grant_replay_expired
                        details:
                          $ref: '#/components/schemas/SessionGrantReplayExpiredProblem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionGrantRequestBody'
  /_arkret/gate/account/session-grants/revoke:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.revoke_session
      security:
      - bearerAuth: []
      summary: Revoke session grant or access-token authority.
      description: |
        Revokes session grant authority, not device
        authorization and not durable ak.account.status. An omitted request body
        revokes the current request's session grant. target_grant_id,
        target_device_id and all_sessions=true are mutually exclusive selectors.

        Cross grant, cross device, and all_sessions=true revocation requires a
        fresh DID/device proof or explicit capability; a bearer session credential
        alone is not enough to revoke other devices or all sessions. The issuer
        durably records the mutation outcome under a stable request identity;
        exact replay returns the recorded outcome and conflicting canonical
        intent returns duplicate_conflict without further state changes.
      responses:
        '200':
          description: Session revocation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeOutcome'
        '409':
          description: The stable revoke request identity conflicts with a different canonical intent, or replay retention no longer proves whether the mutation committed. Both outcomes fail closed with zero new state changes.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - type: object
                  properties:
                    error:
                      type: object
                      required: [code]
                      properties:
                        code:
                          enum: [duplicate_conflict, session_grant_replay_indeterminate]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRevokeRequestBody'
  /_arkret/gate/account/session-grants/refresh:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.refresh_session_grant
      security:
      - dpopProof: []
      summary: Rotate a DPoP-bound session grant.
      description: |
        Rotate a near-expiry, DPoP-bound session grant onto a fresh one without
        re-running OIDC (account-lifecycle §4.1, device-lifecycle §3.3). The
        caller MUST present a DPoP header proving possession of the key bound
        into the grant's cnf.jkt (ath = the prior grant). The new grant keeps
        cnf.jkt, subject, scope and audience and gets a fresh minutes-to-hours
        expiry; the predecessor is atomically superseded by the successor. audience MUST NOT change
        across rotation (else audience_mismatch); a consumed grant returns
        grant_already_consumed; a logged-out browser session returns
        session_logged_out.
      responses:
        '200':
          description: Rotated session grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrantRefreshOutcome'
        '409':
          description: Conflicting refresh intent, terminal recorded successor, or replay record no longer decidable. A terminal replay carries closed grant_id/state details and never creates a second successor.
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        required: [code]
                        properties:
                          code:
                            enum: [duplicate_conflict, session_grant_replay_indeterminate]
                - allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        required: [code, details]
                        properties:
                          code:
                            const: session_grant_replay_terminal
                          details:
                            $ref: '#/components/schemas/SessionGrantReplayTerminalProblem'
        '410':
          description: The recorded successor has expired; the issuer returns its grant_id/state and creates no second successor.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - type: object
                  properties:
                    error:
                      type: object
                      required: [code, details]
                      properties:
                        code:
                          const: session_grant_replay_expired
                        details:
                          $ref: '#/components/schemas/SessionGrantReplayExpiredProblem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionGrantRefreshRequestBody'
  /_arkret/gate/account/recovery-session-grants/issue:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.issue_recovery_completion_grant
      security:
      - dpopProof: []
      summary: Issue a Standard grant after root-anchored recovery completion.
      description: |
        Uses the still-live Bound AccountHandoff and its HTTP DPoP key to issue
        one Standard grant bound to the accepted replacement device. The caller
        supplies the completed RecoveryTransaction receipt, coordinator
        attestation and InitialSessionGrantIntent. No temporary recovery grant
        is issued. An identical replay returns the stored issuance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCompletionGrantRequestBody'
      responses:
        '200':
          description: Bound handoff consumed and replacement-device Standard grant issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCompletionGrantOutcome'
  /_arkret/gate/account/auth-sessions/logout:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.logout_auth_session
      security:
      - bearerAuth: []
      summary: Auth-side session logout sub-operation.
      description: |
        Account Authority to Auth Server service-to-service sub-operation used
        by the single client-visible account logout. The Account Authority has
        already validated Authorization: Bearer <ak.session.grant> plus DPoP on
        POST /_arkret/gate/account/logout. It calls this endpoint with the
        configured Account Authority -> Auth Server S2S bearer
        (session_grant_introspection_bearer) to log out the Auth-side
        browser/auth session owning the supplied grant and terminate that
        session's grant rotation chain.

        Ordinary clients MUST NOT call this endpoint, MUST NOT derive it from
        gate_account_base, and MUST NOT retry it directly. Clients retry only
        POST /_arkret/gate/account/logout.
      responses:
        '200':
          description: Auth-side session logout completed or was already inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionLogoutOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionLogoutRequestBody'
  /_arkret/gate/account/session-grants/introspect:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.introspect_session_grant
      security:
      - bearerAuth: []
      summary: Server-to-server session-grant introspection.
      description: |
        RFC 7662-style introspection used by a Principal Server to validate a
        presented session grant. The caller supplies the grant id or grant_jwt
        (plus an optional audience and optional S2S holder confirmation) and
        gets back whether the grant is active, a standardized status, and
        non-secret grant metadata — including session_public_key for RFC 9421
        PoP verification and cnf_jkt for local DPoP verification on
        /_arkret/self/*. READ-ONLY: introspection MUST NOT consume or revoke
        the grant (consumption/rotation is the refresh endpoint's job).
        Authenticated by the configured session_grant_introspection_bearer (a
        server-local static bearer) or an admin scope.
      responses:
        '200':
          description: Introspection result (active flag, status, grant metadata).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrantIntrospectOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionGrantIntrospectRequestBody'
  /_arkret/gate/account/controller-gate-attestations:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.issue_controller_gate_attestation
      security:
      - httpMessageSignature: []
      x-arkret-auth:
        public_metadata: false
        holder_proof: false
        notes: Authenticated S2S only. The receiver independently verifies the request's current signed ServiceResolutionRecord, method evidence and normalized DID Document before using its active assertion key for RFC 9421. Bearer does not replace the signature. The verified source service must equal request.agent_authority_service_id and service_id in the controller current AcceptedAtServiceBinding.
      summary: Issue the Account Authority controller lifecycle gate used in Native Agent signer evidence.
      description: |
        The Account Authority reads its own current account binding/status
        projection and signs one privacy-minimal controller lifecycle snapshot
        under ak.controller-account-gate-v1. The attestation lifetime is at most
        300 seconds. It intentionally omits operation, request digest, audience
        and challenge because per-request current_observation and outer
        attestation bind its digest to those exact values. Unknown principal,
        missing current binding, wrong source service and unauthorized callers
        are indistinguishable. No account_id or raw account cell is returned.
        The HTTP signature covers method, target URI/path, Content-Digest,
        Source/Destination-Service-ID, operation id and request id. DidCoreId,
        URL, bearer and caller-supplied keys are not verification-key sources.
      responses:
        '200':
          description: Byte-stable controller gate attestation issuance outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerAccountGateAttestationIssueOutcome'
        '404':
          description: Uniform non-enumerating outcome for unknown, unbound, wrong-service or unauthorized requests.
        '409':
          description: The request_id was already bound to a different canonical intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerAccountGateAttestationIssueRequestBody'
  /_arkret/gate/account/logout:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.logout
      security:
      - bearerAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        holder_proof: true
        notes: Account hard logout MUST present the current ak.session.grant as Authorization bearer and a DPoP proof whose ath binds that grant and whose htm/htu bind POST /_arkret/gate/account/logout.
      summary: Account Authority hard logout.
      description: |
        Ordinary hard logout at the Account Authority (account-lifecycle §4.1),
        and the only client-visible logout endpoint. The Account Authority
        validates the current ak.session.grant plus DPoP, terminates the
        Auth-side auth session / grant rotation chain (via
        auth-sessions/logout when Auth-side is split out), then terminates or
        durably schedules Principal-side local account/device session cleanup,
        to-device drop, and push registration removal. Does not emit
        ak.device.revoke, does not erase durable device authorization (re-login
        restores the device), and does not rewrite ak.account.status. Distinct
        from revoke_session (targeted session-grant revoke).
      responses:
        '200':
          description: Account Authority hard logout completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLogoutOutcome'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLogoutRequestBody'
  /_arkret/gate/account/device-pair:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.pair_device
      security:
      - bearerAuth: []
        dpopProof: []
      responses:
        '200':
          description: Device pairing accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDevicePairOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDevicePairRequestBody'
  /_arkret/gate/account/agent-key-pair:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.pair_agent_key
      description: Native personal agent runtime key pairing. Requires a ready controller-owned managed-PCR recovery backup covering the pre-commit Agent PCR frontier and a controller-signed, verifier/audience/challenge-bound private requested_scope disclosure whose digest matches the accepted-at public DID commitment. The disclosure is transaction evidence and is never copied into the authorization Event or public history. The operation validates verification_method ↔ agent_id consistency and writes ak.agent.key.authorize on approval. The accepted authorization advances the frontier and makes recovery stale until a post-commit backup tail is accepted; that transition does not roll back this successful pairing but blocks the next pairing commit. Agent runtime private keys are locally generated and never uploaded or restored.
      security:
      - bearerAuth: []
      - httpMessageSignature: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: MUST equal authorize_event.event.event_id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._~:-]+$'
      responses:
        '200':
          description: Agent key pairing accepted; ak.agent.key.authorize event written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentKeyPairOutcome'
        '409':
          description: Pairing failed (verification_method_principal_mismatch, pairing_request_expired, agent_pcr_recovery_not_ready, proof_invalid, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentKeyPairRequestBody'
  /_arkret/self/agents:
    get:
      operationId: ak.self.agent.read.list
      description: List native personal agents visible to the authenticated controller.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
    post:
      operationId: ak.self.agent.command.provision
      description: Managed personal Agent provisioning. The controller first publishes a signed PCR-independent did:webvh entry 0. phase=prepare requires the authenticated controller account's controller_principal_server_id, validates the pair against the current session, then verifies caller-supplied full_id and returns its exact accepted initial_resolution, controller PCR, delegation ref, scope digest and allocation without generating a DID/private key or choosing a PCR id. The controller freezes the PCR create with that commitment, derives principal_control_realm_id from its event_id and commits one controller-signed ak.agent.provision Event. Ordinary admission atomically projects provision/accountability/selector/realm-id-claim and returns awaiting_pcr_genesis. Separate PCR acceptance returns awaiting_did_binding; only the controller-signed continuous DID entry 1 carrying the exact create-locked binding exposes Agent/pairing/list/get and returns complete. requested_scope is an immutable ceiling, not a grant; the service creates no Agent DID/PCR/MLS private state.
      security:
      - bearerAuth: []
        dpopProof: []
      responses:
        '200':
          description: Prepare returns awaiting_controller_event; commit returns awaiting_pcr_genesis; PCR acceptance returns awaiting_did_binding; accepting the exact controller-signed DID binding entry 1 makes replay return complete with pending PCR recovery and the runtime pairing handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProvisionOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProvisionRequestBody'
  /_arkret/self/agent-provisioning-abandonment-challenges:
    post:
      operationId: ak.self.agent.command.issue_provisioning_abandonment_challenge
      description: |
        Issues a single-use challenge for explicitly giving up an accepted
        ak.agent.provision whose declared managed Agent PCR genesis was never
        accepted. The service requires agent_id, principal_control_realm_id and
        allocation_handle to equal the authenticated controller's accepted
        provisioning, and MUST refuse once that genesis is accepted.

        The challenge binds the controller account subject and holder key, the
        agent and its slug, the declared realm id, the allocation, the closed
        consequence disclosure, audience, origin, trust domain, purpose, and an
        expiry no more than 300 seconds out. Challenge state is durable shared
        state; expiry and prior consumption are distinct terminal states.

        This operation abandons nothing on its own. Lease expiry, garbage
        collection and every other automated path never fetch a challenge,
        which is what makes the abandonment structurally explicit.
      security:
      - bearerAuth: []
        dpopProof: []
      responses:
        '200':
          description: Persisted agent-provisioning abandonment challenge transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProvisioningAbandonmentChallengeOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProvisioningAbandonmentChallengeRequestBody'
  /_arkret/self/agent-provisioning-abandonments:
    post:
      operationId: ak.self.agent.command.abandon_provisioning
      description: |
        Consumes the abandonment challenge and performs the abandonment in one
        transaction: release the agent_slug selector claim and the
        principal_control_realm_id claim, record the tombstone / audit
        reservation, and suppress every holder-readable trace of the
        allocation. Any step failing means zero writes. The presented
        credentials MUST be fresh and MUST NOT be the ones presented when the
        challenge was issued; re-authentication strength, risk checks and
        cooldown are deployment governance.

        If the managed Agent PCR genesis was accepted between challenge
        issuance and confirmation the request fails with
        agent_pcr_genesis_already_accepted and abandons nothing: an established
        Agent is retired through ak.self.agent.command.deactivate.

        Replaying the same request_id returns the recorded terminal outcome and
        never produces a second tombstone. The accepted ak.agent.provision
        Event stays in the controller PCR history, and the abandoned realm id
        is never reused.
      security:
      - bearerAuth: []
        dpopProof: []
      responses:
        '200':
          description: Recorded terminal outcome of the explicit provisioning abandonment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProvisioningAbandonmentOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProvisioningAbandonmentRequestBody'
  /_arkret/self/agents/{agent_id}:
    get:
      operationId: ak.self.agent.resource.get
      description: Read one native personal agent projection.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentView'
  /_arkret/self/agents/{agent_id}/renew-pairing:
    post:
      operationId: ak.self.agent.command.renew_pairing
      description: Re-open pairing on any non-terminal agent with a fresh single-use pairing handle, the unchanged requested_scope_digest DID commitment, and the current managed-PCR recovery projection. All previously issued handles stay permanently unresolvable. An Agent without an active accepted runtime-key authorization uses bootstrap; an Agent holding an active authorized key (lifecycle active or paused) uses replacement while lifecycle intent, existing keys and grants stay untouched until one controller-signed authorization atomically supersedes the prior keys. Generic views express the open branch through pairing_mode/handle fields and readiness blockers and never expose runtime_state; that diagnostic is pairing-poll-local. Neither branch creates, revokes, or re-issues Realm grants. Pair commit requires pcr_recovery.status=ready; deactivated rejects.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pairing renewed; fresh pending runtime key pairing returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRenewPairingOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRenewPairingRequestBody'
  /_arkret/self/agents/{agent_id}/pause:
    post:
      operationId: ak.self.agent.command.pause
      description: Pause a native personal agent and reject new agent sessions.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLifecycleState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPauseRequestBody'
  /_arkret/self/agents/{agent_id}/resume:
    post:
      operationId: ak.self.agent.command.resume
      description: Resume a paused native personal agent after freshness and sidecar disclosure checks.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLifecycleState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentResumeRequestBody'
  /_arkret/self/agents/{agent_id}/deactivate:
    post:
      operationId: ak.self.agent.command.deactivate
      description: Terminally deactivate a native personal agent with one controller-authorized lifecycle Event. Once accepted, the parent lifecycle AND gate makes every subordinate key, session, pairing handle, capability grant, KeyPackage, presence and future submission ineffective; client-authored revoke bundles are forbidden and asynchronous cleanup is not a success prerequisite.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLifecycleState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDeactivateRequestBody'
  /_arkret/self/agents/{agent_id}/grants:
    post:
      operationId: ak.self.agent.grant.command.attach
      description: Attach a complete controller-authored ak.capability.grant EventInitialSubmission to a native personal agent together with a controller-signed, verifier-bound private requested_scope disclosure. The closed CapabilityGrantBody has no inner proof; the Event envelope proof is the sole durable issuer signature, and the service submits the exact Event bytes through ordinary admission without signing or synthesis fallback. The verifier recomputes the accepted-at public DID commitment; grant actions and resources must be covered by the disclosed immutable ceiling, all provision constraints remain mandatory, no defaults are added, and the disclosure is never copied into Realm history.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Grant attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGrantAttachOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentGrantAttachRequestBody'
  /_arkret/self/agents/{agent_id}/grants/{grant_id}:
    delete:
      operationId: ak.self.agent.grant.resource.delete
      description: Detach or revoke a capability grant from a native personal agent.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      - in: path
        name: grant_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Grant detached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGrantDetachOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentGrantDetachRequestBody'
  /_arkret/self/agent-sidecars:ensure:
    post:
      operationId: ak.self.agent.sidecar.command.ensure
      description: |
        Prepare persists only a private reservation. First commit accepts exactly
        the controller-signed ak.sidecar.create Event; sidecar_id retypes the creating Event's full 44-character token
        from that Event. A separate ak.sidecar.context.attach Event records only a
        source-context mapping and creates no Circle, membership, Strand or Relation.
        An existing Sidecar uses the attach branch only. The closed prepared/accepted
        outcome maps all three request phases without inventing another state.
        Source context is never part of the MLS control frontier or
        security-frontier digest.
      security:
      - bearerAuth: []
        dpopProof: []
      responses:
        '200':
          description: Agent Sidecar and context Strand ensured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSidecarEnsureOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSidecarEnsureRequestBody'
  /_arkret/self/agent-sidecars/{sidecar_id}:
    get:
      operationId: ak.self.agent.sidecar.resource.get
      description: Return one Agent Sidecar owned by the authenticated controller, including desired/effective Agent access and readiness. Foreign, unauthorized, and nonexistent IDs are indistinguishable.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: sidecar_id
        required: true
        schema:
          type: string
          pattern: '^ak:sidecar:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '200':
          description: Agent Sidecar view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSidecarView'
  /_arkret/self/agent-sidecars:
    get:
      operationId: ak.self.agent.sidecar.read.list
      description: List Agent Sidecars owned by the authenticated controller. An optional realm_id filter narrows the result without exposing other controllers' objects.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: realm_id
        required: false
        schema:
          type: string
          pattern: '^ak:realm:[A-Za-z0-9_-]{44}$'
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Agent Sidecar list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSidecarList'
  /_arkret/self/agents/{agent_id}/participation:
    put:
      operationId: ak.self.agent.participation.resource.replace
      description: Replace one controller-private per-scope participation selection at its Account Authority. First write uses expected_version=0; successful writes increment by one. Selection grants no capability and is intersected with current target policy at action time.
      security:
      - bearerAuth: []
        dpopProof: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Participation selection stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentParticipationOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentParticipationReplaceRequestBody'
    get:
      operationId: ak.self.agent.participation.resource.get
      description: Get the Account Authority's current versioned per-scope participation selections (controller-self only).
      security:
      - bearerAuth: []
        dpopProof: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current participation selections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentParticipationOutcome'
  /_arkret/gate/account/oidc/callback:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.exchange.complete_oidc
      security: []
      x-arkret-auth:
        public_metadata: false
        proof_in_body: true
        proof_field: code
        notes: Optional browser redirect landing only. It validates state/code/nonce for deployment handoff, but MUST NOT return SessionGrantOutcome, ak.session.grant, or Principal local session material; client-visible grant issuance is only via POST /_arkret/gate/account/session-grants with proof_kind=oidc_code_exchange.
      responses:
        '200':
          description: OIDC browser handoff accepted; no session material is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOidcCallbackOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountOidcCallbackRequestBody'
