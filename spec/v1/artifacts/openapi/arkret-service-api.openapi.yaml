  /_arkret/open/principals/{principal_id}/resolution:
    get:
      operationId: ak.open.identity.read.resolution
      security: []
      x-arkret-auth:
        public_metadata: true
        proof_in_body: false
      summary: Read the current public principal resolution projection.
      description: |
        Returns the account's current resolution projection, bounded adapter
        method history evidence and the Principal Server projection attestation.
        It carries no Principal Control Realm id, genesis Event, genesis receipt,
        resolution Event, accepted Seal or cell proof: that account-internal audit
        and recovery material is served only by
        ak.self.identity.read.resolution_audit under holder or recovery
        authorization, so this surface has no history selector.
        The response is discovery evidence, never an authorization result.
        A caller performing a sensitive operation MUST obtain a fresh response,
        verify the exact (principal_id, principal_server_id) account authority,
        verify the attestation proof under the current principal_server_id method
        history, resolve the returned full_id with the registered method adapter,
        and confirm project(full_id) equals principal_id. Callers are not required
        to persist another principal's resolution binding.
      parameters:
      - name: principal_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
      - name: principal_server_id
        in: query
        required: true
        description: >-
          Principal Server that owns the account authority for this principal.
          Together with principal_id this is the complete public selector.
        schema:
          type: string
          pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
      responses:
        '200':
          description: Current public principal resolution projection.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store, no-transform
          content:
            application/json:
              schema:
                $ref: ../schemas/identity-resolution.schema.json#/$defs/public_principal_resolution
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /_arkret/open/services/{service_id}/resolution:
    get:
      operationId: ak.open.service.read.resolution
      security: []
      x-arkret-auth:
        public_metadata: true
        proof_in_body: false
      summary: Read the current signed ServiceResolutionRecord.
      description: |
        Stable refresh surface named by ServiceResolutionRecord.current_record_url.
        The server returns the current record for the exact stable service did_core_id.
        TLS transports bytes but does not establish service identity; callers verify
        the record proof, method history, core projection, time ordering, successor
        sequence and describe binding. Cross-origin redirects are not followed unless
        separately authorized, and clients apply SSRF, DNS-rebinding, size and timeout
        controls. A same-core successor refreshes routing without a Realm rebind.
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
      responses:
