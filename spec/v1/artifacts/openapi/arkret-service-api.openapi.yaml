      operationId: ak.peer.erasure_receipt.command.submit
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Submit a signed hard-erasure receipt package.
      description: |
        Source-Service-ID must equal the receipt issuer. The receiver verifies
        issuer authority, all receipt proofs, receipt_digest and exact retained
        stub binding before deletion or acknowledgement. Idempotency-Key is
        covered by the HTTP Message Signature; an identical retry returns the
        original byte-identical signed acceptance and a different body is
        duplicate_conflict with zero writes.
