  /_arkret/describe:
    get:
      operationId: ak.server.read.describe
      security: []
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.server.read.describe.v1
      - name: service_kind
        in: query
        required: false
        description: >-
          Registered service_describe role to select. Required when one public
          binding exposes multiple co-located roles; the response describes
          exactly the selected role. Omission on a multi-role binding returns
          param_missing; an illegal or unavailable role returns param_invalid.
        schema:
          $ref: '#/components/schemas/ServiceDescribe/properties/service_kind'
      responses:
        '200':
          description: Service description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescribe'
        '400':
          description: >-
            param_missing when a shared multi-role binding requires
            service_kind; param_invalid for an illegal or unavailable role.
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
