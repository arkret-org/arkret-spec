      security: []
      x-arkret-auth:
        public_metadata: true
        proof_in_body: false
      summary: Read the current authenticated service-resolution closure.
      description: |
        Stable refresh surface named by ServiceResolutionRecord.current_record_url.
        The server returns the current AuthenticatedServiceResolution for the exact
        stable service did_core_id. For did:webvh, the response includes the complete
        gap-free native log from inception through the record position and every
        required witness record; a resolver summary or partial log is invalid.
        TLS transports bytes but does not establish service identity; callers verify
        the record proof, method history, core projection, time ordering, successor
        sequence and describe binding. Cross-origin redirects are not followed unless
        separately authorized, and clients apply SSRF, DNS-rebinding, size and timeout
        controls. A same-core successor refreshes routing without a Realm rebind.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
