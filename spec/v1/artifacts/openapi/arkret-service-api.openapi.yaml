      summary: Rotate a DPoP-bound session grant.
      description: |
        Rotate a near-expiry DPoP-bound SessionGrant using a closed human or
        Agent request variant. Both use Authorization: DPoP plus a DPoP proof
        for the predecessor cnf.jkt (ath = prior grant), and neither accepts a
        client challenge or generic proof_kind. Human additionally presents
        accepted-device PoP verified with current authorization in one
        linearization; Agent presents its current runtime-key proof. The successor keeps
        cnf.jkt, subject, scope and audience and gets a fresh minutes-to-hours
        expiry; the predecessor is atomically superseded by the successor. audience MUST NOT change
        across rotation (else audience_mismatch); a consumed grant returns
        grant_already_consumed; a logged-out browser session returns
        session_logged_out.
