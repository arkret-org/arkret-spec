  /_arkret/self/applets/{applet_id}/ghosts/provision:
    post:
      operationId: ak.self.applet.ghost.command.provision
      summary: Provision an Applet-managed Ghost Actor for one external user.
      description: |
        Called by an installed bridge Applet (authenticating as its service DID)
        to provision, or idempotently re-validate, an Applet-managed Ghost Actor
        for one immutable `external_ref.{protocol,instance_id,external_id}` tuple.
        The caller supplies the exact Station-signed authoring request
        and role-neutral Applet-authored managed-actor bundle. The server MUST
        validate their exact active registration, authority pair, grant, actor
        namespace and initial-resolution bindings, then commit all four Events
        and the durable record atomically; it MUST NOT mint or reconstruct caller
        proofs. Re-provisioning the same `(applet_id, external_ref.protocol,
        external_ref.instance_id, external_ref.external_id)` MUST return the
        existing refs instead of creating a duplicate.
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        contentDigest: []
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.applet.ghost.command.provision.v1
      - in: path
        name: applet_id
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Ghost Actor provisioned (or existing refs re-confirmed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GhostActorProvisionOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GhostActorProvisionRequestBody'
