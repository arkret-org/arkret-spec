              schema:
                $ref: '#/components/schemas/MlsGroupStateMaterialOutcome'
        '409':
          description: Event/object material is unavailable, inconsistent, or not accepted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The complete response exceeds the caller or protocol byte bound.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /_arkret/peer/erasure-receipts:
    post:
      operationId: ak.peer.erasure_receipt.command.submit
      security:
