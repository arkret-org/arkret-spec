      description: Re-open pairing on any non-terminal agent with a fresh single-use pairing handle and the unchanged requested_scope_digest
        DID commitment. All previously issued handles stay permanently unresolvable. An Agent without an active accepted runtime-key
        authorization uses bootstrap; an Agent holding an active authorized key (lifecycle active or paused) uses replacement
        while lifecycle intent, existing keys and grants stay untouched until one controller-signed authorization atomically
        supersedes the prior keys. Generic views expose the handle and active authorization set with independent readiness
        blockers and never expose runtime_state or backup readiness; that diagnostic is pairing-poll-local. Neither branch
        creates, revokes, or re-issues Realm grants. Pair commit does not depend on history-only backup availability; deactivated
        rejects.
