          type: string
          const: crosstab_cell
        row_key:
          type: string
          minLength: 1
        column_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionCrosstabPosition:
      type: object
      required:
      - model
      - row_key
      - column_key
      - sort_key
      properties:
        model:
          type: string
          const: crosstab_cell
        row_key:
          type: string
          minLength: 1
        column_key:
          type: string
          minLength: 1
        sort_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionFieldValueGroupSource:
      type: object
      required:
      - model
      - field
      - value
      properties:
        model:
          type: string
          const: field_value
        field:
          type: string
          pattern: ^[a-zA-Z0-9_]+(\.[a-zA-Z0-9_]+)*$
        value:
          oneOf:
          - type: string
          # lint-waiver(type:number): CollectionFieldValueGroupSource.value is a UI/query
          # filter parameter accepting whatever the projected field's runtime type is. It
          # does not enter canonical Event bytes. Runtime values remain JSON numbers on
          # this query-only surface; canonical decimal fields use their own typed schema.
          - type: number
          - type: boolean
      additionalProperties: false
    CollectionFieldValuePosition:
      type: object
      required:
      - model
      - container_id
      - rank
      properties:
        model:
          type: string
          const: field_value
        container_id:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: ^[0-9A-Za-z]{1,128}$
      additionalProperties: false
    CollectionGroupSource:
      oneOf:
      - $ref: '#/components/schemas/CollectionFieldValueGroupSource'
      - $ref: '#/components/schemas/CollectionRelationGroupSource'
      - $ref: '#/components/schemas/CollectionTimeBucketGroupSource'
      - $ref: '#/components/schemas/CollectionCrosstabGroupSource'
    CollectionProjectionGroup:
      type: object
      required:
      - key
      - title
      - source
      - items
      - limited
      properties:
        key:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: ^[0-9A-Za-z]{1,128}$
        source:
          $ref: '#/components/schemas/CollectionGroupSource'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionRow'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^ak:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        limited:
          type: boolean
        wip_state:
          type: string
          enum:
          - ok
          - over_limit
          - unknown
        total_estimate:
          type: integer
          minimum: 0
      allOf:
      - if:
          properties:
            source:
              properties:
                model:
                  const: field_value
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionRow'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionFieldValuePosition'
      - if:
          properties:
            source:
              properties:
                model:
                  const: relation_container
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionRow'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionRelationPosition'
      - if:
          properties:
            source:
              properties:
                model:
                  const: time_bucket
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionRow'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionTimeWindowPosition'
      - if:
          properties:
            source:
              properties:
                model:
                  const: crosstab_cell
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionRow'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionCrosstabPosition'
