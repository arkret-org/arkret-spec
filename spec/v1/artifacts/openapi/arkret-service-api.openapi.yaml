    post:
      operationId: ak.self.events.query.mls_governance_proof
      security:
      - bearerAuth: []
      summary: Materialize a verifiable full-profile MLS governance binding.
      description: |
        Returns one bounded chunk of a complete_control_state_v1 proof bundle
        for one caller-visible Realm/scope. The server derives the membership
        frontier and all roots from one accepted Seal view; the request cannot
        supply either. The request MUST name one locally trusted_anchor_seal_id
        and a chunk_index. Chunk 0 returns the committed manifest; later reads
        pin expected_bundle_digest. Each response is at most 4 MiB and the
        manifest commits at most 1024 chunks / 256 MiB of canonical item bytes.
        The response path starts from the exact caller anchor,
        proof_request_digest binds acquisition identity, and bundle_digest
        (not accepted_seal_id) addresses the complete logical bundle.
