        ak.agent.provision Event. Ordinary admission atomically projects provision/accountability/selector/realm-id-claim
        and returns awaiting_pcr_genesis. Separate PCR acceptance returns awaiting_did_binding; only the controller-signed
        continuous DID entry 1 carrying the exact create-locked binding exposes Agent/pairing/list/get and returns complete.
        requested_scope is an immutable ceiling, not a grant; the service creates no Agent DID/PCR/MLS private state.
      security:
      - sessionGrantAuth: []
        dpopProof: []
      responses:
        '200':
          description: Prepare returns awaiting_controller_event; commit returns awaiting_pcr_genesis; PCR acceptance returns
            awaiting_did_binding; accepting the exact controller-signed DID binding entry 1 makes replay return complete with
            pending PCR recovery and the runtime pairing handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProvisionOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProvisionRequestBody'
