  /_arkret/self/rtc/token:
    post:
      operationId: ak.self.call.media.exchange.issue_token
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.call.media.exchange.issue_token.v1
      security:
      - sessionGrantAuth: []
        dpopProof: []
      summary: Exchange Arkret capability proof for a backend media token.
      description: |
        Media service token exchange operation defined by
        zh/crypto-media/media-service-binding.md §3. Issues a short-lived
        (TTL ≤ 600s, SHOULD ≤ 300s) backend_token + participant_binding for
        joining a focus declared in `ak.realm.media_service.foci[]`.

        Same wire across all backend types (livekit / mediasoup / janus /
        arkret_native); only `backend_token` shape is type-specific and opaque
        to the protocol layer (parsed by backend SDK only).

        Token issuer MUST be one of the Realm-authorized media service DIDs;
        clients MUST reject otherwise (`token_issuer_unauthorised`). Issuer
        MUST validate: device proof, `ak.call.join` capability, focus_id
        membership in current `foci[]`, session_focus persistence, MLS
        MLS media security-frontier freshness, and `media_service_decrypts`
        pre-conditions (§10.5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/CallMediaTokenExchangeRequestBody
      responses:
        '200':
          description: Token exchange accepted; backend_token + participant_binding returned.
          content:
            application/json:
              schema:
                $ref: ../schemas/service-operation-dtos.schema.json#/$defs/CallMediaTokenExchangeOutcome
        '403':
          description: |
            `capability_denied` — actor lacks `ak.call.join` or
            requested `desired_media` exceeds granted sub-capabilities; or
            `token_issuer_unauthorised` when the issuing DID is not registered
            in `ak.realm.media_service.service_id`.
        '409':
          description: |
            `focus_mismatch` — requested `focus_id` differs from the
            already-committed `ak.call.state.session_focus`; clients MUST
            re-target the established focus rather than retrying; or
            `mls_governance_binding_stale` — current MLS epoch policy_root
            does not cover the `ak.realm.media_service` cell; or
            `media_plaintext_service_not_authorised` for SFUs negotiating
            decryption role without `plaintext_visible_services` entry.
        '422':
          description: |
            `unknown_focus_type` — `focus_id` resolves to a `foci[]` entry
            whose `type` is unsupported by this token issuer; or
            `media_service_foci_required` when `ak.realm.media_service` does
            not declare explicit media foci.
  /_arkret/self/account/viewer:
    get:
      operationId: ak.self.account.read.viewer
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.account.read.viewer.v1
      security:
      - sessionGrantAuth: []
        dpopProof: []
      summary: Holder-bound one-shot read of the current account projection.
      description: |
        Returns the authenticated principal's account projection: principal_id,
        lifecycle state, device summaries, optional ActorProfile, and signed
        handle-claim evidence or refs. This endpoint is distinct from
        ak.self.account.read.describe.v1, which describes service capabilities.

        The authenticated session selects one exact (principal_id, station_id)
        account authority pair. profile, when present, is the current accepted Actor
        Profile from that pair's single lifetime-local PCR lineage; the service MUST
        NOT merge or select state from another Station carrying the same core DID.

        The response MUST NOT use an unsigned bare handle as authoritative
        identity. When present, primary_handle_claim is a complete
        ak.schema.handle_claim.v1 object; otherwise clients use
        primary_handle_claim_ref and handle_claim_digests to refresh their
        local claim cache.
      responses:
        '200':
          description: Current account viewer projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
  /_arkret/self/account/subscribe:
    get:
      operationId: ak.self.account.stream.subscribe
      security:
      - sessionGrantAuth: []
        dpopProof: []
      summary: Streaming push of account-aggregate deltas (NDJSON frames).
      description: |
        Long-lived streaming subscription that pushes cross-Realm
        account-aggregate deltas (cross-Realm frontier, to_device queue,
        account_data, device_lists, unread / notification counts)
        as new data becomes available. Response is `application/x-ndjson`;
        each line is a self-contained frame object — see
        AccountSubscribeFrame for frame kinds (`delta`, `frontier`,
        `heartbeat`, `catchup_complete`, `dropped`, `resync_required`,
        `unauthorized`).

        Symmetric with ak.self.events.stream.subscribe.v1 (per-Realm event log streaming);
        both share resume semantics (`after=<cursor>` exclusive start).
        `dropped` requires account-aggregate catch-up by reconnecting with
        `after=<cursor>&catchup=true`; `resync_required` requires local
        rebuild / initial account sync. `dropped` / `resync_required` may
        carry `reconnect_after_ms`, a minimum server-directed delay before
        opening another subscription for the same principal/device/filter
        scope. Signal envelopes use the Signal Extension live rail, not
        this account-aggregate subscription.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.account.stream.subscribe.v1
      - in: header
        name: X-Arkret-Wait-For
        required: false
        description: Barrier cursor (purpose=barrier) returned from a prior write. Server holds the first delta frame until the local frontier covers target.event_id, or emits an error frame (timeout / frontier_stale / temporarily_unavailable).
        schema:
          type: string
          pattern: ^ak:cursor:[A-Za-z0-9_-]+$
      - name: after
        in: query
        description: |
          Subscription start cursor (exclusive). Frames are pushed after this
          cursor position. Omit when there is no usable account cursor; with
          `catchup=true` this starts initial account sync and the
          server first emits a baseline delta.
        schema:
          type: string
          pattern: ^ak:cursor:[A-Za-z0-9_-]+$
      - name: catchup
        in: query
        description: |
          When true and `after` is present, server first replays the bounded
          account-aggregate catch-up range after the `after=` cursor, emits
          `catchup_complete`, then transitions to real-time push. When true
          and `after` is omitted, this is initial account sync: server first
          emits a current baseline delta, then `catchup_complete`, then
          real-time push. This parameter never means "return all history";
          complete event history is retrieved via `QUERY /_arkret/self/events`.
        schema:
          type: boolean
          default: false
      - name: filter
        in: query
        description: Optional structured filter object (Realm subset, kinds, event-fields). See zh/sync/client-sync.md §2.
        schema:
          type: object
        style: deepObject
        explode: true
      responses:
        '200':
          description: |
            Streaming NDJSON frame channel. Each newline-delimited JSON object
            conforms to AccountSubscribeFrame. Frames continue until the client
            disconnects, the server emits `dropped` / `resync_required`, or the
            connection is closed for transport reasons.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AccountSubscribeFrame'
  /_arkret/self/account/profile:
    post:
      operationId: ak.self.account.command.update_profile
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.account.command.update_profile.v1
      security:
      - sessionGrantAuth: []
        dpopProof: []
      summary: Update the authenticated principal's Actor Profile projection.
      description: |
        Carries exactly one holder-signed profile_event EventInitialSubmission.
        event.realm_id is the account-local PCR Realm selector, and
        accepted-profile presence is evaluated only in that PCR lineage. With no
        accepted Actor Profile there the Event is ak.profile.create and its
        materialized actor_profile ID is derived from the Event ID; payload.object
        omits id. With an accepted Profile there the Event is ak.profile.update,
        payload.target_ref equals that create-derived ID, and patch paths are limited
        to display_name, avatar_blob_ref, and profile_fields.<key>.

        Both branches use the authenticated session's account authority pair and local
        PCR as event.realm_id and realm scope, bind event.actor_id to the session
        principal, and use direct holder proof. On create payload.object.principal_id
        equals that principal; on update the accepted target Profile's materialized
        principal_id equals it. Event preconditions are empty; update concurrency
        uses only optional signed payload.expected_state_digest. The service submits the exact Event
        through ordinary admission without authoring, rebuilding, co-signing, choosing
        an ID, or adding a concurrency guard. Until accepted Seal coverage is available
        it returns frontier_unavailable; exact retry then returns the stored outcome
        without a second account-aggregate delta. No Directory or account-data Event is
        synthesized.
      responses:
        '200':
          description: Profile update accepted and projected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateProfileOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateProfileRequestBody'
  /_arkret/self/account/cursor/revoke:
    post:
      operationId: ak.self.account.command.revoke_cursor
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.account.command.revoke_cursor.v1
      security:
      - sessionGrantAuth: []
        dpopProof: []
      summary: Revoke a previously issued cursor authority.
      description: |
        High-assurance optional endpoint. The issuing service records the cursor
        digest or stateful handle in a revocation set until the cursor's maximum
        TTL would have expired. A revoked cursor returns `cursor_revoked` and
        MUST NOT advance account subscribe position, wait-for barrier state,
        or dropped recovery state. To-device queue deletion is decoupled from
        cursors entirely and happens only via ak.self.device_messages.command.ack.v1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/AccountCursorRevokeRequestBody
      responses:
        '200':
          description: Cursor revocation accepted.
          content:
            application/json:
              schema:
                $ref: ../schemas/service-operation-dtos.schema.json#/$defs/AccountCursorRevokeOutcome
  /_arkret/self/contacts/request:
