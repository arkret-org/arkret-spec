  /_arkret/peer/device-revocations/check:
    post:
      operationId: ak.peer.device_revocations.command.check
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Derive the current device binding and linearize an exact immutable device-bound action intent against origin revocation state.
      description: The authenticated Account Authority supplies only selectors it can verify itself. The origin Principal Server derives the current authorization Event and PCR-local integer generation from its own durable device projection under the same serializable fence used for revoke acceptance, compares them with any expected binding in the request, and persists an exact-intent signed decision receipt. A validated request always returns HTTP 200 with a closed allow, revocation_pending, revoked, authority_mismatch or generation_mismatch receipt; 409 device_revocation_pending/device_revoked belongs only to the protected business operation. Only allow carries the derived binding, which is the sole source for the issued grant device_binding. An allow receipt is valid for at most 30 seconds and only for the exact issue/refresh intent bytes; introspection carries no receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRevocationGateCheckRequestBody'
      responses:
        '200':
          description: Signed durable allow, revocation_pending, revoked, authority_mismatch or generation_mismatch decision receipt. A validated request always uses this typed 200 outcome; 409 gate errors belong to the blocked business operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRevocationGateCheckOutcome'
  /_arkret/peer/events/describe:
    query:
      operationId: ak.peer.events.read.describe
      security: []
