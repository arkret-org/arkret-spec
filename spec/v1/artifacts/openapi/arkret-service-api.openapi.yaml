    ServiceDescribe:
      type: object
      description: |
        Service capability descriptor returned by `ak.server.read.describe` and the
        per-surface `ak.*.describe` operations. Required fields are normatively
        listed in `zh/sync/service-surface.md` §3.0 and §17. Implementations MUST
        emit `plaintext_visibility` so callers can honor the plaintext-boundary
        rule from `zh/overview/architecture.md` §2.3.
      required:
      - protocol_version
      - service_kind
      - service_id
      - service_resolution
      - trust_domain
      - supported_profiles
      - supported_operations
      - supported_bindings
      - supported_features
      - auth_metadata
      - limits
      - plaintext_visibility
      - implemented_features
      - claimed_profiles
      - verified_profiles
      - experimental_features
      - compat_surfaces
      - development_mode
      anyOf:
      - required:
        - rate_limit_policy
      - required:
        - rate_limit_policy_id
      properties:
        protocol_version:
          type: string
        service_kind:
          type: string
          enum:
          - agent_runtime
          - applet_service
          - archive_node
          - auth_server
          - authz_service
          - blob_node
          - device_key_service
          - directory_service
          - identity_registry
          - key_recovery_service
          - media_service
          - moderation_service
          - notary
          - policy_server
          - principal_server
          - push_gateway
          - recovery_service
          - search_service
          - sfu_service
          - turn_service
        service_id:
          type: string
          pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
          description: Stable service did_core_id. It is not itself a routable URL.
        service_resolution:
          $ref: ../schemas/identity-resolution.schema.json#/$defs/resolution_commitment
          description: >-
            Current owner-published full_id projection. Because the caller already
            needed a verified first-hop route to reach describe, this field only
            confirms the ServiceResolutionRecord used for that hop.
        trust_domain:
          type: string
          pattern: ^ak:trust_domain:[a-z0-9][a-z0-9._\-:]{0,127}$
          description: Deployment trust-domain boundary used for cross-deployment replay protection.
        supported_profiles:
          type: array
          items:
            type: string
        profile_bindings:
          type: object
          description: Profile-specific carrier declarations keyed by profile id.
          additionalProperties:
            type: object
            required:
            - carrier
            additionalProperties: false
            properties:
              carrier:
                type: string
        supported_operations:
          type: array
          items:
            type: string
        supported_bindings:
          type: array
          description: |
            Closed transport binding declarations for this service. Unknown or
            incomplete binding kinds are not Arkret v1 bindings and clients
            ignore them fail-closed. See `zh/sync/transport-bindings.md`.
          items:
            $ref: ../schemas/transport-binding.schema.json
        supported_features:
          type: array
          description: |
            Optional feature identifiers (`ak.feature.*`) this service supports.
            Mirrors the `supported_features[]` declaration in
            `zh/sync/service-surface.md` §3.0. Distinct from `supported_profiles`:
            features are finer-grained capability tokens that may be required
            via `Event.requirements.features[]`.
          items:
            type: string
        plaintext_visibility:
          type: object
          description: |
            Declaration of which closed data classes, event kinds, payload paths,
            blob purposes, or projection outputs the service consumes in
            plaintext (vs encrypted envelope). Privacy-boundary fields per
            `zh/overview/architecture.md` §2.3 and `zh/sync/service-surface.md`
            §17. Omission is NOT equivalent to "no plaintext access" — callers
            MUST treat a missing declaration as untrusted and refuse to register
            this service as a `plaintext_visible_services` member.
          additionalProperties: true
          properties:
            data_classes:
              type: array
              items:
                type: string
                enum:
                  - message_content
                  - strand_content
                  - attachment_plaintext
                  - attachment_preview
                  - thumbnail
                  - full_text_index
                  - search_snippet
                  - embedding
                  - notification_summary
                  - inbox_preview
                  - media_plaintext
                  - derived_plaintext
                  - account_private_state
                  - profile_private_field
            max_visibility:
              type: string
              enum:
                - none
                - derived_plaintext
                - private_plaintext
            event_kinds:
              type: array
              items:
                type: string
            payload_paths:
              type: array
              items:
                type: string
            blob_purposes:
              type: array
              items:
                type: string
            projection_outputs:
              type: array
              items:
                type: string
            notes:
              type: string
        auth_metadata:
          type: object
          description: |
            Authentication and account-session discovery metadata. Principal
            Server describe responses MUST include account_authority and
            methods[]. Methods describe standard authentication providers and
            proof kinds only; all Arkret /_arkret/gate/account/* routing is
            derived from account_authority.gate_account_base.
          additionalProperties: true
          properties:
            account_authority:
              type: object
              required:
              - origin
              - gate_account_base
              additionalProperties: false
              properties:
                origin:
                  type: string
                  format: uri
                gate_account_base:
                  type: string
                  format: uri
                  pattern: /_arkret/gate/account/?$
            methods:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: object
                required:
                - method
                - grant_exchange
                additionalProperties: true
                properties:
                  method:
                    type: string
                    enum:
                    - oidc
                    - passkey
                    - device_pairing
                    - recovery_challenge
                    - gnap
                  issuer:
                    type: string
                    format: uri
                  provider:
                    type: string
                    format: uri
                  openid_configuration:
                    type: string
                    format: uri
                  client_id:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                  grant_exchange:
                    type: object
                    required:
                    - proof_kind
                    additionalProperties: false
                    properties:
                      proof_kind:
                        type: string
                        enum:
                        - did_bound_signature
                        - paired_device_proof
                        - passkey_assertion
                        - oidc_code_exchange
                        - agent_key_proof
            did_binding_methods:
              type: array
              items:
                type: string
        supported_reducer_profiles:
          type: array
          description: Registered Realm reducer profiles this service can execute. This is a runtime capability set, not a conformance claim and not a selected Realm profile.
          items:
            type: string
            pattern: ^ak\.reducer(?:\.[a-z0-9][a-z0-9_.-]*)?\.v[0-9]+$
          uniqueItems: true
        supported_schema_profiles:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        rate_limit_policy_id:
          type: string
        rate_limit_policy:
          type: object
          additionalProperties: true
        egress_network_policy:
          type: object
          description: |
            Coarse outbound-network policy for SSRF protection. Public describe
            MAY omit sensitive allowlist entries; authenticated operator
            describe MAY return the complete policy. Normative semantics are
            defined in `zh/sync/api-conventions.md` §11.2.
          required:
          - version
          - private_network_default
          - protected_purposes
          - dns_rebind_protection
          - redirect_recheck
          properties:
            version:
              type: integer
              minimum: 1
            private_network_default:
              type: string
              enum:
              - deny
              - deny_unless_explicit_exception
            protected_purposes:
              type: array
              items:
                type: string
                enum:
                - did_resolution
                - federation
                - media_fetch
                - policy_server
                - snapshot_fetch
                - webhook
                - applet
                - agent
                - directory
                - push
            denied_cidrs:
              type: array
              items:
                type: string
            allowed_cidrs:
              type: array
              items:
                type: string
            allowed_private_exceptions:
              type: array
              items:
                type: object
            dns_rebind_protection:
              type: boolean
            redirect_recheck:
              type: boolean
        resource_kinds:
          type: array
          description: |
            Directory-service resource classes indexed by
            `ak.find.directory.read.describe`. Required when
            `service_kind=directory_service`.
          items:
            type: string
            enum:
            - realm
            - organization
            - actor
            - applet
            - handle
        discovery_profiles:
          type: array
          description: |
            Directory discovery profiles and extension profile ids advertised by
            `ak.find.directory.read.describe`. Required when
            `service_kind=directory_service`.
          items:
            type: string
        private_contact_discovery:
          $ref: ../schemas/service-describe.schema.json#/properties/private_contact_discovery
        restricted_query_proof:
          type: boolean
          description: Whether restricted or privacy-sensitive queries require holder-approved proof.
        ingest_modes:
          type: array
          description: Directory ingest modes supported by this instance.
          items:
            type: string
            enum:
            - push
            - pull
        accept_policy_kind:
          type: string
          description: Directory resource acceptance policy.
          enum:
          - open
          - allowlist
          - trust_root_signed
          - operator_review
        accept_policy_ref:
          type: object
          description: Optional human-readable or governance reference for obtaining directory acceptance.
          additionalProperties: true
        default_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
        max_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
        revalidation_grace_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
        accepted_resource_kinds:
          type: array
          description: Subset of resource kinds accepted by this directory instance.
          items:
            type: string
            enum:
            - realm
            - organization
            - actor
            - applet
            - handle
        accepted_did_methods:
          type: array
          description: Principal/governance DID methods accepted by this directory instance.
          items:
            type: string
            pattern: ^did:[a-z0-9]+$
        takedown_contact:
          type: string
          description: Operator takedown notification or appeal contact, expressed as a DID or URL.
        rate_limits:
          type: object
          description: Readable per-DID, per-organization or per-IP directory quota limits.
          additionalProperties: true
        implemented_features:
          type: array
          description: |
            Feature ids the service has implementation code for but does NOT
            necessarily claim conformance for. Tooling that builds a
            conformance matrix MUST treat this strictly weaker than
            `claimed_profiles`. See `zh/sync/service-surface.md` §3.0 and
            `ak.schema.service_describe.v1`.
          items:
            type: string
        claimed_profiles:
          type: array
          description: |
            Profiles the service self-claims membership in. `claim_kind` MUST
            be `self_claimed`; conformance-verified entries MUST appear in
            `verified_profiles` instead. See §3.0.
          items:
            type: object
            required:
            - profile_id
            - claim_kind
            properties:
              profile_id:
                type: string
              claim_kind:
                type: string
                enum:
                - self_claimed
        verified_profiles:
          type: array
          description: |
            Profiles for which a Conformance Verifier run has produced a
            passing verification artifact (see
            `zh/conformance/conformance-suite.md` §6.2). Each entry MUST carry
            `verification_run_id`, `artifact_digest`, `artifact_ref`,
            `verifier_service_id`, `signature` and `timestamp`.
            When `development_mode=true` this array MUST be
            empty (see `zh/sync/service-surface.md` §3.0 and
            `ak.schema.service_describe.v1`).
          items:
            type: object
            required:
            - profile_id
            - claim_kind
            - verification_run_id
            - artifact_digest
            - artifact_ref
            - verifier_service_id
            - signature
            - timestamp
            properties:
              profile_id:
                type: string
              claim_kind:
                type: string
                enum:
                - conformance_verified
              verification_run_id:
                type: string
              artifact_digest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              artifact_ref:
                type: string
                minLength: 1
                description: URI or transparency-log reference from which the verification artifact can be fetched.
              verifier_service_id:
                type: string
                pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
                maxLength: 512
                description: Stable did_core_id of the Conformance Verifier that signed the artifact statement. Its full DID URL signing key is verified separately and MUST project through the registered adapter to this value.
              signature:
                type: string
                minLength: 1
                description: Signature over profile_id, verification_run_id, artifact_digest, artifact_ref, verifier and timestamp.
              timestamp:
                $ref: ../schemas/time.schema.json#/$defs/timestamp
              expires_at:
                $ref: ../schemas/time.schema.json#/$defs/timestamp
        experimental_features:
          type: array
          description: |
            Feature ids that the service exposes but does NOT promise stable
            interop for. Clients MUST NOT treat these as load-bearing for
            protocol-level decisions.
          items:
            type: string
        compat_surfaces:
          type: array
          description: |
            Surfaces this service exposes outside its claimed Arkret v1
            conformance: bridged third-party protocols and delegated
            resolver postures.
            `kind` is one of `matrix_passthrough`, `mimi_passthrough`,
            `delegated_resolver`, `external_interop`.
            A service MUST NOT declare its own product-private route root
            here; the item object is closed so such a declaration cannot be
            smuggled in through extension keys.
          items:
            type: object
            required:
            - name
            - kind
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
              kind:
                type: string
                enum:
                - matrix_passthrough
                - mimi_passthrough
                - delegated_resolver
                - external_interop
              since:
                type: string
              notes:
                type: string
        development_mode:
          type: boolean
          description: |
            Mirror of the service's development_mode flag. When true,
            `verified_profiles` MUST be empty.
    ServiceRegistrationEnsureRequestBody:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/ServiceRegistrationEnsureRequestBody
    ServiceRegistrationOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/ServiceRegistrationOutcome
    ServiceResolutionPublishAck:
      $ref: ../schemas/identity-resolution.schema.json#/$defs/service_resolution_publish_ack
    ServiceResolutionPublishOutcome:
      $ref: ../schemas/identity-resolution.schema.json#/$defs/service_resolution_publish_outcome
    ServiceResolutionPublishRequestBody:
      $ref: ../schemas/identity-resolution.schema.json#/$defs/service_resolution_publish_request
    ServiceResolutionResolveOutcome:
      $ref: ../schemas/identity-resolution.schema.json#/$defs/service_resolution_resolve_outcome
    ServiceResolutionResolveRequestBody:
      $ref: ../schemas/identity-resolution.schema.json#/$defs/service_resolution_resolve_request
    ServiceRouteHandoverNotice:
      $ref: ../schemas/identity-resolution.schema.json#/$defs/service_route_handover_notice
    SessionGrantIntrospectOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantIntrospectOutcome
    SessionGrantIntrospectRequestBody:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantIntrospectRequestBody
    SessionGrantOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantOutcome
    SessionGrantRefreshOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantRefreshOutcome
    SessionGrantRefreshRequestBody:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantRefreshRequestBody
    SessionGrantReplayExpiredProblem:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantReplayExpiredProblem
    SessionGrantReplayProblem:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantReplayProblem
    SessionGrantReplayTerminalProblem:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantReplayTerminalProblem
    SessionGrantRequestBody:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantRequestBody
    SessionRevokeOutcome:
      $ref: ../schemas/account-operations.schema.json#/$defs/session_revoke_outcome
    SessionRevokeRequestBody:
      $ref: ../schemas/account-operations.schema.json#/$defs/session_revoke_request_body
    SignalSubmitOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SignalSubmitOutcome
    SnapshotBootstrap:
      type: object
      description: Optional ak.peer.events.read.scan acceleration hint for federation pull / backfill. snapshot_ref is an external pointer and MUST equal the Snapshot manifest id. Verifier MUST validate signature, state_digest, snapshot_frontier, chunk digests, created_by, created_at, and authority_binding before use (manifest fields are bound by the manifest signature transcript — see schemas/snapshot.schema.json).
      required:
      - snapshot_ref
      - state_digest
      - snapshot_frontier
      - created_by
      - created_at
      - authority_binding
      - signature
      properties:
        snapshot_ref:
          type: string
          description: External pointer to the Snapshot manifest; MUST equal schemas/snapshot.schema.json#/properties/id.
        state_digest:
          type: string
        snapshot_frontier:
          type: array
          items:
            type: string
        created_by:
          type: string
          description: DID of the snapshot issuer; bound by the manifest signature transcript.
        created_at:
          $ref: ../schemas/time.schema.json#/$defs/timestamp
          description: RFC 3339 UTC timestamp ending in 'Z' when the manifest was sealed; bound by the manifest signature transcript.
        authority_binding:
          type: object
          additionalProperties: true
          description: Snapshot issuer authority evidence bound by the manifest signature transcript; mirrors schemas/snapshot.schema.json#/properties/authority_binding.
        signature:
          type: object
        verification_hints:
          type: object
    SortSpec:
      $ref: ../schemas/query.schema.json#/$defs/sort_spec
    SpaceHierarchyChild:
      type: object
      required:
      - realm_id
      - edge_status
      properties:
        realm_id:
          type: string
          pattern: ^ak:realm:[A-Za-z0-9_-]{44}$
        edge_status:
          $ref: '#/components/schemas/SpaceHierarchyEdgeState'
        accessible:
          type: boolean
        lazy_link:
          type: boolean
        reference_projection_status:
          $ref: '#/components/schemas/ReferenceProjectionState'
        summary:
          type: object
      additionalProperties: false
    SpaceHierarchyEdge:
      type: object
      required:
      - parent_space_id
      - child_space_id
      - edge_status
      properties:
        parent_space_id:
          type: string
          pattern: ^ak:space:[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        child_space_id:
          type: string
          pattern: ^ak:space:[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        edge_status:
          $ref: '#/components/schemas/SpaceHierarchyEdgeState'
        relation_kind:
          type: string
      additionalProperties: false
    SpaceHierarchyEdgeState:
      type: string
      description: Derived status of a parent-child hierarchy edge.
      enum:
      - confirmed
      - unconfirmed_link
      - rejected
      - tombstoned
    SpaceHierarchyView:
      type: object
      required:
      - root_space_id
      - children
      properties:
        root_space_id:
          type: string
          pattern: ^ak:space:[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        root:
          $ref: '#/components/schemas/ProjectionObject'
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpaceHierarchyChild'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SpaceHierarchyEdge'
        next_cursor:
          type: string
        cycle_detected:
          type: boolean
      additionalProperties: false
    StateFrontier:
      type: object
      required:
      - state_digest
      properties:
        state_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        event_ids:
          type: array
          items:
            type: string
            pattern: ^ak:event:[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        actor_frontiers:
          type: array
          items:
            type: object
            required:
            - actor_id
            - actor_seq
            - event_id
            properties:
              actor_id:
                type: string
                pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
                maxLength: 512
              actor_seq:
                type: integer
                minimum: 0
              event_id:
                type: string
                pattern: ^ak:event:[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              hlc:
                type: string
                pattern: ^[0-9a-f]{12}-[0-9a-f]{4}-[0-9a-f]{8}$
            additionalProperties: false
      additionalProperties: false
    StrandDiscussionList:
      type: object
      required:
      - strands
      properties:
        strands:
          type: array
          items:
            $ref: '#/components/schemas/StrandDiscussionSummary'
        summaries:
          type: object
        next_cursor:
          type: string
        state_after:
          $ref: '#/components/schemas/StateFrontier'
      additionalProperties: false
    StrandDiscussionSummary:
      type: object
      required:
      - strand
      properties:
        strand:
          $ref: '#/components/schemas/ProjectionObject'
        relation:
          type: object
        summary:
          type: object
        unread:
          type: integer
          minimum: 0
      additionalProperties: false
    StrandDiscussionTimelineView:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineProjectionRow'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionObject'
        next_cursor:
          type: string
        state_after:
          $ref: '#/components/schemas/StateFrontier'
      additionalProperties: false
    StrandId:
      type: string
      pattern: ^ak:strand:[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    TimelineProjectionRow:
      type: object
      required:
      - id
      - entry_type
      - sort_key
      properties:
        id:
          type: string
          minLength: 1
        entry_type:
          type: string
          enum:
          - event
          - message
          - activity
          - system
          - tombstone
        event_id:
          type: string
          pattern: ^(?:ak:(event):[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|ak:(evt):[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$
        object:
          $ref: '#/components/schemas/ProjectionObject'
        actor_id:
          type: string
        created_at:
          $ref: ../schemas/time.schema.json#/$defs/timestamp
        sort_key:
          type: string
          minLength: 1
        thread_id:
          type: string
          pattern: ^ak:(strand|message):[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        body:
          type: object
        redacted:
          type: boolean
      additionalProperties: false
    TimelineProjectionView:
      type: object
      required:
      - projection
      - view_id
      - entries
      - frontier
      properties:
        projection:
          type: string
          const: timeline
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        view_id:
          type: string
          pattern: ^ak:view:[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        realm_id:
          type: string
          pattern: ^ak:realm:[A-Za-z0-9_-]{44}$
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineProjectionRow'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^ak:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        limited:
          type: boolean
        stale:
          type: boolean
      additionalProperties: false
    ViewProjectionRequestBody:
      $ref: ../schemas/view.schema.json#/$defs/view_projection_request_body
    ViewRenderer:
      type: string
      enum:
      - board
      - list
      - table
      - calendar
      - gantt
      - timeline
      - thread
      - chat
      - forum
      - graph
      - tree
      - document
      - dashboard
      - custom
  responses:
    NotFound:
      description: Not found or not visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PsiQuotaExhausted:
      description: >-
        PSI window quota exhausted (error code psi_quota_exhausted), returned
        only at first blind admission. The body has the exact blind-phase
        Content-Length bucket and advertised delay distribution. Retry-After is
        decimal seconds until quota-window roll, rounded up to a 300-second
        multiple with minimum 300. See discovery-directory.md §6.4.
      headers:
        Retry-After:
          description: Decimal seconds, a positive multiple of 300.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
        Cache-Control:
          schema:
            type: string
            const: no-store, no-transform
        Content-Length:
          schema:
            type: integer
            enum: [4096, 16384, 65536, 262144]
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedErrorEnvelope'
            - properties:
                error:
                  properties:
                    code: {const: psi_quota_exhausted}
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'urn:arkret:error:psi_quota_exhausted'}
                status: {const: 429}
    PsiPolicyDenied:
      description: >-
        Requester/batch-level policy denial (error code policy_denied). This is
        a PSI Class B failure and uses the request phase's exact body bucket and
        advertised delay distribution; it contains no per-target information.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, no-transform'}
        Content-Length:
          schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedErrorEnvelope'
            - properties:
                error:
                  properties:
                    code: {const: policy_denied}
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'urn:arkret:error:policy_denied'}
                status: {const: 403}
    PsiDuplicateConflict:
      description: >-
        The device-scoped batch_id was reused with different canonical blind or
        match bytes (error code duplicate_conflict). No evaluation is performed.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, no-transform'}
        Content-Length:
          schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedErrorEnvelope'
            - properties:
                error:
                  properties:
                    code: {const: duplicate_conflict}
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'urn:arkret:error:duplicate_conflict'}
                status: {const: 409}
    PsiBatchUnavailable:
      description: >-
        The match batch is unknown, belongs to another device, or expired
        (error code psi_batch_unavailable). Causes are intentionally merged and
        use the match-phase Class B shape. The pinned epoch is retained for the
        full advertised completion TTL.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, no-transform'}
        Content-Length:
          schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedErrorEnvelope'
            - properties:
                error:
                  properties:
                    code: {const: psi_batch_unavailable}
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'urn:arkret:error:psi_batch_unavailable'}
                status: {const: 410}
    TemporarilyUnavailable:
      description: Temporarily unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
paths:
  /_arkret/describe:
    get:
      operationId: ak.server.read.describe
      security: []
      parameters:
      - name: service_kind
        in: query
        required: false
        description: >-
          Registered service_describe role to select. Required when one public
          binding exposes multiple co-located roles; the response describes
          exactly the selected role. Omission on a multi-role binding returns
          param_missing; an illegal or unavailable role returns param_invalid.
        schema:
          $ref: '#/components/schemas/ServiceDescribe/properties/service_kind'
      responses:
        '200':
          description: Service description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescribe'
        '400':
          description: >-
            param_missing when a shared multi-role binding requires
            service_kind; param_invalid for an illegal or unavailable role.
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /_arkret/root/identity/resolve:
    post:
      operationId: ak.root.identity.read.resolve
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/IdentityResolveRequestBody
      responses:
        '200':
          description: DID resolution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolveOutcome'
        '404':
          $ref: '#/components/responses/NotFound'
  /_arkret/root/identity/document:
    get:
      operationId: ak.root.identity.document.resource.get
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      parameters:
      - name: did
        in: query
        required: true
        schema:
          type: string
          pattern: ^did:[a-z0-9]+:[^\s#?]+$
      responses:
        '200':
          description: DID Document plus normalized view and method evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityDocumentView'
  /_arkret/root/identity/log:
    get:
      operationId: ak.root.identity.log.read.list
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      responses:
        '200':
          description: DID key log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityLogListOutcome'
  /_arkret/root/identity/submit-did-operation:
    post:
      operationId: ak.root.identity.command.submit_did_operation
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        contentDigest: []
      responses:
        '200':
          description: DID operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DidOperationSubmitOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DidOperationSubmitRequestBody'
  /_arkret/root/identity/service-registrations:ensure:
    post:
      operationId: ak.root.identity.service_registration.command.ensure
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        contentDigest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRegistrationEnsureRequestBody'
      responses:
        '200':
          description: Existing or newly created stable service registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRegistrationOutcome'
        '400':
          description: Signed inception or registration-key binding rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Registration key or hosted document conflicts with another service identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /_arkret/root/identity/service-registrations:
    get:
      operationId: ak.root.identity.service_registration.resource.get
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      parameters:
