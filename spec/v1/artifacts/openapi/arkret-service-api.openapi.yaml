      responses:
        '200':
          description: Device pairing accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDevicePairOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDevicePairRequestBody'
  /_arkret/gate/account/device-enroll:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.enroll_device
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Service-attested device enrollment minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeviceEnrollOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeviceEnrollRequestBody'
  /_arkret/gate/account/agent-key-pair:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.pair_agent_key
      description: Native personal agent runtime key pairing. Requires a ready controller-owned managed-PCR recovery backup covering the pre-commit Agent PCR frontier and a controller-signed, verifier/audience/challenge-bound private requested_scope disclosure whose digest matches the accepted-at public DID commitment. The disclosure is transaction evidence and is never copied into the authorization Event or public history. The operation validates verification_method ↔ agent_id consistency and writes ak.agent.key.authorize on approval. The accepted authorization advances the frontier and makes recovery stale until a post-commit backup tail is accepted; that transition does not roll back this successful pairing but blocks the next pairing commit. Agent runtime private keys are locally generated and never uploaded or restored.
      security:
      - bearerAuth: []
      - httpMessageSignature: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: MUST equal authorize_event.event_id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._~:-]+$'
      responses:
        '200':
          description: Agent key pairing accepted; ak.agent.key.authorize event written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentKeyPairOutcome'
        '412':
          description: Pairing failed (verification_method_principal_mismatch, pairing_request_expired, agent_pcr_recovery_not_ready, proof_invalid, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentKeyPairRequestBody'
  /_arkret/self/agents:
    get:
      operationId: ak.self.agent.query.list
      description: List native personal agents visible to the authenticated controller.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
    post:
      operationId: ak.self.agent.command.provision
      description: Two-phase native personal Agent provisioning. phase=prepare validates prerequisites and returns an Agent DID/PCR allocation, controller PCR, delegation ref, and requested_scope_digest without publishing durable Agent state. The controller verifies the digest and uses the Arkret SDK canonical authoring API to create exactly one controller-signed ak.identity.accountability_grant Event and one controller-signed ak.agent.selector_claim Event. phase=commit carries the same allocation, private requested_scope, and closed Event pair; the service admits both through the ordinary Event pipeline before publishing the Agent DID binding and pairing handle. requested_scope is the immutable global Agent ceiling, not a grant. Provisioning creates no Agent profile, key authorization, Realm capability grant, or Agent PCR MLS private state; after status=complete, the controller E2EE client locally bootstraps and backs up the Agent PCR before pairing can commit.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Prepare returns status=awaiting_controller_events and an allocation; commit returns status=complete with pending PCR recovery and the runtime pairing handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProvisionOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProvisionRequestBody'
  /_arkret/self/agents/{agent_id}:
    get:
      operationId: ak.self.agent.resource.get
      description: Read one native personal agent projection.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentView'
  /_arkret/self/agents/{agent_id}/renew-pairing:
    post:
      operationId: ak.self.agent.command.renew_pairing
      description: Re-open pairing on any non-terminal agent with a fresh single-use pairing handle, the unchanged requested_scope_digest DID commitment, and the current managed-PCR recovery projection. All previously issued handles stay permanently unresolvable. pending_runtime_key/pairing_expired re-open bootstrap pairing; active/paused perform runtime replacement re-pairing while status, existing keys and grants stay untouched until the controller-signed authorization with an exact supersedes set is accepted atomically. Neither branch creates, revokes, or re-issues Realm grants. Pair commit requires pcr_recovery.status=ready; deactivated rejects.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pairing renewed; fresh pending runtime key pairing returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRenewPairingOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRenewPairingRequestBody'
  /_arkret/self/agents/{agent_id}/pause:
    post:
      operationId: ak.self.agent.command.pause
      description: Pause a native personal agent and reject new agent sessions.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLifecycleState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPauseRequestBody'
  /_arkret/self/agents/{agent_id}/resume:
    post:
      operationId: ak.self.agent.command.resume
      description: Resume a paused native personal agent after freshness and sidecar disclosure checks.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLifecycleState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentResumeRequestBody'
  /_arkret/self/agents/{agent_id}/deactivate:
    post:
      operationId: ak.self.agent.command.deactivate
      description: Terminally deactivate a native personal agent. fan-out ak.agent.key.revoke / ak.capability.revoke / runtime endpoint revocation.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLifecycleState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDeactivateRequestBody'
  /_arkret/self/agents/{agent_id}/grants:
    post:
      operationId: ak.self.agent.grant.command.attach
      description: Attach a complete signed Realm-scoped capability grant to a native personal agent together with a controller-signed, verifier-bound private requested_scope disclosure. The verifier recomputes the accepted-at public DID commitment; grant actions and resources must be covered by the disclosed immutable ceiling, all provision constraints remain mandatory, no defaults are added, and the disclosure is never copied into Realm history.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Grant attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGrantAttachOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentGrantAttachRequestBody'
  /_arkret/self/agents/{agent_id}/grants/{grant_id}:
    delete:
      operationId: ak.self.agent.grant.resource.delete
      description: Detach or revoke a capability grant from a native personal agent.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          type: string
      - in: path
        name: grant_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Grant detached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGrantDetachOutcome'
  /_arkret/self/agent-sidecars:ensure:
    post:
      operationId: ak.self.agent.sidecar.command.ensure
      description: |
        Idempotently ensure the controller-owned Agent Sidecar object, one context-private Strand, and its private relation.
        The wire-level idempotency keys are server-derived: Sidecar identity is keyed by
        `(realm_id, controller_id)` and private Strand reuse by `(sidecar_id, normalized_context_ref)`.
        `agent_id` is not part of either key; addressed_agent_ids affects only the current exchange.
        The reducer atomically creates and binds the system-managed backing Circle/MLS scope, which is not returned
        as a normal Circle resource. Clients MUST NOT supply Circle metadata, membership, IDs, or an Idempotency-Key
        to force a second object. Existence-privacy failures use the generic `sidecar_create_denied` precondition.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Agent Sidecar and context Strand ensured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSidecarEnsureOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSidecarEnsureRequestBody'
  /_arkret/self/agent-sidecars/{sidecar_id}:
    get:
      operationId: ak.self.agent.sidecar.resource.get
      description: Return one Agent Sidecar owned by the authenticated controller, including desired/effective Agent access and readiness. Foreign, unauthorized, and nonexistent IDs are indistinguishable.
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: sidecar_id
        required: true
        schema:
          type: string
          pattern: '^ak:sidecar:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '200':
          description: Agent Sidecar view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSidecarView'
  /_arkret/self/agent-sidecars:
    get:
      operationId: ak.self.agent.sidecar.query.list
      description: List Agent Sidecars owned by the authenticated controller. An optional realm_id filter narrows the result without exposing other controllers' objects.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: realm_id
        required: false
        schema:
          type: string
          pattern: '^ak:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Agent Sidecar list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSidecarList'
  /_arkret/self/agents/{agent_id}/participation:
    put:
      operationId: ak.self.agent.participation.resource.replace
      description: Set an agent's participation selection for a scope (controller-self only). The selection is bounded by both the immutable provision-derived ceiling and the deployment/Realm/Circle/Strand governance ceiling; policy cannot restore a bit omitted at provision time.
      security:
