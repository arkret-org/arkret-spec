            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: The complete response exceeds the caller or protocol byte bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /_arkret/peer/erasure-receipts:
