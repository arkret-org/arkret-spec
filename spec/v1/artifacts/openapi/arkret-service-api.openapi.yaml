      summary: Provision an Applet-managed Ghost Actor for one external user.
      description: |
        Called by an installed bridge Applet (authenticating as its service DID)
        to provision, or idempotently re-validate, an Applet-managed Ghost Actor
        profile plus accountability grant for one external user. The server MUST
        verify the active registration for `applet_id` covers the caller's
        service DID and that `ghost_actor_id` falls inside the registration's
        actor namespace before minting `ak.profile.create` /
        `ak.identity.accountability_grant`. Re-provisioning the same
        `(applet_id, protocol, tenant, external_user_id)` MUST return the
        existing refs instead of minting duplicates.
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        contentDigest: []
      parameters:
      - in: path
        name: applet_id
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Ghost Actor provisioned (or existing refs re-confirmed)
