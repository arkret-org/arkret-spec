  /_arkret/self/account/subscribe:
    get:
      operationId: ak.self.account.stream.subscribe
      security:
      - sessionGrantAuth: []
        dpopProof: []
      summary: Streaming push of account-aggregate deltas (NDJSON frames).
      description: Bounded account long polling. Initial sync returns the first Realm summary page and segmented account baseline.
        Realm details require an explicit bounded filter. The notifications channel carries one closed union - Agent runtime
        approval rows and ordinary source-Event current rows - on a single position, baseline channel and budget; there is
        no separate notification list operation. See client-sync sections 2.3, 3.1 and 13.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.account.stream.subscribe.v1
      - in: header
        name: X-Arkret-Wait-For
        required: false
        description: Barrier cursor (purpose=barrier) returned from a prior write. Server holds the first delta frame until
          the local checkpoint covers target.event_id, or emits an error frame (timeout / revision_stale / temporarily_unavailable).
        schema:
          type: string
          pattern: ^ak:cursor:[A-Za-z0-9_-]+$
      - name: after
        in: query
        description: 'Subscription start cursor (exclusive). Frames are pushed after this

          cursor position. Omit when there is no usable account cursor; with

          `catchup=true` this starts initial account sync and the

          server first emits a baseline delta.

          '
        schema:
          type: string
          pattern: ^ak:cursor:[A-Za-z0-9_-]+$
      - name: catchup
        in: query
        description: End this bounded catchup round with catchup_complete. Baselines may continue across rounds and have separate
          completion markers.
        schema:
          type: boolean
          default: false
      - name: filter
        in: query
        description: Bounded Realm/Strand detail interest. Omission or empty realms means global channels only. One percent-encoded
          RFC 8785 JSON query value. Empty objects and arrays are preserved. Repeated parameters, dotted keys and non-canonical
          JSON are rejected.
        content:
          application/json:
            schema:
              $ref: ../schemas/account-subscribe-frame.schema.json#/$defs/account_filter
      - name: realm_list
        in: query
        description: First summary page or continuation of a frozen summary snapshot. Omit on incremental calls to request
          no additional list page. One percent-encoded RFC 8785 JSON query value. Empty objects and arrays are preserved.
          Repeated parameters, dotted keys and non-canonical JSON are rejected.
        content:
          application/json:
            schema:
              $ref: ../schemas/account-subscribe-frame.schema.json#/$defs/realm_list_request
      - name: replace_filter
        in: query
        schema:
          type: boolean
          default: false
        description: Explicitly replace detail interest while preserving authenticated global stream positions; requires after
          and filter.
      responses:
        '200':
          description: One bounded NDJSON round, at most 16 frames and 16 MiB; each canonical frame is at most 8 MiB. Resume
            from the last durably installed cursor. catchup_complete ends this round, not every baseline.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AccountSubscribeFrame'
  /_arkret/self/account/profile:
    post:
      operationId: ak.self.account.command.update_profile
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.account.command.update_profile.v1
      security:
      - sessionGrantAuth: []
        dpopProof: []
      summary: Update the authenticated principal's Actor Profile projection.
      description: 'Carries exactly one holder-signed profile_event EventAdmissionSubmission.

        event.realm_id is the account-local PCR Realm selector, and

        accepted-profile presence is evaluated only in that PCR lineage. With no

        accepted Actor Profile there the Event is ak.profile.create and its

        materialized actor_profile ID is derived from the Event ID; payload.object

        omits id. With an accepted Profile there the Event is ak.profile.update,

        payload.target_ref equals that create-derived ID, and patch paths are limited

        to display_name, avatar_blob_ref, and profile_fields.<key>.


        Both branches use the authenticated session''s account authority pair and local

        PCR as event.realm_id and realm scope, bind event.actor_id to the session

        principal, and use direct holder proof. On create payload.object.principal_id

        equals that principal; on update the accepted target Profile''s materialized

        principal_id equals it. Event preconditions are empty; update concurrency

        uses only optional signed payload.expected_state_digest. The service submits the exact Event

        through ordinary admission without authoring, rebuilding, co-signing, choosing

        an ID, or adding a concurrency guard. Until accepted RealmCommit coverage is available

        it returns revision_unavailable; exact retry then returns the stored outcome

        without a second account-aggregate delta. No Directory or account-data Event is

        synthesized.

        '
      responses:
        '200':
          description: Profile update accepted and projected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateProfileOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateProfileRequestBody'
  /_arkret/self/account/cursor/revoke:
