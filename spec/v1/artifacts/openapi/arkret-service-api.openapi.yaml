  /_arkret/self/contacts:
    get:
      operationId: ak.self.contact.read.list
      security:
      - sessionGrantAuth: []
        dpopProof: []
      summary: List the holder's contact projection.
      description: |
        An accepted row also carries the closed next_prepare_input cursor. Its
        contact_round_id, version and predecessor_event_ref are copied verbatim into the
        prepare phase of /_arkret/self/contacts/scope-update or
        /_arkret/self/contacts/tombstone; version is the version the next Event
        carries and predecessor_event_ref is the current lineage head. Every
        other contact_state omits the cursor, and the projected request,
        response and tombstone event refs are never authoritative lineage heads.
        A pending_incoming row likewise carries request_receipt, the complete
        signed request_acceptance_receipt copied verbatim into the prepare phase
        of /_arkret/self/contacts/respond or /_arkret/self/contacts/reject. That
        receipt is signed by the peer's source service rather than by this
        server, so the client verifies it itself instead of trusting this
        server's retelling. Every other contact_state omits it: pending_outgoing
        has no incoming request to answer, and accepted, rejected, expired and
        tombstoned have a consumed slot or a terminal round. A glare pair is
        never pending_incoming, which is why the glare ban on respond and reject
        needs no extra error code.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.contact.read.list.v1
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending_outgoing
          - pending_incoming
          - accepted
          - rejected
          - tombstoned
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          pattern: ^ak:cursor:[A-Za-z0-9_-]+$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Contact projection rows visible to the holder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
