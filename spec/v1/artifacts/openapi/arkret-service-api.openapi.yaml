  /_arkret/self/direct-conversations/resolve:
    post:
      operationId: ak.self.direct_conversation.read.resolve
      security:
      - bearerAuth: []
        dpopProof: []
      summary: Resolve the pair's single stable 1:1 DM coordinates.
      description: |
        Query-only. This endpoint never creates: a Direct Conversation Realm is
        created solely by the founder derived from the pair's root Contact round
        (normal branch takes the responder, glare branch takes the requests[0]
        issuer) through the direct_conversation_genesis admission variant of
        ak.realm.create. Outcomes are evaluated in a fixed order and expose
        creation_required, creation_blocked, awaiting_founder, provisional,
        found, suspended or temporarily_unavailable. Waiting never grants create
        authority to the non-founder; there is no timeout fallback or takeover.
        Existing coordinates are never hidden by presence, session, KeyPackage
        inventory or MLS reconcile state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectConversationResolveRequestBody'
      responses:
        '200':
          description: Direct conversation resolver result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConversationResolveOutcome'
  /_arkret/self/direct-conversations/repair-dispatch:
    post:
      operationId: ak.self.direct_conversation.command.repair_dispatch
      security:
      - bearerAuth: []
        dpopProof: []
      summary: Persist and deliver one exact Direct Conversation replacement-repair trigger.
      description: |
        The authenticated requester supplies no recipient target. The source
        service validates the current participant/rejoin/contact/generation
        gates, freezes the exact peer-relay body and current destination binding
        in a durable outbox, and retries byte-identically until the destination
        confirms its atomic closed-target enqueue. A different body under the
        same requester/request_id conflicts. Success is not a repair ack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectConversationRepairDispatchRequestBody'
      responses:
        '200':
          description: Byte-identical destination durable-enqueue outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConversationRepairEnqueueOutcome'
