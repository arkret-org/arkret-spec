    EventStateView:
      type: object
      description: Per-event protocol-state field surfaced on /account/subscribe and /events
        responses (zh/sync/service-surface.md §5.3, zh/authz/event-auth-state-resolution.md
        §13). Implementations MUST attach this on every reducer-input Event
        included in a timeline/state response so clients can render fail-closed
        UI without recomputing the join.
      required:
      - event_id
      - event_digest
      - event_state
      properties:
        event_id:
          type: string
          pattern: ^ak:event:[A-Za-z0-9_-]{44}$
        event_digest:
          type: string
          description: Canonical hash of the event's canonical bytes (excluding
            proofs and unsigned); equals proof.event_digest. Used as the Seal
            frontier item for this event. Algorithm family aligned with
            schemas/seal.schema.json#/$defs/event_digest — active digest
            suites per registry/digest-suite-registry.json (v1 sha256 / blake3,
            64 hex).
          pattern: ^(?:sha256|blake3):[0-9a-f]{64}$
        event_state:
          type: string
          enum:
          - data_local
          - data_observed
          - control_pending
          - control_sealed
          - failed_precondition
          - failed_plane
          - failed_bottom
          - rejected_seal
          - fork_quarantine
          - seal_ref_stale
        bottom:
          $ref: '#/components/schemas/BottomDiagnostic'
      additionalProperties: false
    EventSubmitEnvelope:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventSubmitEnvelope
    EventView:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventView
