  /_arkret/self/device_messages/ack:
    post:
      operationId: ak.self.device_messages.command.ack
      security:
      - bearerAuth: []
      summary: Explicit to-device delivery acknowledgement.
      description: |
        Cumulative, monotonic, naturally idempotent acknowledgement bound to the
        authenticated (principal, device). Prunes delivered messages up to and
        including the token's queue position. Stream cursor advancement never
        deletes queued messages (client-sync.md §10.1). Unknown / expired /
        cross-bound tokens return `param_invalid` (reason `invalid_ack_token`)
        without deleting anything.
