  /_arkret/edge/applet/transactions:
    post:
      operationId: ak.edge.applet.command.transaction
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        contentDigest: []
      x-arkret-auth:
        service_signature:
          signature_standard: RFC 9421
          per_delivery: true
          bearer_only_allowed: false
          source_signature_anchor:
            audit_field: source_signature_anchor
            request_body_field: false
            directions:
              node_to_applet: Source-Service-ID current service DID verification method; Destination-Service-ID MUST equal the Applet registration service_id.
              applet_to_arkret_inbound: Applet registration webhook_auth.key_ref; DID part MUST equal Source-Service-ID and the active effective install service_id.
          covered_components:
          - '@method'
          - '@target-uri'
          - '@authority'
          - content-digest
          - source-service-id
          - destination-service-id
          - idempotency-key
          freshness:
            created_skew_seconds: 30
            max_signature_lifetime_seconds: 300
          replay_binding:
            idempotency_identity:
            - operation_id
            - direction
            - Source-Service-ID
            - Destination-Service-ID
            - Idempotency-Key
            cached_fields:
            - Content-Digest
            - canonical_body_digest
            - source_signature_anchor
            - accepted_outcome
          fail_closed_reasons:
          - http_signature_required
          - http_signature_invalid
          - signature_window_invalid
          - duplicate_conflict
          - applet_registration_unauthorized
          - applet_namespace_mismatch
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        description: Per-delivery transaction idempotency / nonce key. It MUST be covered by Signature-Input and is scoped by operation_id, direction, Source-Service-ID and Destination-Service-ID; the cached record also binds Content-Digest and source_signature_anchor.
        schema:
          type: string
      responses:
        '200':
          description: Applet transaction accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppletTransactionOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppletTransactionRequestBody'
