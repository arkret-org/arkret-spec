      summary: Read a filtered Event range with cursor pagination.
      description: |
        Canonical RFC 10008 QUERY binding for `ak.self.events.read.scan.v1`.
        The JSON content carries the selector, cursor, ordering, filter, and
        completeness inputs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsQueryPostRequestBody
      responses:
        '200':
          description: Event read page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsQueryOutcome'
        '400':
          description: '`param_invalid` — unrecognized `order` value, malformed cursor, or invalid selector.'
    post:
      operationId: ak.self.events.command.submit
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.events.command.submit.v1
      security:
      - sessionGrantAuth: []
        dpopProof: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsSubmitRequestBody
      description: |
        Ordinary Event publication plus the discriminated
        `direct_conversation_founding` branch, which is the only carrier for a
        Direct Conversation founding unit (zh/identity/contact-and-direct-conversation.md
        §5.5). That branch carries exactly four founder-authored Events in fixed
        wire order, closed XOR founding authority evidence and an `idempotency_key`,
        and returns `DirectConversationFoundingAcceptanceOutcome` with the
        source-signed receipt. The service allocates no identifier: `realm_id`
        and `main_strand_id` are retyped from the first and third Event IDs.
        Local Realm acceptance atomically freezes the complete distinct remote
        target set and outbox intents. A missing verified route creates durable
        `pending_route`; it does not reject the Event. The response exposes only
        `pending_delivery_count`; clients derive aggregate state as pending iff
        the count is non-zero.
      responses:
        '200':
          description: Event accepted (or duplicate / partial; see status field)
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            X-Arkret-Request-Id:
              $ref: '#/components/headers/XArkretRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfEventsSubmitOutcome'
        '409':
          description: |
            `duplicate_conflict` — the same `idempotency_key` was reused with a
            different founding unit; or `conflict` with reason_code
            `direct_conversation_slot_already_committed` — the pair's founding
            slot was already closed by a different unit. Both write zero Events.
  /_arkret/self/events/subscribe:
    get:
      operationId: ak.self.events.stream.subscribe
      x-arkret-required-any-of:
      - - realm_ids
      - - actor_ids
      security:
      - sessionGrantAuth: []
        dpopProof: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
      summary: Streaming event subscription with optional catch-up replay.
      description: |
        Opens a streaming subscription scoped by `realms[]` / `actors[]`. Returns
        events from `after=<cursor>` (exclusive) forward. Subscribe naturally
        moves only toward newer events; there is no `before` / `order`
        parameter.

        With `catchup=true` and `after=<cursor>` the server first replays
        the bounded catch-up range from that cursor up to the current frontier,
        then emits `catchup_complete` per Realm and continues with live frames.
        This is not a request for all historical events; full history is read
        through `QUERY /_arkret/self/events` pagination / range queries.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.events.stream.subscribe.v1
      - name: realm_ids
        in: query
        description: Filter by Realm IDs. UNION within, intersection with `actor_ids[]`.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RealmId'
          minItems: 1
        style: form
        explode: true
      - name: actor_ids
        in: query
        description: Filter by Actor DIDs. UNION within, intersection with `realm_ids[]`.
        schema:
          type: array
          items:
            $ref: '../schemas/common-ids.schema.json#/$defs/did_core_id'
          minItems: 1
        style: form
        explode: true
      - name: after
        in: query
        description: Subscription start cursor (exclusive). Same semantics as ak.self.events.read.scan.v1's `after=` parameter.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: catchup
        in: query
        description: When true and `after` is present, the server first replays the bounded catch-up range from `after=` to the current frontier, then transitions to live. This is not full-history retrieval.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Streaming event subscription with optional catch-up replay
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/EventsSubscribeFrame'
