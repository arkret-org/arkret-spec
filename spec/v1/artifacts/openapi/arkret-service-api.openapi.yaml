      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.pair_agent_key
      description: Native personal agent runtime key pairing. Admission validates current controller/Agent authority, the fresh pairing handle, the verifier/audience/challenge-bound private requested_scope disclosure, proof-of-possession and the accepted control frontier. Backup availability and history-only MLS material are neither inputs nor readiness gates. The operation validates verification_method ↔ agent_id consistency and writes one ak.agent.key.authorize on approval. Agent runtime private keys are locally generated and never uploaded or restored.
      security:
      - bearerAuth: []
      - httpMessageSignature: []
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.pair_agent_key.v1
      - name: Idempotency-Key
        in: header
        required: true
        description: MUST equal authorize_event.event.event_id.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._~:-]+$'
      responses:
        '200':
          description: Agent key pairing accepted; ak.agent.key.authorize event written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentKeyPairOutcome'
        '409':
          description: Pairing failed (verification_method_principal_mismatch, pairing_request_expired, proof_invalid, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentKeyPairRequestBody'
