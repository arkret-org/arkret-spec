    post:
      operationId: ak.self.identity.read.resolution_audit
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.identity.read.resolution_audit.v1
      security:
      - sessionGrantAuth: []
        dpopProof: []
      summary: Read authorized account-internal resolution audit evidence.
      description: 'Returns the account''s Principal Control Realm id, genesis Event and

        receipt, current and bounded predecessor resolution Events, and the accepted

        RealmCommit covering the current Event. Authorization is the current holder session

        bound to the exact account_id. Recovery actors first complete the

        existing recovery transaction and become the current holder; v1 has no second

        audit authorization path. A caller-declared intent is never authorization.

        Unknown account, wrong authority pair, unauthorized caller and unknown

        history cursor share one anti-enumeration outcome and are externally

        indistinguishable. history_depth is the closed range 0..256 with default 0

        and MUST NOT be silently capped; after_resolution_event_ref stops the

        disclosed segment exclusively at a known ancestor of this account''s lineage

        and requires history_depth of at least 1. A truncated segment sets

        history_complete false and returns next_audit_cursor.

        '
      responses:
        '200':
          description: Authorized principal resolution audit evidence.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store, no-transform
          content:
            application/json:
              schema:
                $ref: ../schemas/identity-resolution.schema.json#/$defs/principal_resolution_audit_evidence
        '400':
          description: param_invalid when history_depth is outside 0..256, when after_resolution_event_ref accompanies history_depth
            0, or with reason resolution_history_ancestor_unknown when the supplied ancestor is not in this account's current
            resolution lineage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/identity-resolution.schema.json#/$defs/principal_resolution_audit_request
