        parent_space_id:
          type: string
          pattern: ^ak:space:[A-Za-z0-9_-]{44}$
        child_space_id:
          type: string
          pattern: ^ak:space:[A-Za-z0-9_-]{44}$
        edge_status:
          $ref: '#/components/schemas/SpaceHierarchyEdgeState'
        relation_kind:
          type: string
      additionalProperties: false
    SpaceHierarchyEdgeState:
      type: string
      description: Derived status of a parent-child hierarchy edge.
      enum:
      - confirmed
      - unconfirmed_link
      - rejected
      - tombstoned
    SpaceHierarchyView:
      type: object
      required:
      - root_space_id
      - children
      properties:
        root_space_id:
          type: string
          pattern: ^ak:space:[A-Za-z0-9_-]{44}$
        root:
          $ref: '#/components/schemas/ProjectionObject'
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpaceHierarchyChild'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SpaceHierarchyEdge'
        next_cursor:
          type: string
        cycle_detected:
          type: boolean
      additionalProperties: false
    StateFrontier:
      type: object
      required:
      - state_digest
      properties:
        state_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        event_ids:
          type: array
          items:
            type: string
            pattern: ^ak:event:[A-Za-z0-9_-]{44}$
        actor_frontiers:
          type: array
          items:
            type: object
            required:
            - actor_id
            - actor_seq
            - event_id
            properties:
              actor_id:
                type: string
                pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
                maxLength: 512
              actor_seq:
                type: integer
                minimum: 0
              event_id:
                type: string
                pattern: ^ak:event:[A-Za-z0-9_-]{44}$
              hlc:
                type: string
                pattern: ^[0-9a-f]{12}-[0-9a-f]{4}-[0-9a-f]{8}$
            additionalProperties: false
      additionalProperties: false
    StrandDiscussionList:
      type: object
      required:
      - strands
      properties:
        strands:
          type: array
          items:
            $ref: '#/components/schemas/StrandDiscussionSummary'
        summaries:
          type: object
        next_cursor:
          type: string
        state_after:
          $ref: '#/components/schemas/StateFrontier'
      additionalProperties: false
    StrandDiscussionSummary:
      type: object
      required:
      - strand
      properties:
        strand:
          $ref: '#/components/schemas/ProjectionObject'
        relation:
          type: object
        summary:
          type: object
        unread:
          type: integer
          minimum: 0
      additionalProperties: false
    StrandDiscussionTimelineView:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineProjectionRow'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionObject'
        next_cursor:
          type: string
        state_after:
          $ref: '#/components/schemas/StateFrontier'
      additionalProperties: false
    StrandId:
      type: string
      pattern: ^ak:strand:[A-Za-z0-9_-]{44}$
    TimelineProjectionRow:
      type: object
      required:
      - id
      - entry_type
      - sort_key
      properties:
        id:
          type: string
          minLength: 1
        entry_type:
          type: string
          enum:
          - event
          - message
          - activity
          - system
          - tombstone
        event_id:
          type: string
          pattern: ^ak:event:[A-Za-z0-9_-]{44}$
        object:
          $ref: '#/components/schemas/ProjectionObject'
        actor_id:
          type: string
        created_at:
          $ref: ../schemas/time.schema.json#/$defs/timestamp
        sort_key:
          type: string
          minLength: 1
        thread_id:
          type: string
          pattern: ^ak:(strand|message):[A-Za-z0-9_-]{44}$
        body:
          type: object
        redacted:
          type: boolean
      additionalProperties: false
    TimelineProjectionView:
      type: object
      required:
      - projection
      - view_id
      - entries
      - frontier
      properties:
        projection:
          type: string
          const: timeline
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        view_id:
          type: string
          pattern: ^ak:view:[A-Za-z0-9_-]{44}$
        realm_id:
          type: string
          pattern: ^ak:realm:[A-Za-z0-9_-]{44}$
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineProjectionRow'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^ak:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        limited:
          type: boolean
        stale:
          type: boolean
      additionalProperties: false
    ViewRenderer:
      type: string
      enum:
      - board
      - list
      - table
      - calendar
      - gantt
      - timeline
      - thread
      - chat
      - forum
      - graph
      - tree
      - document
      - dashboard
      - custom
  responses:
    NotFound:
      description: Not found or not visible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PsiQuotaExhausted:
      description: >-
        PSI window quota exhausted (error code psi_quota_exhausted), returned
        only at first blind admission. The body has the exact blind-phase
        Content-Length bucket and advertised delay distribution. Retry-After is
        decimal seconds until quota-window roll, rounded up to a 300-second
        multiple with minimum 300. See discovery-directory.md §6.4.
      headers:
        Retry-After:
          description: Decimal seconds, a positive multiple of 300.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
        Cache-Control:
          schema:
            type: string
            const: no-store, no-transform
        Content-Length:
          schema:
            type: integer
            enum: [4096, 16384, 65536, 262144]
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'https://arkret.org/problems/psi_quota_exhausted'}
                status: {const: 429}
    PsiPolicyDenied:
      description: >-
        Requester/batch-level policy denial (error code policy_denied). This is
        a PSI Class B failure and uses the request phase's exact body bucket and
        advertised delay distribution; it contains no per-target information.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, no-transform'}
        Content-Length:
          schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'https://arkret.org/problems/policy_denied'}
                status: {const: 403}
    PsiDuplicateConflict:
      description: >-
        The device-scoped batch_id was reused with different canonical blind or
        match bytes (error code duplicate_conflict). No evaluation is performed.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, no-transform'}
        Content-Length:
          schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'https://arkret.org/problems/duplicate_conflict'}
                status: {const: 409}
    PsiBatchUnavailable:
      description: >-
        The match batch is unknown, belongs to another device, or expired
        (error code psi_batch_unavailable). Causes are intentionally merged and
        use the match-phase Class B shape. The pinned epoch is retained for the
        full advertised completion TTL.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, no-transform'}
        Content-Length:
          schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'https://arkret.org/problems/psi_batch_unavailable'}
                status: {const: 410}
    TemporarilyUnavailable:
      description: Temporarily unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
