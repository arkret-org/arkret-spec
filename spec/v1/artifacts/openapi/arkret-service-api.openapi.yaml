  /_arkret/self/committed-events/subscribe:
    get:
      operationId: ak.self.committed_event.stream.subscribe
      x-arkret-required-any-of:
      - - realm_ids
      - - actor_ids
      security:
      - sessionGrantAuth: []
        dpopProof: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
      summary: Streaming event subscription with optional catch-up replay.
      description: 'Opens a streaming subscription scoped by `realms[]` / `actors[]`. Returns

        events from `after=<cursor>` (exclusive) forward. Subscribe naturally

        moves only toward newer events; there is no `before` / `order`

        parameter.


        With `catchup=true` and `after=<cursor>` the server first replays

        the bounded catch-up range from that cursor up to the current checkpoint,

        then emits `catchup_complete` per Realm and continues with live frames.

        This is not a request for all historical events; full history is read

        through `QUERY /_arkret/self/events` pagination / range queries.

        '
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.self.committed_event.stream.subscribe.v1
      - name: realm_ids
        in: query
        description: Filter by Realm IDs. UNION within, intersection with `actor_ids[]`.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RealmId'
          minItems: 1
        style: form
        explode: true
      - name: actor_ids
        in: query
        description: Repeated actor_ids values, each the percent-encoded RFC 8785 JCS serialization of one closed ActorId.
          Decode and validate against common-ids actor_id before authorization; bare DID values are forbidden. UNION within,
          intersection with realm_ids. Exact identity includes Station; duplicate ActorIds are rejected.
        schema:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 256
          uniqueItems: true
        style: form
        explode: true
      - name: after
        in: query
        description: Subscription start cursor (exclusive). Same semantics as ak.self.committed_event.read.scan.v1's `after=` parameter.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: catchup
        in: query
        description: When true and `after` is present, the server first replays the bounded catch-up range from `after=` to
          the current checkpoint, then transitions to live. This is not full-history retrieval.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Streaming event subscription with optional catch-up replay
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/EventsSubscribeFrame'
