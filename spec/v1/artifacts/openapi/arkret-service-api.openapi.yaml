    SearchRequestBody:
      $ref: ../schemas/query.schema.json#/$defs/search_request_body
    ServiceDescribe:
      type: object
      description: |
        Service capability descriptor returned by `ak.server.query.describe` and the
        per-surface `ak.*.describe` operations. Required fields are normatively
        listed in `zh/sync/service-surface.md` §3.0 and §17. Implementations MUST
        emit `plaintext_visibility` so callers can honor the plaintext-boundary
        rule from `zh/overview/architecture.md` §2.3.
      required:
      - protocol_version
      - service_type
      - service_id
      - trust_domain
      - supported_profiles
      - supported_operations
      - supported_bindings
      - supported_features
      - auth_metadata
      - limits
      - plaintext_visibility
      - implemented_features
      - claimed_profiles
      - verified_profiles
      - experimental_features
      - compat_surfaces
      - development_mode
      anyOf:
      - required:
        - rate_limit_policy
      - required:
        - rate_limit_policy_id
      properties:
        protocol_version:
          type: string
        service_type:
          type: string
          enum:
          - agent_runtime
          - applet_service
          - archive_node
          - auth_server
          - authz_service
          - blob_node
          - device_key_service
          - directory_service
          - identity_registry
          - key_recovery_service
          - media_service
          - moderation_service
          - notary
          - policy_server
          - principal_server
          - push_gateway
          - recovery_service
          - search_service
          - sfu_service
          - sync_node
          - turn_service
        service_id:
          type: string
        trust_domain:
          type: string
          pattern: ^ak:trust_domain:[a-z0-9][a-z0-9._\-:]{0,127}$
          description: Deployment trust-domain boundary used for cross-deployment replay protection.
        supported_profiles:
          type: array
          items:
            type: string
        supported_operations:
          type: array
          items:
            type: string
        supported_bindings:
          type: array
          description: |
            HTTP / gRPC / WebSocket / MQ binding declarations for this service.
            Each entry SHOULD specify `kind`, optional `version`, and binding-
            specific endpoint details. See `zh/sync/transport-bindings.md`.
          items:
            type: object
        supported_features:
          type: array
          description: |
            Optional feature identifiers (`ak.feature.*`) this service supports.
            Mirrors the `supported_features[]` declaration in
            `zh/sync/service-surface.md` §3.0. Distinct from `supported_profiles`:
            features are finer-grained capability tokens that may be required
            via `Event.requirements.features[]`.
          items:
            type: string
        plaintext_visibility:
          type: object
          description: |
            Declaration of which closed data classes, event kinds, payload paths,
            blob purposes, or projection outputs the service consumes in
            plaintext (vs encrypted envelope). Privacy-boundary fields per
            `zh/overview/architecture.md` §2.3 and `zh/sync/service-surface.md`
            §17. Omission is NOT equivalent to "no plaintext access" — callers
            MUST treat a missing declaration as untrusted and refuse to register
            this service as a `plaintext_visible_services` member.
          additionalProperties: true
          properties:
            data_classes:
              type: array
              items:
                type: string
                enum:
                  - message_content
                  - strand_content
                  - attachment_plaintext
                  - attachment_preview
                  - thumbnail
                  - full_text_index
                  - search_snippet
                  - embedding
                  - notification_summary
                  - inbox_preview
                  - media_plaintext
                  - derived_plaintext
                  - account_private_state
                  - profile_private_field
            max_visibility:
              type: string
              enum:
                - none
                - derived_plaintext
                - private_plaintext
            event_kinds:
              type: array
              items:
                type: string
            payload_paths:
              type: array
              items:
                type: string
            blob_purposes:
              type: array
              items:
                type: string
            projection_outputs:
              type: array
              items:
                type: string
            notes:
              type: string
        auth_metadata:
          type: object
          description: |
            Authentication and account-session discovery metadata. Principal
            Server describe responses MUST include account_authority and
            methods[]. Methods describe standard authentication providers and
            proof kinds only; all Arkret /_arkret/gate/account/* routing is
            derived from account_authority.gate_account_base.
          additionalProperties: true
          properties:
            account_authority:
              type: object
              required:
              - origin
              - gate_account_base
              additionalProperties: false
              properties:
                origin:
                  type: string
                  format: uri
                gate_account_base:
                  type: string
                  format: uri
                  pattern: /_arkret/gate/account/?$
            methods:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: object
                required:
                - method
                - grant_exchange
                additionalProperties: true
                properties:
                  method:
                    type: string
                    enum:
                    - oidc
                    - passkey
                    - device_pairing
                    - recovery_challenge
                    - gnap
                  issuer:
                    type: string
                    format: uri
                  provider:
                    type: string
                    format: uri
                  openid_configuration:
                    type: string
                    format: uri
                  client_id:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                  grant_exchange:
                    type: object
                    required:
                    - proof_kind
                    additionalProperties: false
                    properties:
                      proof_kind:
                        type: string
                        enum:
                        - did_bound_signature
                        - paired_device_proof
                        - passkey_assertion
                        - oidc_code_exchange
                        - agent_key_proof
            did_binding_methods:
              type: array
              items:
                type: string
        supported_reducer_profiles:
          type: array
          description: Reducer profile ids whose digest_input rows are published in artifacts/registry/reducer-profile-registry.json.
          items:
            type: string
        supported_schema_profiles:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        rate_limit_policy_id:
          type: string
        rate_limit_policy:
          type: object
          additionalProperties: true
        egress_network_policy:
          type: object
          description: |
            Coarse outbound-network policy for SSRF protection. Public describe
            MAY omit sensitive allowlist entries; authenticated operator
            describe MAY return the complete policy. Normative semantics are
            defined in `zh/sync/api-conventions.md` §11.2.
          required:
          - version
          - private_network_default
          - protected_purposes
          - dns_rebind_protection
          - redirect_recheck
          properties:
            version:
              type: integer
              minimum: 1
            private_network_default:
              type: string
              enum:
              - deny
              - deny_unless_explicit_exception
            protected_purposes:
              type: array
              items:
                type: string
                enum:
                - did_resolution
                - federation
                - media_fetch
                - policy_server
                - snapshot_fetch
                - webhook
                - applet
                - agent
                - directory
                - push
            denied_cidrs:
              type: array
              items:
                type: string
            allowed_cidrs:
              type: array
              items:
                type: string
            allowed_private_exceptions:
              type: array
              items:
                type: object
            dns_rebind_protection:
              type: boolean
            redirect_recheck:
              type: boolean
        resource_types:
          type: array
          description: |
            Directory-service resource classes indexed by
            `ak.find.directory.query.describe`. Required when
            `service_type=directory_service`.
          items:
            type: string
            enum:
            - realm
            - organization
            - actor
            - applet
            - handle
        discovery_profiles:
          type: array
          description: |
            Directory discovery profiles and extension profile ids advertised by
            `ak.find.directory.query.describe`. Required when
            `service_type=directory_service`.
          items:
            type: string
        private_contact_discovery:
          $ref: ../schemas/service-describe.schema.json#/properties/private_contact_discovery
        restricted_query_proof:
          type: boolean
          description: Whether restricted or privacy-sensitive queries require holder-approved proof.
        ingest_modes:
          type: array
          description: Directory ingest modes supported by this instance.
          items:
            type: string
            enum:
            - push
            - pull
        accept_policy_kind:
          type: string
          description: Directory resource acceptance policy.
          enum:
          - open
          - allowlist
          - trust_root_signed
          - operator_review
        accept_policy_ref:
          type: object
          description: Optional human-readable or governance reference for obtaining directory acceptance.
          additionalProperties: true
        default_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
        max_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
        revalidation_grace_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
        accepted_resource_kinds:
          type: array
          description: Subset of resource kinds accepted by this directory instance.
          items:
            type: string
            enum:
            - realm
            - organization
            - actor
            - applet
            - handle
        accepted_did_methods:
          type: array
          description: Principal/governance DID methods accepted by this directory instance.
          items:
            type: string
            pattern: ^did:[a-z0-9]+$
        takedown_contact:
          type: string
          description: Operator takedown notification or appeal contact, expressed as a DID or URL.
        rate_limits:
          type: object
          description: Readable per-DID, per-organization or per-IP directory quota limits.
          additionalProperties: true
        implemented_features:
          type: array
          description: |
            Feature ids the service has implementation code for but does NOT
            necessarily claim conformance for. Tooling that builds a
            conformance matrix MUST treat this strictly weaker than
            `claimed_profiles`. See `zh/sync/service-surface.md` §3.0 and
            `ak.schema.service_describe.v1`.
          items:
            type: string
        claimed_profiles:
          type: array
          description: |
            Profiles the service self-claims membership in. `claim_kind` MUST
            be `self_claimed`; conformance-verified entries MUST appear in
            `verified_profiles` instead. See §3.0.
          items:
            type: object
            required:
            - profile_id
            - claim_kind
            properties:
              profile_id:
                type: string
              claim_kind:
                type: string
                enum:
                - self_claimed
        verified_profiles:
          type: array
          description: |
            Profiles for which a Conformance Verifier run has produced a
            passing verification artifact (see
            `zh/conformance/conformance-suite.md` §6.2). Each entry MUST carry
            `verification_run_id`, `artifact_digest`, `artifact_ref`,
            `verifier_did`, `signature` and `timestamp`.
            When `development_mode=true` this array MUST be
            empty (see `zh/sync/service-surface.md` §3.0 and
            `ak.schema.service_describe.v1`).
          items:
            type: object
            required:
            - profile_id
            - claim_kind
            - verification_run_id
            - artifact_digest
            - artifact_ref
            - verifier_did
            - signature
            - timestamp
            properties:
              profile_id:
                type: string
              claim_kind:
                type: string
                enum:
                - conformance_verified
              verification_run_id:
                type: string
              artifact_digest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              artifact_ref:
                type: string
                minLength: 1
                description: URI or transparency-log reference from which the verification artifact can be fetched.
              verifier_did:
                type: string
                pattern: ^did:[a-z0-9]+:[^\s#?]+$
                description: DID of the Conformance Verifier that signed the artifact statement.
              signature:
                type: string
                minLength: 1
                description: Signature over profile_id, verification_run_id, artifact_digest, artifact_ref, verifier and timestamp.
              timestamp:
                $ref: ../schemas/time.schema.json#/$defs/timestamp
              expires_at:
                $ref: ../schemas/time.schema.json#/$defs/timestamp
        experimental_features:
          type: array
          description: |
            Feature ids that the service exposes but does NOT promise stable
            interop for. Clients MUST NOT treat these as load-bearing for
            protocol-level decisions.
          items:
            type: string
        compat_surfaces:
          type: array
          description: |
            External-interop surfaces this service exposes outside its
            claimed Arkret v1 conformance.
            `kind` is one of `matrix_passthrough`, `mimi_passthrough`,
            `external_interop`.
          items:
            type: object
            required:
            - name
            - kind
            properties:
              name:
                type: string
              kind:
                type: string
                enum:
                - matrix_passthrough
                - mimi_passthrough
                - external_interop
        development_mode:
          type: boolean
          description: |
            Mirror of the service's development_mode flag. When true,
            `verified_profiles` MUST be empty.
    ServiceId:
      type: string
      pattern: ^did:[a-z0-9]+:[^\s#?]+$
      description: Bare DID identifying a service endpoint.
    ServiceRegistrationEnsureRequestBody:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/ServiceRegistrationEnsureRequestBody
    ServiceRegistrationOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/ServiceRegistrationOutcome
    SessionGrantIntrospectOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantIntrospectOutcome
    SessionGrantIntrospectRequestBody:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantIntrospectRequestBody
    SessionGrantOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantOutcome
    SessionGrantRefreshOutcome:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantRefreshOutcome
    SessionGrantRefreshRequestBody:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantRefreshRequestBody
    SessionGrantRequestBody:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/SessionGrantRequestBody
    SessionRevokeOutcome:
      $ref: ../schemas/account-operations.schema.json#/$defs/session_revoke_outcome
    SessionRevokeRequestBody:
      $ref: ../schemas/account-operations.schema.json#/$defs/session_revoke_request_body
    SnapshotBootstrap:
      type: object
      description: Optional ak.peer.events.query.scan acceleration hint for federation pull / backfill. snapshot_ref is an external pointer and MUST equal the Snapshot manifest id. Verifier MUST validate signature, state_digest, snapshot_frontier, chunk digests, created_by, created_at, and authority_binding before use (manifest fields are bound by the manifest signature transcript — see schemas/snapshot.schema.json).
      required:
      - snapshot_ref
      - state_digest
      - snapshot_frontier
      - created_by
      - created_at
      - authority_binding
      - signature
      properties:
        snapshot_ref:
          type: string
          description: External pointer to the Snapshot manifest; MUST equal schemas/snapshot.schema.json#/properties/id.
        state_digest:
          type: string
        snapshot_frontier:
          type: array
          items:
            type: string
        created_by:
          type: string
          description: DID of the snapshot issuer; bound by the manifest signature transcript.
        created_at:
          $ref: ../schemas/time.schema.json#/$defs/timestamp
          description: RFC 3339 UTC timestamp ending in 'Z' when the manifest was sealed; bound by the manifest signature transcript.
        authority_binding:
          type: object
          additionalProperties: true
          description: Snapshot issuer authority evidence bound by the manifest signature transcript; mirrors schemas/snapshot.schema.json#/properties/authority_binding.
        signature:
          type: object
        verification_hints:
          type: object
    SortSpec:
      $ref: ../schemas/query.schema.json#/$defs/sort_spec
    SpaceHierarchyChild:
      type: object
      required:
      - realm_id
      - edge_status
      properties:
        realm_id:
          type: string
          pattern: ^ak:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        edge_status:
          $ref: '#/components/schemas/SpaceHierarchyEdgeStatus'
        accessible:
          type: boolean
        lazy_link:
          type: boolean
        reference_projection_status:
          $ref: '#/components/schemas/ReferenceProjectionStatus'
        summary:
          type: object
      additionalProperties: false
    SpaceHierarchyEdge:
      type: object
      required:
      - parent_space_id
      - child_space_id
      - edge_status
      properties:
        parent_space_id:
          type: string
          pattern: ^ak:space:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        child_space_id:
          type: string
          pattern: ^ak:space:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        edge_status:
          $ref: '#/components/schemas/SpaceHierarchyEdgeStatus'
        relation_kind:
          type: string
      additionalProperties: false
    SpaceHierarchyEdgeStatus:
      type: string
      description: Derived status of a parent-child hierarchy edge.
      enum:
      - confirmed
      - unconfirmed_link
      - rejected
      - tombstoned
    SpaceHierarchyView:
      type: object
      required:
      - root_space_id
      - children
      properties:
        root_space_id:
          type: string
          pattern: ^ak:space:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        root:
          $ref: '#/components/schemas/ProjectionObject'
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpaceHierarchyChild'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SpaceHierarchyEdge'
        next_cursor:
          type: string
        cycle_detected:
          type: boolean
      additionalProperties: false
    StateFrontier:
      type: object
      required:
      - state_digest
      properties:
        state_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        event_ids:
          type: array
          items:
            type: string
            pattern: ^ak:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        actor_frontiers:
          type: array
          items:
            type: object
            required:
            - actor_id
            - actor_seq
            - event_id
            properties:
              actor_id:
                type: string
                pattern: ^did:[a-z0-9]+:[^\s#?]+$
              actor_seq:
                type: integer
                minimum: 0
              event_id:
                type: string
                pattern: ^ak:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
              hlc:
                type: string
                pattern: ^[0-9a-f]{12}-[0-9a-f]{4}-[0-9a-f]{8}$
            additionalProperties: false
      additionalProperties: false
    StrandDiscussionList:
      type: object
      required:
      - strands
      properties:
        strands:
          type: array
          items:
            $ref: '#/components/schemas/StrandDiscussionSummary'
        summaries:
          type: object
        next_cursor:
          type: string
        state_after:
          $ref: '#/components/schemas/StateFrontier'
      additionalProperties: false
    StrandDiscussionSummary:
      type: object
      required:
      - strand
      properties:
        strand:
          $ref: '#/components/schemas/ProjectionObject'
        relation:
          type: object
        summary:
          type: object
        unread:
          type: integer
          minimum: 0
      additionalProperties: false
    StrandDiscussionTimelineView:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineProjectionEntry'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionObject'
        next_cursor:
          type: string
        state_after:
          $ref: '#/components/schemas/StateFrontier'
      additionalProperties: false
    StrandId:
      type: string
      pattern: ^ak:strand:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    TimelineProjectionEntry:
      type: object
      required:
      - id
      - entry_type
      - sort_key
      properties:
        id:
          type: string
          minLength: 1
        entry_type:
          type: string
          enum:
          - event
          - message
          - activity
          - system
          - tombstone
        event_id:
          type: string
          pattern: ^ak:(evt|event):[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        object:
          $ref: '#/components/schemas/ProjectionObject'
        actor_id:
          type: string
        created_at:
          $ref: ../schemas/time.schema.json#/$defs/timestamp
        sort_key:
          type: string
          minLength: 1
        thread_id:
          type: string
          pattern: ^ak:(strand|message):[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        body:
          type: object
        redacted:
          type: boolean
      additionalProperties: false
    TimelineProjectionView:
      type: object
      required:
      - projection
      - view_id
      - entries
      - frontier
      properties:
        projection:
          type: string
          const: timeline
        renderer:
          $ref: '#/components/schemas/ViewRenderer'
        view_id:
          type: string
          pattern: ^ak:view:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        realm_id:
          type: string
          pattern: ^ak:realm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        frontier:
          $ref: '#/components/schemas/StateFrontier'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineProjectionEntry'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^ak:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        limited:
          type: boolean
        stale:
          type: boolean
      additionalProperties: false
    ViewProjectionRequestBody:
      $ref: ../schemas/view.schema.json#/$defs/view_projection_request_body
    ViewRenderer:
      type: string
      enum:
      - board
      - list
      - table
      - calendar
      - gantt
      - timeline
      - thread
      - chat
      - forum
      - graph
      - tree
      - document
      - dashboard
      - custom
  responses:
    NotFound:
      description: Not found or not visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PsiQuotaExhausted:
      description: >-
        PSI window quota exhausted (error code psi_quota_exhausted), returned
        only at first blind admission. The body has the exact blind-phase
        Content-Length bucket and advertised delay distribution. Retry-After is
        decimal seconds until quota-window roll, rounded up to a 300-second
        multiple with minimum 300. See discovery-directory.md §6.4.
      headers:
        Retry-After:
          description: Decimal seconds, a positive multiple of 300.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
        Cache-Control:
          schema:
            type: string
            const: no-store, no-transform
        Content-Length:
          schema:
            type: integer
            enum: [4096, 16384, 65536, 262144]
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedErrorEnvelope'
            - properties:
                error:
                  properties:
                    code: {const: psi_quota_exhausted}
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'urn:arkret:error:psi_quota_exhausted'}
                status: {const: 429}
    PsiPolicyDenied:
      description: >-
        Requester/batch-level policy denial (error code policy_denied). This is
        a PSI Class B failure and uses the request phase's exact body bucket and
        advertised delay distribution; it contains no per-target information.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, no-transform'}
        Content-Length:
          schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedErrorEnvelope'
            - properties:
                error:
                  properties:
                    code: {const: policy_denied}
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'urn:arkret:error:policy_denied'}
                status: {const: 403}
    PsiDuplicateConflict:
      description: >-
        The device-scoped batch_id was reused with different canonical blind or
        match bytes (error code duplicate_conflict). No evaluation is performed.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, no-transform'}
        Content-Length:
          schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedErrorEnvelope'
            - properties:
                error:
                  properties:
                    code: {const: duplicate_conflict}
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'urn:arkret:error:duplicate_conflict'}
                status: {const: 409}
    PsiBatchUnavailable:
      description: >-
        The match batch is unknown, belongs to another device, or expired
        (error code psi_batch_unavailable). Causes are intentionally merged and
        use the match-phase Class B shape. The pinned epoch is retained for the
        full advertised completion TTL.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, no-transform'}
        Content-Length:
          schema: {type: integer, enum: [4096, 16384, 65536, 262144]}
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedErrorEnvelope'
            - properties:
                error:
                  properties:
                    code: {const: psi_batch_unavailable}
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/PsiPaddedProblem'
            - properties:
                type: {const: 'urn:arkret:error:psi_batch_unavailable'}
                status: {const: 410}
    TemporarilyUnavailable:
      description: Temporarily unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
paths:
  /_arkret/describe:
    get:
      operationId: ak.server.query.describe
      security: []
      parameters:
      - name: service_type
        in: query
        required: false
        description: >-
          Registered service_describe role to select. Required when one public
          binding exposes multiple co-located roles; the response describes
          exactly the selected role. Omission on a multi-role binding returns
          missing_param; an illegal or unavailable role returns invalid_param.
        schema:
          $ref: '#/components/schemas/ServiceDescribe/properties/service_type'
      responses:
        '200':
          description: Service description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescribe'
        '400':
          description: >-
            missing_param when a shared multi-role binding requires
            service_type; invalid_param for an illegal or unavailable role.
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /_arkret/root/identity/resolve:
    post:
      operationId: ak.root.identity.query.resolve
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
        contentDigest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/IdentityResolveRequestBody
      responses:
        '200':
          description: DID resolution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolveOutcome'
        '404':
          $ref: '#/components/responses/NotFound'
  /_arkret/root/identity/document:
    get:
      operationId: ak.root.identity.document.resource.get
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      parameters:
      - name: did
        in: query
        required: true
        schema:
          type: string
          pattern: ^did:[a-z0-9]+:[^\s#?]+$
      responses:
        '200':
          description: DID Document plus normalized view and method evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityDocumentView'
  /_arkret/root/identity/log:
    get:
      operationId: ak.root.identity.log.query.list
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      responses:
        '200':
          description: DID key log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityLogListOutcome'
  /_arkret/root/identity/submit-did-operation:
    post:
      operationId: ak.root.identity.command.submit_did_operation
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        contentDigest: []
      responses:
        '200':
          description: DID operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DidOperationSubmitOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DidOperationSubmitRequestBody'
  /_arkret/root/identity/service-registrations:ensure:
    post:
      operationId: ak.root.identity.service_registration.command.ensure
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        requestCanonicalDigest: []
        contentDigest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRegistrationEnsureRequestBody'
      responses:
        '200':
          description: Existing or newly created stable service registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRegistrationOutcome'
        '400':
          description: Signed inception or registration-key binding rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Registration key or hosted document conflicts with another service identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /_arkret/root/identity/service-registrations:
    get:
      operationId: ak.root.identity.service_registration.resource.get
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      parameters:
      - name: service_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - principal_server
          - auth_server
          - identity_registry
      - name: public_base
        in: query
        required: true
        schema:
          type: string
          format: uri
          pattern: ^https?://[^?#]+/$
      responses:
        '200':
          description: Stable service registration bound to the requested key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRegistrationOutcome'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /_arkret/root/identity/receipts:
    get:
      operationId: ak.root.identity.receipts.query.list
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      responses:
        '200':
          description: Identity receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityReceiptListOutcome'
  /_arkret/root/identity/recovery-policy:
    post:
      operationId: ak.root.identity.recovery_policy.command.publish
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/recovery-policy.schema.json
      responses:
        '200':
          description: Recovery policy accepted
          content:
            application/json:
              schema:
                $ref: ../schemas/recovery-policy.schema.json#/$defs/recovery_policy_publish_outcome
    get:
      operationId: ak.root.identity.recovery_policy.resource.get
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      parameters:
      - name: principal_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^did:[a-z0-9]+:[^\s#?]+$
        description: Optional target principal. If omitted, the server resolves the principal from the authenticated session or service proof.
      responses:
        '200':
          description: Active recovery policy projection
          content:
            application/json:
              schema:
                $ref: ../schemas/recovery-policy.schema.json#/$defs/recovery_policy_active_outcome
  /_arkret/root/identity/recovery-sessions:
    post:
      operationId: ak.root.identity.recovery_session.command.create
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_create_request_body
      responses:
        '200':
          description: Recovery session created
          content:
            application/json:
              schema:
                $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_state
  /_arkret/root/identity/recovery-sessions/{recovery_session_id}:
    get:
      operationId: ak.root.identity.recovery_session.resource.get
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      parameters:
      - name: recovery_session_id
        in: path
        required: true
        schema:
          $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_id
      responses:
        '200':
          description: Recovery session state
          content:
            application/json:
              schema:
                $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_state
  /_arkret/root/identity/recovery-sessions/{recovery_session_id}/proofs:
    post:
      operationId: ak.root.identity.recovery_session.command.submit_proof
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      parameters:
      - name: recovery_session_id
        in: path
        required: true
        schema:
          $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_proof_submit_request_body
      responses:
        '200':
          description: Proof submission result
          content:
            application/json:
              schema:
                $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_proof_submit_outcome
  /_arkret/root/identity/recovery-sessions/{recovery_session_id}/complete:
    post:
      operationId: ak.root.identity.recovery_session.command.complete
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
      parameters:
      - name: recovery_session_id
        in: path
        required: true
        schema:
          $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_complete_request_body
      responses:
        '200':
          description: Recovery session completed
          content:
            application/json:
              schema:
                $ref: ../schemas/recovery-session.schema.json#/$defs/recovery_session_complete_outcome
  /_arkret/self/events:
    post:
      operationId: ak.self.events.command.submit
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
        contentDigest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventsSubmitRequestBody
      responses:
        '200':
          description: Event accepted (or duplicate / partial; see status field)
          headers:
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            X-Arkret-Request-Id:
              $ref: '#/components/headers/XArkretRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsSubmitOutcome'
    get:
      operationId: ak.self.events.query.scan
      x-arkret-required-any-of:
      - - realms
      - - actors
      security:
      - bearerAuth: []
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        requestCanonicalDigest: []
      summary: Query / backfill events with cursor pagination.
      description: |
        Returns a page of events according to `before` / `after` cursor seals.

        Either or both of `before` / `after` may be given:
          - `before=<cursor>` alone: events most recently *before* this cursor
            position (history backfill, UI-friendly). Default `order=descending`.
          - `after=<cursor>` alone: events earliest *after* this cursor position
            (catch-up, reducer-friendly). Default `order=ascending`.
          - both: open interval `(after, before)`. Default `order=descending`.
          - neither: equivalent to `before=<server head>` (latest first page).

        `before` and `after` are both EXCLUSIVE of the cursor position.

        Response `prev_cursor` / `next_cursor` are absolute-direction cursors:
        `prev_cursor` points toward older events (pass to next `before=`);
        `next_cursor` points toward newer events (pass to next `after=`).
        See zh/sync/service-http-binding.md §3.3 and zh/sync/api-conventions.md
        §7.0 for the full semantic table.

      parameters:
      - name: realms
        in: query
        description: Filter by Realm IDs. Multiple values are UNION within the parameter; cross with `actors` is intersection.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RealmId'
          minItems: 1
        style: form
        explode: true
      - name: actors
        in: query
        description: Filter by Actor DIDs. Multiple values are UNION within the parameter; cross with `realms` is intersection.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActorDid'
          minItems: 1
        style: form
        explode: true
      - name: before
        in: query
        description: Return events strictly older than this cursor position. Pair with response `prev_cursor` to walk further backward.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: after
        in: query
        description: Return events strictly newer than this cursor position. Pair with response `next_cursor` to walk further forward.
        schema:
          $ref: '#/components/schemas/Cursor'
      - name: order
        in: query
        description: |
          Batch ordering. `default` follows the proximity-to-seal rule
          (before-only → descending; after-only → ascending; both → descending);
          `ascending` / `descending` force the order.
        schema:
          type: string
          enum:
          - default
          - ascending
          - descending
          default: default
      - name: limit
        in: query
        description: Max events to return; server enforces an upper bound (see scalability-constraints.md).
        schema:
          type: integer
          minimum: 1
      - name: filters
        in: query
        description: Optional structured filter object (kind, payload predicates). See zh/sync/service-http-binding.md §3.3.
        schema:
          type: object
        style: deepObject
        explode: true
      - name: include_completeness
        in: query
        description: Request range-completeness attestation references covering the returned page (zh/sync/service-http-binding.md §3.3.6). Only effective when the service advertises events_query_range_completeness in supported_features; services that do not advertise it MUST ignore this parameter.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Event query page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsQueryOutcome'
        '400':
          description: |
            `invalid_param` — unrecognized `order` enum value or malformed cursor.
