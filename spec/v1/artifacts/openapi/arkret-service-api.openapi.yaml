        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Resolve bounded continuous target-signed service route successors.
      description: |
        Realm-scoped anti-enumeration recovery for a target service core already
        visible to the authenticated federation peer. The response contains at most
        32 continuous target-signed successor records, an optional active target-signed
        notice and no mirror-signed bare URL; canonical response bytes are capped at
        256 KiB. Unknown, unauthorized, invisible and not-held are indistinguishable.
