      x-arkret-auth:
        public_metadata: false
        proof_in_body: true
      summary: Submit an agent runtime key request for controller approval.
      description: |
        Runtime-to-controller pending approval request for native personal-agent
        key pairing. The runtime proves possession of the local key and the
        short pairing code; the controller still must approve by signing
        ak.agent.key.authorize and submitting agent_key_pair_request_body. The
        pairing code and proof-of-possession are sent in the JSON body, never in
        the URL path or query string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRuntimeApprovalRequestBody'
      responses:
        '200':
          description: Agent runtime key request accepted for controller approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRuntimeApprovalOutcome'
  /_arkret/open/agent-pairing/runtime-key-requests/status:
    post:
      operationId: ak.open.agent_pairing.query.runtime_key_request_status
      security: []
      x-arkret-auth:
        public_metadata: false
        proof_in_body: true
      summary: Poll the controller decision for a submitted runtime key request.
      description: |
        Runtime-side poll for the controller decision on a previously submitted
        runtime key request. The pairing_request_id + pairing_code +
        agent_id triple is the query credential and is sent in the
        JSON body, never in the URL path or query string; a record miss and a
        pairing_code or agent_id mismatch are indistinguishable (both
        not_found). Once approved, the outcome carries authorized_event_ref
        plus the authorized key binding; the runtime compares
        authorized_public_key_digest against its own key and treats a mismatch
        as paired-by-another-runtime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRuntimeApprovalStatusRequestBody'
      responses:
        '200':
          description: Current controller-decision status for the pairing request.
          content:
            application/json:
              schema:
