    BooleanFilter:
      $ref: ../schemas/query.schema.json#/$defs/boolean_filter
    BottomDiagnostic:
      $ref: ../schemas/bottom.schema.json
    CellQueryEnvelope:
      type: object
      description: 'Wire envelope for state-query / projection responses on a single
        cell. `status` MUST be `value` when the join is defined, `bottom` when the
        cell resolved to ⊥ on a `bottom=reject` lattice (caller MUST treat as
        fail-closed), and `conflict` when a `bottom=expose` lattice surfaces
        candidate heads to the projection / UI without selecting a winner. See
        zh/sync/service-surface.md §5.3 and zh/authz/event-auth-state-resolution.md
        §5.1.'
      required:
      - cell
      - status
      properties:
        cell:
          type: string
          pattern: ^ak:cell:ak\.component\.[a-z0-9_]+(?:\.[a-z0-9_]+)*\.v[0-9]+:[A-Za-z0-9._~=-]*(?::[A-Za-z0-9._~=-]+)*$
        status:
          type: string
          enum:
          - value
          - bottom
          - conflict
        value:
          description: 'Effective Lattice value when status=value. Shape is
            cell-type specific (or_set members, mv_register tuple, cas_register
            atom, fsm state, counter integer, ordered_log tail).'
        heads:
          type: array
          uniqueItems: true
          description: Candidate heads when status=conflict on a `bottom=expose`
            cell. Receivers MUST NOT use this for authorization decisions.
          items: true
        bottom:
          $ref: '#/components/schemas/BottomDiagnostic'
        seal_view:
          type: object
          description: Seal leaves / state_root the value or bottom was
            observed under. Mirrors `bottom.seal_view` when status≠value.
          required:
          - leaves
          properties:
            leaves:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                pattern: ^ak:seal:sha256:[0-9a-f]{64}$
            state_root:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
          additionalProperties: false
      additionalProperties: true
    CircleCreateRequestBody:
      $ref: ../schemas/circle-operations.schema.json#/$defs/circle_create_request_body
    CircleLifecycleRequestBody:
      $ref: ../schemas/circle-operations.schema.json#/$defs/circle_lifecycle_request_body
    CircleList:
      $ref: ../schemas/circle-operations.schema.json#/$defs/circle_list
    CircleMemberRequestBody:
      $ref: ../schemas/circle-operations.schema.json#/$defs/circle_member_request_body
    CircleMembershipOutcome:
      $ref: ../schemas/circle-operations.schema.json#/$defs/circle_membership_outcome
    CircleScopeRotateOutcome:
      $ref: ../schemas/circle-operations.schema.json#/$defs/circle_scope_rotate_outcome
    CircleView:
      $ref: ../schemas/circle-operations.schema.json#/$defs/circle_view
    CollectionCrosstabGroupSource:
      type: object
      required:
      - model
      - row_key
      - column_key
      properties:
        model:
          type: string
          const: crosstab_cell
        row_key:
          type: string
          minLength: 1
        column_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionCrosstabPosition:
      type: object
      required:
      - model
      - row_key
      - column_key
      - sort_key
      properties:
        model:
          type: string
          const: crosstab_cell
        row_key:
          type: string
          minLength: 1
        column_key:
          type: string
          minLength: 1
        sort_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionFieldValueGroupSource:
      type: object
      required:
      - model
      - field
      - value
      properties:
        model:
          type: string
          const: field_value
        field:
          type: string
          pattern: ^[a-zA-Z0-9_]+(\.[a-zA-Z0-9_]+)*$
        value:
          oneOf:
          - type: string
          # lint-waiver(type:number): CollectionFieldValueGroupSource.value is a UI/query
          # filter parameter accepting whatever the projected field's runtime type is. It
          # does not enter canonical Event bytes. Runtime values remain JSON numbers on
          # this query-only surface; canonical decimal fields use their own typed schema.
          - type: number
          - type: boolean
      additionalProperties: false
    CollectionFieldValuePosition:
      type: object
      required:
      - model
      - container_id
      - rank
      properties:
        model:
          type: string
          const: field_value
        container_id:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: ^[0-9A-Za-z]{1,128}$
      additionalProperties: false
    CollectionGroupSource:
      oneOf:
      - $ref: '#/components/schemas/CollectionFieldValueGroupSource'
      - $ref: '#/components/schemas/CollectionRelationGroupSource'
      - $ref: '#/components/schemas/CollectionTimeBucketGroupSource'
      - $ref: '#/components/schemas/CollectionCrosstabGroupSource'
    CollectionProjectionGroup:
      type: object
      required:
      - key
      - title
      - source
      - items
      - limited
      properties:
        key:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: ^[0-9A-Za-z]{1,128}$
        source:
          $ref: '#/components/schemas/CollectionGroupSource'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionItem'
        next_cursor:
          oneOf:
          - type: string
            pattern: ^ak:cursor:[A-Za-z0-9_-]+$
          - type: 'null'
        limited:
          type: boolean
        wip_state:
          type: string
          enum:
          - ok
          - over_limit
          - unknown
        total_estimate:
          type: integer
          minimum: 0
      allOf:
      - if:
          properties:
            source:
              properties:
                model:
                  const: field_value
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionItem'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionFieldValuePosition'
      - if:
          properties:
            source:
              properties:
                model:
                  const: relation_container
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/ProjectionItem'
                - type: object
                  required:
                  - position
                  properties:
                    position:
                      $ref: '#/components/schemas/CollectionRelationPosition'
      - if:
          properties:
            source:
              properties:
                model:
                  const: time_bucket
              required:
              - model
          required:
          - source
        then:
          properties:
            items:
              type: array
              items:
                allOf:
