  /_arkret/open/principals/{principal_id}/resolution:
    get:
      operationId: ak.open.identity.read.resolution
      security: []
      x-arkret-auth:
        public_metadata: true
        proof_in_body: false
      summary: Read the current public principal resolution projection.
      description: |
        Returns the account's current resolution projection, bounded adapter
        method history evidence and the Station projection attestation.
        It carries no Principal Control Realm id, genesis Event, genesis receipt,
        resolution Event or accepted Seal: that account-internal audit material
        is served only by ak.self.identity.read.resolution_audit.v1 under exact
        current-holder authorization, so this surface has no history selector.
        The response is discovery evidence, never an authorization result.
        A caller performing a sensitive operation MUST obtain a fresh response,
        verify the exact (principal_id, station_id) account authority,
        verify the attestation proof under the current station_id method
        history, resolve the returned did with the registered method adapter,
        and confirm project(did) equals principal_id. Callers are not required
        to persist another principal's resolution binding.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.open.identity.read.resolution.v1
      - name: principal_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
      - name: station_id
        in: query
        required: true
        description: >-
          Station that owns the account authority for this principal.
          Together with principal_id this is the complete public selector.
        schema:
          type: string
          pattern: ^ak:did_core:[a-z0-9]+:[^\s/?#]+$
      responses:
        '200':
          description: Current public principal resolution projection.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store, no-transform
          content:
            application/json:
              schema:
                $ref: ../schemas/identity-resolution.schema.json#/$defs/public_principal_resolution
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/TemporarilyUnavailable'
  /_arkret/open/services/{service_id}/resolution:
