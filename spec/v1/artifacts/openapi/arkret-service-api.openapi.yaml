  /_arkret/peer/keys/keypackages/claim:
    post:
      operationId: ak.peer.keys.keypackages.command.claim
      security:
      - httpMessageSignature: []
        sourceServiceId: []
        destinationServiceId: []
        sourceTrustDomain: []
        destinationTrustDomain: []
        contentDigest: []
      summary: Atomically claim destination-owned KeyPackages for a federated participant.
      description: |
        The destination KeyPackage authority is the sole compare-and-swap
        authority. It validates both the requesting participant's detached
        authorization and the outer source-service HTTP Message Signature.
        Idempotency is scoped by (Source-Service-ID, claim_request_id), with the
        exact canonical request digest bound into the ledger and both signatures.
        Direct Conversation claims require pair_key and strand_id and forbid
        last-resort KeyPackages. Failures are externally collapsed to claim_failed.
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.peer.keys.keypackages.command.claim.v1
      - in: header
        name: Idempotency-Key
        required: true
        description: |
          MUST equal body.claim_request_id and be covered by the HTTP Message
          Signature. Reuse with different exact body bytes, as verified by
          Content-Digest and the receiver-computed canonical digest, is a
          duplicate conflict and never performs a second claim.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeerKeyPackagesClaimRequestBody'
      responses:
        '200':
          description: Signed destination-authority claim outcome without inventory or per-device failure leakage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerKeyPackagesClaimOutcome'
  /_arkret/peer/keys/keypackages/claims/query:
    post:
      operationId: ak.peer.keys.keypackages.read.claim
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
