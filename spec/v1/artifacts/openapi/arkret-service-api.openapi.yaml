    EventsSubscribeFrame:
      type: object
      description: 'One NDJSON line emitted by ak.events.subscribe. Per-kind constraints
        mirror service-http-binding.md §3.4 and align in strictness with account-subscribe-frame.schema.json:
        `event` carries realm_id + cursor + payload; `frontier` / `catchup_complete`
        carry cursor (realm_id present = that Realm''s frontier/catchup, absent =
        whole subscription); `epoch_rotation` is a realm-scoped boundary hint (realm_id
        + payload, no cursor); `dropped` requires a usable recovery cursor + realm_id
        — if no cursor exists, servers MUST emit `resync_required` instead; `resync_required`
        / `unauthorized` carry no cursor (realm_id present = realm-scoped, absent
        = whole subscription / session); `heartbeat` carries nothing.'
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - event
          - frontier
          - heartbeat
          - catchup_complete
          - epoch_rotation
          - dropped
          - resync_required
          - unauthorized
        realm_id:
          type: string
        cursor:
          type: string
          description: Stream cursor. REQUIRED on event / frontier / catchup_complete
            / dropped; forbidden on epoch_rotation / resync_required / unauthorized
            / heartbeat.
        payload:
          type: object
        reconnect_after_ms:
          type: integer
          minimum: 1
          description: Optional server-directed minimum delay before opening another ak.self.events.stream.subscribe stream for the same caller/selector scope. MAY appear only on dropped and resync_required frames; clients MUST wait at least this delay before reconnecting, and servers MUST reject earlier reconnect attempts with 429 plus Retry-After.
      allOf:
      - if:
          properties:
            kind:
              const: event
          required:
          - kind
        then:
          required:
          - realm_id
          - cursor
          - payload
      - if:
          properties:
            kind:
              const: epoch_rotation
          required:
          - kind
        then:
          required:
          - realm_id
          - payload
          not:
            required:
            - cursor
      - if:
          properties:
            kind:
              enum:
              - frontier
              - catchup_complete
          required:
          - kind
        then:
          required:
          - cursor
          not:
            required:
            - payload
      - if:
          properties:
            kind:
              const: dropped
          required:
          - kind
        then:
          required:
          - realm_id
          - cursor
          not:
            required:
            - payload
      - if:
          properties:
            kind:
              const: resync_required
          required:
          - kind
        then:
          not:
            anyOf:
            - required:
              - cursor
            - required:
              - payload
      - if:
          properties:
            kind:
              const: unauthorized
          required:
          - kind
        then:
          not:
            anyOf:
            - required:
              - cursor
            - required:
              - payload
            - required:
              - reconnect_after_ms
      - if:
          properties:
            kind:
              const: heartbeat
          required:
          - kind
        then:
          not:
            anyOf:
            - required:
              - realm_id
            - required:
              - cursor
            - required:
              - payload
            - required:
              - reconnect_after_ms
      - if:
          properties:
            kind:
              enum:
              - event
              - frontier
              - catchup_complete
              - epoch_rotation
          required:
          - kind
        then:
          not:
            required:
            - reconnect_after_ms
      additionalProperties: false
    EventStateView:
      type: object
      description: Per-event protocol-state field surfaced on /account/subscribe and /events
        responses (zh/sync/service-surface.md §5.3, zh/authz/event-auth-state-resolution.md
        §13). Implementations MUST attach this on every reducer-input Event
        included in a timeline/state response so clients can render fail-closed
        UI without recomputing the join.
      required:
      - event_id
      - event_digest
      - event_state
      properties:
        event_id:
          type: string
          pattern: ^ak:event:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        event_digest:
          type: string
          description: Canonical hash of the event's canonical bytes (excluding
            proofs and unsigned); equals proof.event_digest. Used as the Seal
            frontier item for this event. Algorithm family aligned with
            schemas/seal.schema.json#/$defs/event_digest — active digest
            suites per registry/digest-suite-registry.json (v1 sha256 / blake3,
            64 hex).
          pattern: ^(?:sha256|blake3):[0-9a-f]{64}$
        event_state:
          type: string
          enum:
          - data_local
          - data_observed
          - control_pending
          - control_sealed
          - failed_precondition
          - failed_plane
          - failed_bottom
          - rejected_seal
          - fork_quarantine
          - stale_seal_ref
        bottom:
          $ref: '#/components/schemas/BottomDiagnostic'
      additionalProperties: false
    EventSubmitEnvelope:
      allOf:
      - $ref: ../schemas/event-envelope.schema.json
      - type: object
        not:
          anyOf:
          - required:
            - actor_kind
          - required:
            - effective_scope
        description: |
          Actor-supplied ak.self.events.command.submit input envelope. It reuses the base Event
          shape for actor intent fields but forbids reducer-managed accepted-output
          projections such as actor_kind and effective_scope. Services stamp those
          fields only after accept and expose them on read/query/sync envelopes.
    EventView:
      $ref: ../schemas/service-operation-dtos.schema.json#/$defs/EventView
