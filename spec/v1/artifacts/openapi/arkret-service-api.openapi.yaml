      summary: Private Principal Server Contact fact delivery.
      description: |
        Delivers a signed ak.contact.* fact from the issuer-side Principal
        Server to the target holder's Principal Server. Direct Conversation
        bindings and Realm Events are forbidden. The recipient validates the signed fact event, the
        explicit contact_address, the destination service DID, and the holder's
