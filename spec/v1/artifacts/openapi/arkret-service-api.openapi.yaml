  /_arkret/gate/account/session-grants/introspect:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.introspect_session_grant
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.introspect_session_grant.v1
      security:
      - bearerAuth: []
      summary: Server-to-server session-grant introspection.
      description: |
        RFC 7662-style introspection used by a Station to validate a
        presented session grant. The caller supplies the grant id or grant_jwt
        (plus an optional audience and optional S2S holder confirmation) and
        gets back whether the grant is active, a standardized status, and
        non-secret grant metadata — including session_public_key for RFC 9421
        PoP verification and cnf_jkt for local DPoP verification on
        /_arkret/self/*. READ-ONLY: introspection MUST NOT consume or revoke
        the grant (consumption/rotation is the refresh endpoint's job).
        Authenticated by the configured session_grant_introspection_bearer (a
        server-local static bearer) or an admin scope.
      responses:
        '200':
          description: Introspection result (active flag, status, grant metadata).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGrantIntrospectOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionGrantIntrospectRequestBody'
  /_arkret/gate/account/controller-gate-attestations:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.issue_controller_gate_attestation
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.issue_controller_gate_attestation.v1
      security:
      - httpMessageSignature: []
      x-arkret-auth:
        public_metadata: false
        holder_proof: false
        notes: Authenticated S2S only. The receiver independently verifies the request's current signed ServiceResolutionRecord, method evidence and normalized DID Document before using its active assertion key for RFC 9421. Bearer does not replace the signature. The verified source service must equal request.agent_authority_id and service_id in the controller current AcceptedAtServiceBinding.
      summary: Issue the Account Authority controller lifecycle gate used in Native Agent signer evidence.
      description: |
        The Account Authority reads its own current account binding/status
        projection and signs one privacy-minimal controller lifecycle snapshot
        under ak.controller_account_gate.v1. The attestation lifetime is at most
        300 seconds. It intentionally omits operation, request digest, audience
        and challenge because per-request current_observation and outer
        attestation bind its digest to those exact values. Unknown principal,
        missing current binding, wrong source service and unauthorized callers
        are indistinguishable. No account_id or raw account cell is returned.
        The HTTP signature covers method, target URI/path, Content-Digest,
        Source/Destination-Service-ID, operation id and request id. DidCoreId,
        URL, bearer and caller-supplied keys are not verification-key sources.
      responses:
        '200':
          description: Byte-stable controller gate attestation issuance outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerAccountGateAttestationIssueOutcome'
        '404':
          description: Uniform non-enumerating outcome for unknown, unbound, wrong-service or unauthorized requests.
        '409':
          description: The request_id was already bound to a different canonical intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerAccountGateAttestationIssueRequestBody'
  /_arkret/gate/account/logout:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.command.logout
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.logout.v1
      security:
      - bearerAuth: []
        dpopProof: []
      x-arkret-auth:
        public_metadata: false
        holder_proof: true
        notes: Account hard logout MUST present the current ak.session.grant as Authorization bearer and a DPoP proof whose ath binds that grant and whose htm/htu bind POST /_arkret/gate/account/logout.
      summary: Account Authority hard logout.
      description: |
        Ordinary hard logout at the Account Authority (account-lifecycle §4.1),
        and the only client-visible logout endpoint. The Account Authority
        validates the current ak.session.grant plus DPoP, terminates the
        Auth-side auth session / grant rotation chain (via
        auth-sessions/logout when Auth-side is split out), then terminates or
        durably schedules Principal-side local account/device session cleanup,
        to-device drop, and push registration removal. Does not emit
        ak.device.revoke, does not erase durable device authorization (re-login
        restores the device), and does not create an AccountStatusRecord. Distinct
        from revoke_session (targeted session-grant revoke). A not_found
        introspection result is an idempotent retry state only after the
        Auth-side auth-sessions/logout sub-operation confirms completion; an
        audience_mismatch remains an authentication failure and MUST NOT be
        treated as already logged out.
      responses:
        '200':
          description: Account Authority hard logout completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLogoutOutcome'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLogoutRequestBody'
  /_arkret/gate/account/erasure-requests:
    post:
      operationId: ak.gate.account.command.request_erasure
      parameters:
      - name: Arkret-Operation
        in: header
        required: true
        description: Required exact versioned operation_id selector for every canonical Arkret HTTP request.
        schema:
          type: string
          const: ak.gate.account.command.request_erasure.v1
      security:
      - bearerAuth: []
        dpopProof: []
      summary: Record the authenticated holder's explicit account erasure request.
      description: |
        The only client entry point for self-initiated account erasure
        (zh/identity/account-lifecycle.md section 8.1), accepted directly by
        the Account Authority on the gate surface. The Account Authority
        treats this as a high-risk action and requires fresh high-risk action
        authentication (recent login, WebAuthn, recovery key or a deployment
        equivalent), judged locally by the Account Authority — the only party
        holding the relevant facts; a session that does not satisfy the
        deployment policy is rejected with reauthentication_required.

        Success is an acceptance confirmation only: the erasure intent is
        durably recorded and the Account Authority continues its existing
        erasure_pending AccountStatusRecord issuance flow within the same
        service; there is no cross-service handoff. The response proves
        neither record issuance nor physical completion; the current status is
        observed through the existing account-status read surface and physical
        completion only through the erasure receipt rail. When the deployment
        grants a withdrawal window the outcome echoes withdrawal_window_ends_at
        and the record is not signed before that time; once the record is
        signed the request is irreversible and no withdrawal is possible.

        Replaying the same request_id returns the recorded acceptance outcome;
        the same request_id with different canonical bytes is
        duplicate_conflict with zero writes; a different request_id while a
        live unsigned-record intent exists is failed_precondition with
        reason_code erasure_request_already_pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/account-operations.schema.json#/$defs/account_request_erasure_request_body
      responses:
        '200':
          description: Erasure request accepted and the intent durably recorded.
          content:
            application/json:
              schema:
                $ref: ../schemas/account-operations.schema.json#/$defs/account_request_erasure_outcome
