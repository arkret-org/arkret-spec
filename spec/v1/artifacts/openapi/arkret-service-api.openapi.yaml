          type: string
      responses:
        '200':
          description: Resolved participation policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentParticipationOutcome'
  /_arkret/gate/account/oidc/callback:
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost
    post:
      operationId: ak.gate.account.exchange.complete_oidc
      security: []
      x-arkret-auth:
        public_metadata: false
        proof_in_body: true
        proof_field: code
        notes: Optional browser redirect landing only. It validates state/code/nonce for deployment handoff, but MUST NOT return SessionGrantOutcome, ak.session.grant, or Principal local session material; client-visible grant issuance is only via POST /_arkret/gate/account/session-grants with proof_kind=oidc_code_exchange.
      responses:
        '200':
          description: OIDC browser handoff accepted; no session material is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOidcCallbackOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountOidcCallbackRequestBody'
