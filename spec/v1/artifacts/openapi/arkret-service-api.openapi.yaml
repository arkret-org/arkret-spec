      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentParticipationReplaceRequestBody'
    get:
      operationId: ak.self.agent.participation.resource.get
      description: Get an agent's resolved participation policy (controller-self only).
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: agent_id
