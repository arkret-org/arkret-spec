        destinationTrustDomain: []
        contentDigest: []
      summary: Obtain PCR-bound authoring frontiers for an account-status Event.
      description: |
        Read-only Account Authority query made before signing one
        `ak.account.status` Event. The receiver verifies the signed authority
        evidence and current delegation before returning both the exact issuer
        actor-chain frontier and the exact Principal Control Realm Seal head.
        Source-Service-ID must equal `issuer_service_id`; both frontier scopes
        must match the evidence. The operation accepts no Event, advances no
        frontier, grants no authority, and never synthesizes an empty PCR.
