    PsiPaddedErrorEnvelope:
      type: object
      description: >-
        Closed PSI Class B projection of the standard ErrorEnvelope with the
        required padding extension. Details and retry_after_ms are intentionally
        absent so the maximal semantic body size is bounded.
      required: [ok, error, request_id, padding]
      additionalProperties: false
      properties:
        ok:
          const: false
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - duplicate_conflict
              - policy_denied
              - psi_batch_unavailable
              - psi_quota_exhausted
            message:
              type: string
              minLength: 1
              maxLength: 256
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        padding:
          $ref: '#/components/schemas/PsiResponsePadding'
    PsiPaddedProblem:
      type: object
      description: >-
        Closed RFC 9457 projection of PsiPaddedErrorEnvelope. padding is an RFC
        9457 extension member and the only extension allowed on this surface.
      required: [type, status, detail, instance, padding]
      additionalProperties: false
      properties:
        type:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 128
        status:
          type: integer
          enum: [403, 409, 410, 429]
        detail:
          type: string
          maxLength: 256
        instance:
          type: string
          minLength: 1
          maxLength: 128
        padding:
          $ref: '#/components/schemas/PsiResponsePadding'
    PsiResponsePadding:
      type: string
      pattern: '^ *$'
      maxLength: 262144
      description: >-
        ASCII-SP padding chosen so the RFC 8785 JCS UTF-8 JSON HTTP entity body
        has exactly the phase Content-Length bucket advertised by
        ServiceDescribe.private_contact_discovery.
