        '409':
          description: Conflicting refresh intent, terminal recorded successor, or replay record no longer decidable. A terminal replay carries closed session_grant_id/state details and never creates a second successor.
          content:
            application/problem+json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      error:
                        type: object
                        required: [code]
                        properties:
                          code:
                            enum: [duplicate_conflict, session_grant_replay_indeterminate, device_revocation_pending, device_revoked, device_generation_fenced]
                - allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      error:
                        type: object
                        required: [code, details]
                        properties:
                          code:
                            const: session_grant_replay_terminal
                          details:
                            $ref: '#/components/schemas/SessionGrantReplayTerminalProblem'
        '410':
          description: The recorded successor has expired; the issuer returns its session_grant_id/state and creates no second successor.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    error:
                      type: object
                      required: [code, details]
                      properties:
                        code:
                          const: session_grant_replay_expired
                        details:
                          $ref: '#/components/schemas/SessionGrantReplayExpiredProblem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionGrantRefreshRequestBody'
