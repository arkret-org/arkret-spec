# Status: binding extension profile reference.
# v1 core 互操作锁定 HTTP/JSON binding (artifacts/openapi/cokret-service-api.openapi.yaml)。
# 本文件描述 WebSocket / SSE / gRPC / message queue / libp2p binding 的 frame / topic 形态，
# 仅在显式声明对应 binding profile 的部署中适用；v1 core 实现不要求实现这些 binding。
version: "2026-05-02"
operation_registry: ../registry/operation-registry.json
frame_schemas:
  websocket:
    required:
      - frame_id
      - operation_id
      - stream_id
      - payload
    properties:
      frame_id:
        type: string
        pattern: "^ck:frame:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      operation_id:
        type: string
      stream_id:
        type: string
      cursor:
        oneOf:
          - type: string
          - $ref: ../schemas/cursor.schema.json
      payload:
        type: object
      error:
        type: object
      request_id:
        type: string
  sse:
    event_types:
      - sync.event
      - sync.snapshot
      - sync.heartbeat
      - applet.ack
      - agent.status
    data_shape:
      type: object
      required:
        - operation_id
        - payload
grpc:
  services:
    Server:
      Describe: ck.server.describe
    Identity:
      DescribeRegistry: ck.identity.describe_registry
      Resolve: ck.identity.resolve
      GetDocument: ck.identity.get_document
      GetLog: ck.identity.get_log
      SubmitDidOperation: ck.identity.submit_did_operation
      GetReceipts: ck.identity.get_receipts
    Events:
      Describe: ck.events.describe
      Submit: ck.events.submit
      Get: ck.events.get
      Resolve: ck.events.resolve
      Query: ck.events.query
      # The HTTP POST/body query variant reuses the canonical Events/Query
      # gRPC binding and is not exposed as a separate non-HTTP operation.
      Subscribe: ck.events.subscribe
      Frontier: ck.events.frontier
    Ephemeral:
      Send: ck.ephemeral.send
    CallMedia:
      TokenExchange: ck.call.media.token_exchange
    Snapshot:
      Head: ck.snapshot.head
    Directory:
      Describe: ck.directory.describe
      SearchRealms: ck.directory.search_realms
      ResolveRealm: ck.directory.resolve_realm
      ResolveTarget: ck.directory.resolve_target
      SearchOrganizations: ck.directory.search_organizations
      ResolveOrganization: ck.directory.resolve_organization
      SearchActors: ck.directory.search_actors
      SearchUsers: ck.directory.search_users
      ResolveHandle: ck.directory.resolve_handle
      ListHandlesForSubject: ck.directory.list_handles_for_subject
      PrivateContactDiscovery: ck.directory.private_contact_discovery
      Announce: ck.directory.announce
      Withdraw: ck.directory.withdraw
      PushRegister: ck.directory.push.register
    Keys:
      Upload: ck.keys.upload
      Query: ck.keys.query
      Claim: ck.keys.claim
      KeyPackagesUpload: ck.keys.keypackages.upload
      KeyPackagesClaim: ck.keys.keypackages.claim
      KeyPackagesConsume: ck.keys.keypackages.consume
      KeyPackagesRevoke: ck.keys.keypackages.revoke
      BackupsPut: ck.keys.backups.put
      BackupsList: ck.keys.backups.list
      BackupsGet: ck.keys.backups.get
      BackupsDelete: ck.keys.backups.delete
    Blob:
      Upload: ck.blob.upload
      Get: ck.blob.get
      Head: ck.blob.head
      Presign: ck.blob.presign
    DeviceMessages:
      Put: ck.device_messages.put
      Get: ck.device_messages.get
    Moderation:
      Report: ck.moderation.report
    Projection:
      Spaces: ck.projection.spaces
      Flows: ck.projection.flows
      Morphs: ck.projection.morphs
    Policy:
      Check: ck.policy.check
    Media:
      IceConfig: ck.media.ice_config
    Applet:
      Ping: ck.applet.ping
      Describe: ck.applet.describe
      InstallPreview: ck.applet.install.preview
      Install: ck.applet.install
      Transaction: ck.applet.transaction
      ResolveActor: ck.applet.resolve_actor
      ResolveRealm: ck.applet.resolve_realm
      Revoke: ck.applet.revoke
      ProtocolMetadata: ck.applet.protocol_metadata
      ThirdPartyUsers: ck.applet.third_party_users
      ThirdPartyLocations: ck.applet.third_party_locations
    Mimi:
      ProviderDirectory: ck.mimi.provider_directory
      KeyMaterial: ck.mimi.key_material
      RoomUpdate: ck.mimi.room_update
      Notify: ck.mimi.notify
      SubmitMessage: ck.mimi.submit_message
      GroupInfo: ck.mimi.group_info
      RequestConsent: ck.mimi.request_consent
      UpdateConsent: ck.mimi.update_consent
      IdentifierQuery: ck.mimi.identifier_query
      ReportAbuse: ck.mimi.report_abuse
      ProxyDownload: ck.mimi.proxy_download
    Push:
      RegisterDevice: ck.push.register_device
      UnregisterDevice: ck.push.unregister_device
      Notify: ck.push.notify
    Authz:
      Check: ck.authz.check
      GetEffectiveGrants: ck.authz.get_effective_grants
      GetInvites: ck.authz.get_invites
    Account:
      Describe: ck.account.describe
      Viewer: ck.account.viewer
      Subscribe: ck.account.subscribe
      UpdateProfile: ck.account.update_profile
      CursorRevoke: ck.account.cursor_revoke
      Register: ck.account.register
      IssueSessionGrant: ck.account.issue_session_grant
      SessionRevoke: ck.account.session_revoke
      AgentKeyPair: ck.account.agent_key_pair
      DevicePair: ck.account.device_pair
      OidcCallback: ck.account.oidc_callback
    Agent:
      Provision: ck.agent.provision
      List: ck.agent.list
      Get: ck.agent.get
      Pause: ck.agent.pause
      Resume: ck.agent.resume
      Deactivate: ck.agent.deactivate
      RotateKey: ck.agent.rotate_key
      GrantAttach: ck.agent.grant.attach
      GrantDetach: ck.agent.grant.detach
      SidecarThreadEnsure: ck.agent.sidecar_thread.ensure
mq:
  envelope:
    required:
      - message_id
      - operation_id
      - payload
      - sent_at
      - signatures
    properties:
      message_id:
        type: string
      operation_id:
        type: string
      replay_key:
        type: string
      payload:
        type: object
      sent_at:
        type: string
      signatures:
        type: array
  topics:
    events.submit: ck.events.submit
    events.resolve: ck.events.resolve
    events.query: ck.events.query
    events.subscribe: ck.events.subscribe
    ephemeral.send: ck.ephemeral.send
    call.media.token_exchange: ck.call.media.token_exchange
    account.subscribe: ck.account.subscribe
    account.viewer: ck.account.viewer
    account.update_profile: ck.account.update_profile
    account.cursor_revoke: ck.account.cursor_revoke
    account.register: ck.account.register
    account.session_revoke: ck.account.session_revoke
    account.agent_key_pair: ck.account.agent_key_pair
    agent.provision: ck.agent.provision
    agent.list: ck.agent.list
    agent.get: ck.agent.get
    agent.pause: ck.agent.pause
    agent.resume: ck.agent.resume
    agent.deactivate: ck.agent.deactivate
    agent.rotate_key: ck.agent.rotate_key
    agent.grant.attach: ck.agent.grant.attach
    agent.grant.detach: ck.agent.grant.detach
    agent.sidecar_thread.ensure: ck.agent.sidecar_thread.ensure
    directory.private_contact_discovery: ck.directory.private_contact_discovery
    directory.list_handles_for_subject: ck.directory.list_handles_for_subject
    directory.announce: ck.directory.announce
    directory.withdraw: ck.directory.withdraw
    directory.push.register: ck.directory.push.register
    keys.keypackages.upload: ck.keys.keypackages.upload
    keys.keypackages.claim: ck.keys.keypackages.claim
    keys.keypackages.consume: ck.keys.keypackages.consume
    keys.keypackages.revoke: ck.keys.keypackages.revoke
    keys.backups.put: ck.keys.backups.put
    keys.backups.list: ck.keys.backups.list
    keys.backups.get: ck.keys.backups.get
    keys.backups.delete: ck.keys.backups.delete
    moderation.report: ck.moderation.report
    projection.spaces: ck.projection.spaces
    projection.flows: ck.projection.flows
    projection.morphs: ck.projection.morphs
    mimi.provider_directory: ck.mimi.provider_directory
    mimi.key_material: ck.mimi.key_material
    mimi.room_update: ck.mimi.room_update
    mimi.notify: ck.mimi.notify
    mimi.submit_message: ck.mimi.submit_message
    mimi.group_info: ck.mimi.group_info
    mimi.request_consent: ck.mimi.request_consent
    mimi.update_consent: ck.mimi.update_consent
    mimi.identifier_query: ck.mimi.identifier_query
    mimi.report_abuse: ck.mimi.report_abuse
    mimi.proxy_download: ck.mimi.proxy_download
    push.notify: ck.push.notify
    authz.check: ck.authz.check
libp2p:
  envelope:
    required:
      - stream_protocol
      - operation_id
      - source_service_did
      - target_service_did
      - payload
      - proof
    properties:
      stream_protocol:
        type: string
      operation_id:
        type: string
      source_service_did:
        type: string
      target_service_did:
        type: string
      payload:
        type: object
      frontier:
        type: object
      proof:
        type: object
  suggested_protocols:
    - /cokret/sync/1.0.0
    - /cokret/blob/1.0.0
  # Federation API 走 sync surface（HTTP 侧复用 ck.events.submit / ck.events.query
  # 加 service signature header；详见 federation.md §4 与 §7）。libp2p binding 同样使用
  # /cokret/sync/1.0.0 + service-signature envelope，不另设独立 /cokret/federation/1.0.0
  # protocol multiplexer。
