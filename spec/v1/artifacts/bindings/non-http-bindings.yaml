  envelope:
    required:
      - stream_protocol
      - operation_id
      - source_service_id
      - target_service_id
      - payload
      - proof
    properties:
      stream_protocol:
        type: string
      operation_id:
        type: string
      source_service_id:
        type: string
      target_service_id:
        type: string
      payload:
        type: object
      frontier:
        type: object
      proof:
        type: object
  suggested_protocols:
    - /arkret/sync/1.0.0
    - /arkret/blob/1.0.0
  # Federation API 使用 peer events operations 与 ak.peer.snapshot.read.manifest_head。
  # libp2p binding 使用 /arkret/sync/1.0.0 + service-signature envelope，
  # 不另设独立 /arkret/federation/1.0.0 protocol multiplexer。
