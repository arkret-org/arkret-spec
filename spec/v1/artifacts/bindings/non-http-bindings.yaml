# Status: binding extension profile reference.
# v1 core 互操作锁定 HTTP/JSON binding (artifacts/openapi/cokret-service-api.openapi.yaml)。
# 本文件描述 WebSocket / SSE / gRPC / message queue / libp2p binding 的 frame / topic 形态，
# 仅在显式声明对应 binding profile 的部署中适用；v1 core 实现不要求实现这些 binding。
version: "2026-05-02"
operation_registry: ../registry/operation-registry.json
frame_schemas:
  websocket:
    required:
      - frame_id
      - operation_id
      - stream_id
      - payload
    properties:
      frame_id:
        type: string
        pattern: "^ck:frame:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      operation_id:
        type: string
      stream_id:
        type: string
      cursor:
        oneOf:
          - type: string
          - $ref: ../schemas/cursor.schema.json
      payload:
        type: object
      error:
        type: object
      request_id:
        type: string
  sse:
    event_types:
      - sync.event
      - sync.snapshot
      - sync.heartbeat
      - applet.ack
      - agent.status
    data_shape:
      type: object
      required:
        - operation_id
        - payload
grpc:
  services:
    Server:
      Describe: ck.server.describe
    Identity:
      DescribeRegistry: ck.root.identity.describe_registry
      Resolve: ck.root.identity.resolve
      GetDocument: ck.root.identity.get_document
      GetLog: ck.root.identity.get_log
      SubmitDidOperation: ck.root.identity.submit_did_operation
      GetReceipts: ck.root.identity.get_receipts
    Events:
      Describe: ck.self.events.describe
      Submit: ck.self.events.submit
      Get: ck.self.events.get
      Resolve: ck.self.events.resolve
      Query: ck.self.events.query
      # The HTTP POST/body query variant reuses the canonical SelfEvents/Query
      # gRPC binding and is not exposed as a separate non-HTTP operation.
      Subscribe: ck.self.events.subscribe
      Frontier: ck.self.events.frontier
    PeerEvents:
      Describe: ck.peer.events.describe
      Submit: ck.peer.events.submit
      Resolve: ck.peer.events.resolve
      Query: ck.peer.events.query
      # The HTTP POST/body query variant reuses the canonical PeerEvents/Query
      # gRPC binding and is not exposed as a separate non-HTTP operation.
      Frontier: ck.peer.events.frontier
    Ephemeral:
      Send: ck.self.ephemeral.send
    CallMedia:
      TokenExchange: ck.self.call.media.token_exchange
    Snapshot:
