libp2p:
  envelope:
    required:
      - stream_protocol
      - operation_id
      - source_service_did
      - target_service_did
      - payload
      - proof
    properties:
      stream_protocol:
        type: string
      operation_id:
        type: string
      source_service_did:
        type: string
      target_service_did:
        type: string
      payload:
        type: object
      frontier:
        type: object
      proof:
        type: object
  suggested_protocols:
    - /cokret/sync/1.0.0
    - /cokret/blob/1.0.0
  # Federation API 使用 peer events operations 与 ck.peer.snapshot.head。
  # libp2p binding 使用 /cokret/sync/1.0.0 + service-signature envelope，
  # 不另设独立 /cokret/federation/1.0.0 protocol multiplexer。
