      Get: ck.self.blob.get
      Head: ck.self.blob.head
      Presign: ck.self.blob.presign
    DeviceMessages:
      Put: ck.self.device_messages.put
      Get: ck.self.device_messages.get
    Contact:
      Request: ck.self.contact.request
      Respond: ck.self.contact.respond
      List: ck.self.contact.list
      Tombstone: ck.self.contact.tombstone
    DirectConversation:
      Resolve: ck.self.direct_conversation.resolve
    Moderation:
      Report: ck.self.moderation.report
    Projection:
      Spaces: ck.self.projection.spaces
      Flows: ck.self.projection.flows
      Morphs: ck.self.projection.morphs
    Policy:
      Check: ck.self.policy.check
    Media:
      IceConfig: ck.self.media.ice_config
    Applet:
      Ping: ck.edge.applet.ping
      Describe: ck.edge.applet.describe
      InstallPreview: ck.self.applet.install.preview
