# Status: binding extension profile reference.
# v1 core 互操作锁定 HTTP/JSON binding (artifacts/openapi/arkret-service-api.openapi.yaml)。
# 本文件描述 WebSocket / SSE / gRPC / message queue / libp2p binding 的 frame / topic 形态，
# 仅在显式声明对应 binding profile 的部署中适用；v1 core 实现不要求实现这些 binding。
version: "2026-08-20"
operation_registry: ../registry/operation-registry.json
coverage: complete_except_http_only
coverage_contract: >-
  Every registered operation that is not marked http_only_variant=true MUST appear
  at least once in this binding artifact. Operations marked http_only_variant=true
  MUST NOT appear here. tools/artifact_lint enforces both directions after
  parsing this file as YAML.
frame_schemas:
  websocket:
    required:
      - frame_id
      - operation_id
      - stream_id
      - payload
    properties:
      frame_id:
        type: string
        pattern: "^ak:frame:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      operation_id:
        type: string
      stream_id:
        type: string
      cursor:
        oneOf:
          - type: string
          - $ref: ../schemas/cursor.schema.json
      payload:
        type: object
      error:
        type: object
      request_id:
        type: string
  sse:
    event_types:
      - sync.event
      - sync.snapshot
      - sync.heartbeat
      - applet.ack
      - agent.status
    data_shape:
      type: object
      required:
        - operation_id
        - payload
