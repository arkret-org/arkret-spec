      Query: ck.self.keys.query
      Claim: ck.self.keys.claim
      KeyPackagesUpload: ck.self.keys.keypackages.upload
      KeyPackagesClaim: ck.self.keys.keypackages.claim
      KeyPackagesConsume: ck.self.keys.keypackages.consume
      KeyPackagesRevoke: ck.self.keys.keypackages.revoke
      BackupsPut: ck.self.keys.backups.put
      BackupsList: ck.self.keys.backups.list
