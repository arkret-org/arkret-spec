# Status: binding extension profile reference.
# v1 core 互操作锁定 HTTP/JSON binding (artifacts/openapi/contrix-service-api.openapi.yaml)。
# 本文件描述 WebSocket / SSE / gRPC / message queue / libp2p binding 的 frame / topic 形态，
# 仅在显式声明对应 binding profile 的部署中适用；v1 core 实现不要求实现这些 binding。
version: "2026-05-02"
operation_registry: ../registry/operation-registry.json
frame_schemas:
  websocket:
    required:
      - frame_id
      - operation_id
      - stream_id
      - payload
    properties:
      frame_id:
        type: string
        pattern: "^cx:frame:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      operation_id:
        type: string
      stream_id:
        type: string
      cursor:
        oneOf:
          - type: string
          - $ref: ../schemas/cursor.schema.json
      payload:
        type: object
      error:
        type: object
      request_id:
        type: string
  sse:
    event_types:
      - sync.event
      - sync.snapshot
      - sync.heartbeat
      - applet.ack
      - agent.status
    data_shape:
      type: object
      required:
        - operation_id
        - payload
grpc:
  services:
    Server:
      Describe: cx.server.describe
    Identity:
      DescribeRegistry: cx.identity.describe_registry
      Resolve: cx.identity.resolve
      GetDocument: cx.identity.get_document
      GetLog: cx.identity.get_log
      SubmitDidOperation: cx.identity.submit_did_operation
      GetReceipts: cx.identity.get_receipts
    Events:
      Describe: cx.events.describe
      Submit: cx.events.submit
      Get: cx.events.get
      BatchGet: cx.events.batch_get
      Query: cx.events.query
      # cx.events.query_post reuses the canonical Events/Query gRPC binding;
      # it is a HTTP-specific alias for the body-form transport (see
      # operation-registry notes).
      Subscribe: cx.events.subscribe
      Frontier: cx.events.frontier
    Sync:
      Describe: cx.sync.describe
      Account: cx.sync.account
      GetSnapshotHead: cx.sync.get_snapshot_head
    Directory:
      Describe: cx.directory.describe
      SearchSpaces: cx.directory.search_spaces
      ResolveSpace: cx.directory.resolve_space
      SearchOrganizations: cx.directory.search_organizations
      ResolveOrganization: cx.directory.resolve_organization
      SearchActors: cx.directory.search_actors
      SearchUsers: cx.directory.search_users
      ResolveHandle: cx.directory.resolve_handle
      PrivateContactDiscovery: cx.directory.private_contact_discovery
      Announce: cx.directory.announce
      Withdraw: cx.directory.withdraw
    Keys:
      Upload: cx.keys.upload
      Query: cx.keys.query
      Claim: cx.keys.claim
      KeyPackagesUpload: cx.keys.keypackages.upload
      KeyPackagesClaim: cx.keys.keypackages.claim
      KeyPackagesConsume: cx.keys.keypackages.consume
      KeyPackagesRevoke: cx.keys.keypackages.revoke
      BackupsPut: cx.keys.backups.put
      BackupsList: cx.keys.backups.list
      BackupsGet: cx.keys.backups.get
      BackupsDelete: cx.keys.backups.delete
    Blob:
      Upload: cx.blob.upload
      Get: cx.blob.get
      Head: cx.blob.head
      Presign: cx.blob.presign
    DeviceMessages:
      Put: cx.device_messages.put
      Get: cx.device_messages.get
    Moderation:
      Report: cx.moderation.report
    Policy:
      Check: cx.policy.check
    Media:
      IceConfig: cx.media.ice_config
    Applet:
      Ping: cx.applet.ping
      Describe: cx.applet.describe
      Transaction: cx.applet.transaction
      QueryActor: cx.applet.query_actor
      QuerySpace: cx.applet.query_space
      ProtocolMetadata: cx.applet.protocol_metadata
      ThirdPartyUsers: cx.applet.third_party_users
      ThirdPartyLocations: cx.applet.third_party_locations
    Mimi:
      ProviderDirectory: cx.mimi.provider_directory
      KeyMaterial: cx.mimi.key_material
      RoomUpdate: cx.mimi.room_update
      Notify: cx.mimi.notify
      SubmitMessage: cx.mimi.submit_message
      GroupInfo: cx.mimi.group_info
      RequestConsent: cx.mimi.request_consent
      UpdateConsent: cx.mimi.update_consent
      IdentifierQuery: cx.mimi.identifier_query
      ReportAbuse: cx.mimi.report_abuse
      ProxyDownload: cx.mimi.proxy_download
    Push:
      RegisterDevice: cx.push.register_device
      UnregisterDevice: cx.push.unregister_device
      Notify: cx.push.notify
    Authz:
      Check: cx.authz.check
      GetEffectiveGrants: cx.authz.get_effective_grants
      GetInvites: cx.authz.get_invites
    Account:
      IssueSessionGrant: cx.account.issue_session_grant
      DevicePair: cx.account.device_pair
      OidcCallback: cx.account.oidc_callback
    Admin:
      GetServerStatus: cx.admin.get_server_status
      UpdateAccountStatus: cx.admin.update_account_status
      RevokeDevice: cx.admin.revoke_device
      GetModerationQueue: cx.admin.get_moderation_queue
    AgentWorkspace:
      ResolveMirrorFlow: cx.agent_workspace.resolve_mirror_flow
      ListPendingTasks: cx.agent_workspace.list_pending_tasks
mq:
  envelope:
    required:
      - message_id
      - operation_id
      - payload
      - sent_at
      - signatures
    properties:
      message_id:
        type: string
      operation_id:
        type: string
      replay_key:
        type: string
      payload:
        type: object
      sent_at:
        type: string
      signatures:
        type: array
  topics:
    events.submit: cx.events.submit
    events.batch_get: cx.events.batch_get
    events.query: cx.events.query
    events.subscribe: cx.events.subscribe
    sync.account: cx.sync.account
    directory.private_contact_discovery: cx.directory.private_contact_discovery
    directory.announce: cx.directory.announce
    directory.withdraw: cx.directory.withdraw
    keys.keypackages.upload: cx.keys.keypackages.upload
    keys.keypackages.claim: cx.keys.keypackages.claim
    keys.keypackages.consume: cx.keys.keypackages.consume
    keys.keypackages.revoke: cx.keys.keypackages.revoke
    keys.backups.put: cx.keys.backups.put
    keys.backups.list: cx.keys.backups.list
    keys.backups.get: cx.keys.backups.get
    keys.backups.delete: cx.keys.backups.delete
    moderation.report: cx.moderation.report
    mimi.provider_directory: cx.mimi.provider_directory
    mimi.key_material: cx.mimi.key_material
    mimi.room_update: cx.mimi.room_update
    mimi.notify: cx.mimi.notify
    mimi.submit_message: cx.mimi.submit_message
    mimi.group_info: cx.mimi.group_info
    mimi.request_consent: cx.mimi.request_consent
    mimi.update_consent: cx.mimi.update_consent
    mimi.identifier_query: cx.mimi.identifier_query
    mimi.report_abuse: cx.mimi.report_abuse
    mimi.proxy_download: cx.mimi.proxy_download
    push.notify: cx.push.notify
    authz.check: cx.authz.check
    agent_workspace.resolve_mirror_flow: cx.agent_workspace.resolve_mirror_flow
    agent_workspace.list_pending_tasks: cx.agent_workspace.list_pending_tasks
libp2p:
  envelope:
    required:
      - stream_protocol
      - operation_id
      - source_service_did
      - target_service_did
      - payload
      - proof
    properties:
      stream_protocol:
        type: string
      operation_id:
        type: string
      source_service_did:
        type: string
      target_service_did:
        type: string
      payload:
        type: object
      frontier:
        type: object
      proof:
        type: object
  suggested_protocols:
    - /contrix/sync/1.0.0
    - /contrix/blob/1.0.0
  # Federation API 走 sync surface（HTTP 侧复用 cx.events.submit / cx.events.query
  # 加 service signature header；详见 federation.md §4 与 §7）。libp2p binding 同样使用
  # /contrix/sync/1.0.0 + service-signature envelope，不另设独立 /contrix/federation/1.0.0
  # protocol multiplexer。
