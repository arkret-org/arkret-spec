name: Artifact lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  artifact-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install lint dependencies
        run: python -m pip install cryptography jsonschema pyyaml
      # A gate nobody has seen fail is indistinguishable from a gate that
      # matches nothing. These are the lints' own mutation tests: each one
      # corrupts an artifact the way it was really corrupted once and asserts the
      # lint rejects it. They existed before this step and ran nowhere.
      - name: Run lint self-tests
        run: |
          set -e
          for test in tools/test_*.py; do
            echo "=== $test ==="
            python "$test"
          done
      # The naming predicates are only as good as the surface they reach. This
      # fails the build if the schema walker ever stops reaching a declared
      # property, which is how the rules silently stopped applying before, and
      # if any naming clause is filed as `uncovered` in the rule-contract
      # coverage matrix; `prose_only` clauses are accepted review debt whose
      # manual_review_reason the lint enforces, so they are reported here
      # without failing the step.
      - name: Verify naming predicate coverage
        run: python tools/naming_coverage.py --require-full

      - name: Run unified artifact pipeline
        run: python tools/artifact_pipeline.py check

      - name: Verify artifact generation is byte-deterministic
        run: python tools/check_artifact_determinism.py

  crossref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spec ↔ registry crossref check
        run: node site/scripts/crossref-check.mjs
