name: Artifact lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  artifact-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install lint dependencies
        run: python -m pip install jsonschema pyyaml
      - name: Run unified artifact pipeline
        run: python tools/artifact_pipeline.py check

  crossref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spec ↔ registry crossref check
        run: node site/scripts/crossref-cheak.mjs
