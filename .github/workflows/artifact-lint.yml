name: Artifact lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  artifact-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unified artifact pipeline
        run: python tools/artifact_pipeline.py check
