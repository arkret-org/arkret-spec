name: Legacy Contract Guard

on:
  pull_request:
  push:

jobs:
  no-legacy-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Reject removed legacy contracts
        run: python tools/check_no_legacy_contracts.py
