openapi: 3.1.0
info:
  title: Contrix Service API
  version: "1.0.0"
  summary: Canonical Contrix service surface and admin/account bindings
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    httpMessageSignature:
      type: apiKey
      in: header
      name: Signature
    mutualTls:
      type: mutualTLS
  headers:
    XContrixRequestId:
      description: Stable request identifier.
      schema:
        type: string
    IdempotencyKey:
      description: Idempotency key for write requests.
      schema:
        type: string
    XContrixWaitFor:
      description: Causal frontier token the caller is waiting on.
      schema:
        type: string
    RetryAfter:
      description: Standard retry hint.
      schema:
        type: string
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - ok
        - error
        - request_id
      properties:
        ok:
          const: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            retry_after_ms:
              type:
                - integer
                - "null"
            details:
              type: object
        request_id:
          type: string
    ServiceDescribe:
      type: object
      required:
        - protocol_version
        - service_type
        - service_did
        - supported_profiles
        - supported_operations
        - supported_bindings
      properties:
        protocol_version:
          type: string
        service_type:
          type: string
        service_did:
          type: string
        supported_profiles:
          type: array
          items:
            type: string
        supported_operations:
          type: array
          items:
            type: string
        supported_bindings:
          type: array
          items:
            type: object
        auth_metadata:
          type: object
        supported_reducer_profiles:
          type: array
          items:
            type: string
        supported_schema_profiles:
          type: array
          items:
            type: string
    IdentityResolveResponse:
      type: object
      properties:
        did_document:
          type: object
        key_log_head:
          type: string
        seq:
          type: integer
        receipts:
          type: array
          items:
            $ref: ../schemas/identity-receipt.schema.json
    SyncResponse:
      $ref: ../schemas/client-sync-response.schema.json
    GrantListResponse:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: ../schemas/capability-grant.schema.json
        state_hash:
          type: string
        evaluated_at:
          type: string
    ModerationQueueResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: string
    FieldFilter:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
          pattern: "^[a-zA-Z0-9_]+(\\.[a-zA-Z0-9_]+)*$"
        op:
          type: string
          enum: [eq, neq, in, not_in, lt, lte, gt, gte, contains, exists, prefix, full_text]
        value: {}
      additionalProperties: false
    BooleanFilter:
      type: object
      properties:
        and:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QueryFilter"
        or:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QueryFilter"
        not:
          $ref: "#/components/schemas/QueryFilter"
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
    QueryFilter:
      oneOf:
        - $ref: "#/components/schemas/FieldFilter"
        - $ref: "#/components/schemas/BooleanFilter"
    SortSpec:
      type: object
      required: [field, direction]
      properties:
        field:
          type: string
          minLength: 1
        direction:
          type: string
          enum: [asc, desc]
        nulls:
          type: string
          enum: [first, last]
      additionalProperties: false
    RelationQuery:
      type: object
      required: [kind, direction]
      properties:
        kind:
          type: string
          minLength: 1
        direction:
          type: string
          enum: [out, in, both]
        source_entity_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        source_actor_id:
          type: string
        source_space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        target_entity_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        target_actor_id:
          type: string
        target_space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        depth:
          type: integer
          minimum: 0
          maximum: 32
      allOf:
        - not:
            anyOf:
              - required: [source_entity_id, source_actor_id]
              - required: [source_entity_id, source_space_id]
              - required: [source_actor_id, source_space_id]
              - required: [target_entity_id, target_actor_id]
              - required: [target_entity_id, target_space_id]
              - required: [target_actor_id, target_space_id]
      additionalProperties: false
    FacetName:
      type: string
      enum:
        - container
        - replyable
        - schedulable
        - assignable
        - stateful
        - rankable
        - reviewable
        - notifiable
        - documentable
        - renderable
    ViewRenderer:
      type: string
      enum:
        - board
        - card
        - row
        - table
        - calendar
        - gantt
        - timeline
        - thread
        - chat
        - forum
        - graph
        - tree
        - document
        - dashboard
        - custom
    QueryRequest:
      type: object
      properties:
        space_ids:
          type: array
          items:
            type: string
            pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
          minItems: 1
        view_id:
          type: string
          pattern: "^cx:view:[0-9a-hjkmnp-z]{26}$"
        projection:
          type: string
          enum:
            - raw
            - collection
            - timeline
            - graph
            - document
            - composite
        renderer:
          $ref: "#/components/schemas/ViewRenderer"
        entity_types:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        facets:
          type: array
          items:
            $ref: "#/components/schemas/FacetName"
          minItems: 1
          uniqueItems: true
        relation:
          oneOf:
            - $ref: "#/components/schemas/RelationQuery"
            - type: "null"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/QueryFilter"
        order_by:
          type: array
          items:
            $ref: "#/components/schemas/SortSpec"
        cursor:
          oneOf:
            - type: string
              pattern: "^cx:cursor:[A-Za-z0-9_-]+$"
            - type: "null"
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        wait_for:
          type: string
          minLength: 1
      additionalProperties: false
      allOf:
        - if:
            properties:
              projection:
                const: raw
            required: [projection]
          then:
            not:
              required: [renderer]
        - if:
            properties:
              projection:
                enum:
                  - collection
                  - graph
                  - timeline
                  - document
                  - composite
            required: [projection]
          then:
            required: [view_id]
    StateFrontier:
      type: object
      required: [state_hash]
      properties:
        state_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        operation_ids:
          type: array
          items:
            type: string
            pattern: "^cx:operation:[0-9a-hjkmnp-z]{26}$"
      additionalProperties: false
    RawQueryResponse:
      type: object
      required: [projection, results, frontier]
      properties:
        projection:
          type: string
          const: raw
        results:
          type: array
          items:
            type: object
        next_cursor:
          type: string
          pattern: "^cx:cursor:[A-Za-z0-9_-]+$"
        total_estimate:
          type: integer
          minimum: 0
        frontier:
          $ref: "#/components/schemas/StateFrontier"
        stale:
          type: boolean
      additionalProperties: false
    CollectionFieldValueGroupSource:
      type: object
      required: [model, field, value]
      properties:
        model:
          type: string
          const: field_value
        field:
          type: string
          pattern: "^[a-zA-Z0-9_]+(\\.[a-zA-Z0-9_]+)*$"
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
      additionalProperties: false
    CollectionRelationGroupSource:
      type: object
      required: [model, scope_container_id, container_id, relation_kind]
      properties:
        model:
          type: string
          const: relation_container
        scope_container_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        container_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        relation_kind:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionTimeBucketGroupSource:
      type: object
      required: [model, start, end, timezone]
      properties:
        model:
          type: string
          const: time_bucket
        start:
          type: string
          format: date-time
          pattern: "Z$"
        end:
          type: string
          format: date-time
          pattern: "Z$"
        timezone:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionMatrixGroupSource:
      type: object
      required: [model, row_key, column_key]
      properties:
        model:
          type: string
          const: matrix_cell
        row_key:
          type: string
          minLength: 1
        column_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionGroupSource:
      oneOf:
        - $ref: "#/components/schemas/CollectionFieldValueGroupSource"
        - $ref: "#/components/schemas/CollectionRelationGroupSource"
        - $ref: "#/components/schemas/CollectionTimeBucketGroupSource"
        - $ref: "#/components/schemas/CollectionMatrixGroupSource"
    CollectionFieldValuePosition:
      type: object
      required: [model, container_id, rank]
      properties:
        model:
          type: string
          const: field_value
        container_id:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: "^[0-9A-Za-z]{1,128}$"
      additionalProperties: false
    CollectionRelationPosition:
      type: object
      required: [model, scope_container_id, container_id, relation_kind, relation_id, rank]
      properties:
        model:
          type: string
          const: relation
        scope_container_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        container_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        relation_kind:
          type: string
          minLength: 1
        relation_id:
          type: string
          pattern: "^cx:relation:[0-9a-hjkmnp-z]{26}$"
        rank:
          type: string
          pattern: "^[0-9A-Za-z]{1,128}$"
      additionalProperties: false
    CollectionTimeWindowPosition:
      type: object
      required: [model, start, sort_key]
      properties:
        model:
          type: string
          const: time_window
        start:
          type: string
          format: date-time
          pattern: "Z$"
        end:
          type:
            - string
            - "null"
          format: date-time
        timezone:
          type: string
          minLength: 1
        sort_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionMatrixPosition:
      type: object
      required: [model, row_key, column_key, sort_key]
      properties:
        model:
          type: string
          const: matrix_cell
        row_key:
          type: string
          minLength: 1
        column_key:
          type: string
          minLength: 1
        sort_key:
          type: string
          minLength: 1
      additionalProperties: false
    CollectionProjectionGroup:
      type: object
      required: [key, title, source, items, limited]
      properties:
        key:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: "^[0-9A-Za-z]{1,128}$"
        source:
          $ref: "#/components/schemas/CollectionGroupSource"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionItem"
        next_cursor:
          oneOf:
            - type: string
              pattern: "^cx:cursor:[A-Za-z0-9_-]+$"
            - type: "null"
        limited:
          type: boolean
        wip_state:
          type: string
          enum: [ok, over_limit, unknown]
        total_estimate:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              source:
                properties:
                  model:
                    const: field_value
                required: [model]
            required: [source]
          then:
            properties:
              items:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/ProjectionItem"
                    - type: object
                      required: [position]
                      properties:
                        position:
                          $ref: "#/components/schemas/CollectionFieldValuePosition"
        - if:
            properties:
              source:
                properties:
                  model:
                    const: relation_container
                required: [model]
            required: [source]
          then:
            properties:
              items:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/ProjectionItem"
                    - type: object
                      required: [position]
                      properties:
                        position:
                          $ref: "#/components/schemas/CollectionRelationPosition"
        - if:
            properties:
              source:
                properties:
                  model:
                    const: time_bucket
                required: [model]
            required: [source]
          then:
            properties:
              items:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/ProjectionItem"
                    - type: object
                      required: [position]
                      properties:
                        position:
                          $ref: "#/components/schemas/CollectionTimeWindowPosition"
        - if:
            properties:
              source:
                properties:
                  model:
                    const: matrix_cell
                required: [model]
            required: [source]
          then:
            properties:
              items:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/ProjectionItem"
                    - type: object
                      required: [position]
                      properties:
                        position:
                          $ref: "#/components/schemas/CollectionMatrixPosition"
      additionalProperties: false
    CollectionProjectionResponse:
      type: object
      required: [projection, view_id, frontier]
      properties:
        projection:
          type: string
          const: collection
        renderer:
          $ref: "#/components/schemas/ViewRenderer"
        view_id:
          type: string
          pattern: "^cx:view:[0-9a-hjkmnp-z]{26}$"
        space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        frontier:
          $ref: "#/components/schemas/StateFrontier"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/CollectionProjectionGroup"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionItem"
        next_cursor:
          oneOf:
            - type: string
              pattern: "^cx:cursor:[A-Za-z0-9_-]+$"
            - type: "null"
        total_estimate:
          type: integer
          minimum: 0
        stale:
          type: boolean
      anyOf:
        - required: [groups]
        - required: [items]
      additionalProperties: false
    ProjectionEntity:
      type: object
      required: [id, entity_type]
      properties:
        id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        entity_type:
          type: string
          minLength: 1
        facets:
          type: array
          items:
            $ref: "#/components/schemas/FacetName"
          uniqueItems: true
        title:
          type: string
        fields:
          type: object
      additionalProperties: false
    ProjectionItem:
      type: object
      required: [entity]
      properties:
        entity:
          $ref: "#/components/schemas/ProjectionEntity"
        render:
          type: string
          enum: [card, row, tile, compact, badge, message]
        display:
          type: object
        position:
          oneOf:
            - $ref: "#/components/schemas/CollectionFieldValuePosition"
            - $ref: "#/components/schemas/CollectionRelationPosition"
            - $ref: "#/components/schemas/CollectionTimeWindowPosition"
            - $ref: "#/components/schemas/CollectionMatrixPosition"
            - type: object
              required: [sort_key]
              properties:
                sort_key:
                  type: string
                  minLength: 1
              additionalProperties: false
        state:
          type: object
      additionalProperties: false
    TimelineProjectionEntry:
      type: object
      required: [id, entry_type, sort_key]
      properties:
        id:
          type: string
          minLength: 1
        entry_type:
          type: string
          enum: [event, message, activity, system, tombstone]
        event_id:
          type: string
          pattern: "^cx:(evt|event):[0-9a-hjkmnp-z]{26}$"
        entity:
          $ref: "#/components/schemas/ProjectionEntity"
        actor_id:
          type: string
        created_at:
          type: string
          format: date-time
          pattern: "Z$"
        sort_key:
          type: string
          minLength: 1
        thread_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        body:
          type: object
        redacted:
          type: boolean
      additionalProperties: false
    TimelineProjectionResponse:
      type: object
      required: [projection, view_id, entries, frontier]
      properties:
        projection:
          type: string
          const: timeline
        renderer:
          $ref: "#/components/schemas/ViewRenderer"
        view_id:
          type: string
          pattern: "^cx:view:[0-9a-hjkmnp-z]{26}$"
        space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        frontier:
          $ref: "#/components/schemas/StateFrontier"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TimelineProjectionEntry"
        next_cursor:
          oneOf:
            - type: string
              pattern: "^cx:cursor:[A-Za-z0-9_-]+$"
            - type: "null"
        limited:
          type: boolean
        stale:
          type: boolean
      additionalProperties: false
    GraphProjectionNode:
      type: object
      required: [entity, depth]
      properties:
        entity:
          $ref: "#/components/schemas/ProjectionEntity"
        depth:
          type: integer
          minimum: 0
        lazy:
          type: boolean
        truncated:
          type: boolean
      additionalProperties: false
    GraphProjectionEdge:
      type: object
      required: [relation_id, relation_kind, from_entity_id, to_entity_id]
      properties:
        relation_id:
          type: string
          pattern: "^cx:relation:[0-9a-hjkmnp-z]{26}$"
        relation_kind:
          type: string
          minLength: 1
        from_entity_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        to_entity_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        rank:
          type: string
          pattern: "^[0-9A-Za-z]{1,128}$"
        truncated:
          type: boolean
      additionalProperties: false
    GraphProjectionResponse:
      type: object
      required: [projection, view_id, nodes, edges, frontier]
      properties:
        projection:
          type: string
          const: graph
        renderer:
          $ref: "#/components/schemas/ViewRenderer"
        view_id:
          type: string
          pattern: "^cx:view:[0-9a-hjkmnp-z]{26}$"
        space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        frontier:
          $ref: "#/components/schemas/StateFrontier"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphProjectionNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphProjectionEdge"
        next_cursor:
          oneOf:
            - type: string
              pattern: "^cx:cursor:[A-Za-z0-9_-]+$"
            - type: "null"
        limited:
          type: boolean
        stale:
          type: boolean
      additionalProperties: false
    DocumentProjectionSection:
      type: object
      required: [entity, sort_key]
      properties:
        entity:
          $ref: "#/components/schemas/ProjectionEntity"
        sort_key:
          type: string
          minLength: 1
        depth:
          type: integer
          minimum: 0
        body:
          type: object
        redacted:
          type: boolean
      additionalProperties: false
    DocumentProjectionResponse:
      type: object
      required: [projection, view_id, sections, frontier]
      properties:
        projection:
          type: string
          const: document
        renderer:
          $ref: "#/components/schemas/ViewRenderer"
        view_id:
          type: string
          pattern: "^cx:view:[0-9a-hjkmnp-z]{26}$"
        space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        frontier:
          $ref: "#/components/schemas/StateFrontier"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/DocumentProjectionSection"
        next_cursor:
          oneOf:
            - type: string
              pattern: "^cx:cursor:[A-Za-z0-9_-]+$"
            - type: "null"
        stale:
          type: boolean
      additionalProperties: false
    CompositeProjectionWidget:
      type: object
      required: [id, title, projection, frontier]
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        projection:
          type: string
          enum: [collection, timeline, graph, document, composite]
        renderer:
          $ref: "#/components/schemas/ViewRenderer"
        frontier:
          $ref: "#/components/schemas/StateFrontier"
        result:
          type: object
        error:
          $ref: "#/components/schemas/ErrorEnvelope"
      additionalProperties: false
    CompositeProjectionResponse:
      type: object
      required: [projection, view_id, widgets, frontier]
      properties:
        projection:
          type: string
          const: composite
        renderer:
          $ref: "#/components/schemas/ViewRenderer"
        view_id:
          type: string
          pattern: "^cx:view:[0-9a-hjkmnp-z]{26}$"
        space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        frontier:
          $ref: "#/components/schemas/StateFrontier"
        widgets:
          type: array
          items:
            $ref: "#/components/schemas/CompositeProjectionWidget"
        stale:
          type: boolean
      additionalProperties: false
  responses:
    NotFound:
      description: Not found or not visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TemporarilyUnavailable:
      description: Temporarily unavailable.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
paths:
  /server/describe:
    get:
      operationId: cx.server.describe
      responses:
        "200":
          description: Service description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDescribe"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /identity/resolve:
    post:
      operationId: cx.identity.resolve
      requestBody:
        required: true
        content:
