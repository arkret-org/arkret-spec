openapi: 3.1.0
info:
  title: Contrix Service API
  version: "1.0.0"
  summary: Canonical Contrix service surface and admin/account bindings
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    httpMessageSignature:
      type: apiKey
      in: header
      name: Signature
    mutualTls:
      type: mutualTLS
  headers:
    XContrixRequestId:
      description: Stable request identifier.
      schema:
        type: string
    IdempotencyKey:
      description: Idempotency key for write requests.
      schema:
        type: string
    XContrixWaitFor:
      description: Causal frontier token the caller is waiting on.
      schema:
        type: string
    RetryAfter:
      description: Standard retry hint.
      schema:
        type: string
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - ok
        - error
        - request_id
      properties:
        ok:
          const: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            retry_after_ms:
              type:
                - integer
                - "null"
            details:
              type: object
        request_id:
          type: string
    ServiceDescribe:
      type: object
      required:
        - protocol_version
        - service_type
        - service_did
        - supported_profiles
        - supported_operations
        - supported_bindings
      properties:
        protocol_version:
          type: string
        service_type:
          type: string
        service_did:
          type: string
        supported_profiles:
          type: array
          items:
            type: string
        supported_operations:
          type: array
          items:
            type: string
        supported_bindings:
          type: array
          items:
            type: object
        auth_metadata:
          type: object
        supported_reducer_profiles:
          type: array
          items:
            type: string
        supported_schema_profiles:
          type: array
          items:
            type: string
    IdentityResolveResponse:
      type: object
      properties:
        did_document:
          type: object
        key_log_head:
          type: string
        seq:
          type: integer
        receipts:
          type: array
          items:
            $ref: ../schemas/identity-receipt.schema.json
    SyncResponse:
      $ref: ../schemas/client-sync-response.schema.json
    GrantListResponse:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: ../schemas/capability-grant.schema.json
        state_hash:
          type: string
        evaluated_at:
          type: string
    ModerationQueueResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: string
    FieldFilter:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
          pattern: "^[a-zA-Z0-9_]+(\\.[a-zA-Z0-9_]+)*$"
        op:
          type: string
          enum: [eq, neq, in, not_in, lt, lte, gt, gte, contains, exists, prefix, full_text]
        value: {}
      additionalProperties: false
    BooleanFilter:
      type: object
      properties:
        and:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QueryFilter"
        or:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QueryFilter"
        not:
          $ref: "#/components/schemas/QueryFilter"
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
    QueryFilter:
      oneOf:
        - $ref: "#/components/schemas/FieldFilter"
        - $ref: "#/components/schemas/BooleanFilter"
    SortSpec:
      type: object
      required: [field, direction]
      properties:
        field:
          type: string
          minLength: 1
        direction:
          type: string
          enum: [asc, desc]
        nulls:
          type: string
          enum: [first, last]
      additionalProperties: false
    RelationQuery:
      type: object
      required: [kind, direction]
      properties:
        kind:
          type: string
          minLength: 1
        direction:
          type: string
          enum: [out, in, both]
        source_entity_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        source_actor_id:
          type: string
        source_space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        target_entity_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        target_actor_id:
          type: string
        target_space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        depth:
          type: integer
          minimum: 0
          maximum: 32
      allOf:
        - not:
            anyOf:
              - required: [source_entity_id, source_actor_id]
              - required: [source_entity_id, source_space_id]
              - required: [source_actor_id, source_space_id]
              - required: [target_entity_id, target_actor_id]
              - required: [target_entity_id, target_space_id]
              - required: [target_actor_id, target_space_id]
      additionalProperties: false
    QueryRequest:
      type: object
      properties:
        space_ids:
          type: array
          items:
            type: string
            pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
          minItems: 1
        view_id:
          type: string
          pattern: "^cx:view:[0-9a-hjkmnp-z]{26}$"
        projection:
          type: string
          enum: [raw, kanban]
        entity_types:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        relation:
          oneOf:
            - $ref: "#/components/schemas/RelationQuery"
            - type: "null"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/QueryFilter"
        order_by:
          type: array
          items:
            $ref: "#/components/schemas/SortSpec"
        cursor:
          oneOf:
            - type: string
              pattern: "^cx:cursor:[A-Za-z0-9_-]+$"
            - type: "null"
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        wait_for:
          type: string
          minLength: 1
      additionalProperties: false
      allOf:
        - if:
            properties:
              projection:
                const: kanban
            required: [projection]
          then:
            required: [view_id]
    StateFrontier:
      type: object
      required: [state_hash]
      properties:
        state_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        operation_ids:
          type: array
          items:
            type: string
            pattern: "^cx:operation:[0-9a-hjkmnp-z]{26}$"
      additionalProperties: false
    RawQueryResponse:
      type: object
      required: [projection, results, frontier]
      properties:
        projection:
          type: string
          const: raw
        results:
          type: array
          items:
            type: object
        next_cursor:
          type: string
        total_estimate:
          type: integer
        frontier:
          $ref: "#/components/schemas/StateFrontier"
        stale:
          type: boolean
      additionalProperties: false
    KanbanProjectionResponse:
      type: object
      required: [projection, view_id, columns, frontier]
      properties:
        projection:
          type: string
          const: kanban
        view_id:
          type: string
          pattern: "^cx:view:[0-9a-hjkmnp-z]{26}$"
        space_id:
          type: string
          pattern: "^cx:space:[0-9a-hjkmnp-z]{26}$"
        frontier:
          $ref: "#/components/schemas/StateFrontier"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/KanbanProjectionColumn"
        stale:
          type: boolean
      additionalProperties: false
    KanbanFieldValueColumnSource:
      type: object
      required: [model, field, value]
      properties:
        model:
          type: string
          const: field_value
        field:
          type: string
          pattern: "^[a-zA-Z0-9_]+(\\.[a-zA-Z0-9_]+)*$"
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
      additionalProperties: false
    KanbanCollectionColumnSource:
      type: object
      required: [model, collection_entity_id]
      properties:
        model:
          type: string
          const: collection
        collection_entity_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
      additionalProperties: false
    KanbanProjectionColumn:
      oneOf:
        - $ref: "#/components/schemas/KanbanFieldValueProjectionColumn"
        - $ref: "#/components/schemas/KanbanCollectionProjectionColumn"
    KanbanProjectionColumnBase:
      type: object
      required: [key, title, source, cards, limited]
      properties:
        key:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: "^[0-9A-Za-z]{1,128}$"
        source:
          type: object
        cards:
          type: array
        next_cursor:
          oneOf:
            - type: string
              pattern: "^cx:cursor:[A-Za-z0-9_-]+$"
            - type: "null"
        limited:
          type: boolean
        wip_state:
          type: string
          enum: [ok, over_limit, unknown]
        total_estimate:
          type: integer
          minimum: 0
      additionalProperties: false
    KanbanFieldValueProjectionColumn:
      allOf:
        - $ref: "#/components/schemas/KanbanProjectionColumnBase"
        - type: object
          properties:
            source:
              $ref: "#/components/schemas/KanbanFieldValueColumnSource"
            cards:
              type: array
              items:
                $ref: "#/components/schemas/KanbanFieldValueProjectionCard"
    KanbanCollectionProjectionColumn:
      allOf:
        - $ref: "#/components/schemas/KanbanProjectionColumnBase"
        - type: object
          properties:
            source:
              $ref: "#/components/schemas/KanbanCollectionColumnSource"
            cards:
              type: array
              items:
                $ref: "#/components/schemas/KanbanRelationProjectionCard"
    KanbanProjectionCard:
      type: object
      required: [entity, position]
      properties:
        entity:
          type: object
          required: [id, entity_type]
          properties:
            id:
              type: string
              pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
            entity_type:
              type: string
              minLength: 1
            title:
              type: string
            fields:
              type: object
          additionalProperties: false
        position:
          oneOf:
            - $ref: "#/components/schemas/KanbanFieldValueCardPosition"
            - $ref: "#/components/schemas/KanbanRelationCardPosition"
      additionalProperties: false
    KanbanFieldValueProjectionCard:
      allOf:
        - $ref: "#/components/schemas/KanbanProjectionCard"
        - type: object
          properties:
            position:
              $ref: "#/components/schemas/KanbanFieldValueCardPosition"
    KanbanRelationProjectionCard:
      allOf:
        - $ref: "#/components/schemas/KanbanProjectionCard"
        - type: object
          properties:
            position:
              $ref: "#/components/schemas/KanbanRelationCardPosition"
    KanbanFieldValueCardPosition:
      type: object
      required: [model, container_id, rank]
      properties:
        model:
          type: string
          const: field_value
        container_id:
          type: string
          minLength: 1
        rank:
          type: string
          pattern: "^[0-9A-Za-z]{1,128}$"
      additionalProperties: false
    KanbanRelationCardPosition:
      type: object
      required: [model, scope_container_id, container_id, relation_kind, relation_id, rank]
      properties:
        model:
          type: string
          const: relation
        scope_container_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        container_id:
          type: string
          pattern: "^cx:entity:[0-9a-hjkmnp-z]{26}$"
        relation_kind:
          type: string
          minLength: 1
        relation_id:
          type: string
          pattern: "^cx:relation:[0-9a-hjkmnp-z]{26}$"
        rank:
          type: string
          pattern: "^[0-9A-Za-z]{1,128}$"
      additionalProperties: false
  responses:
    NotFound:
      description: Not found or not visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limited.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TemporarilyUnavailable:
      description: Temporarily unavailable.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
paths:
  /server/describe:
    get:
      operationId: cx.server.describe
      responses:
        "200":
          description: Service description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDescribe"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /identity/resolve:
    post:
      operationId: cx.identity.resolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did:
                  type: string
                include:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: DID resolution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResolveResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /identity/document:
    get:
      operationId: cx.identity.get_document
      responses:
        "200":
          description: DID document
          content:
            application/json:
              schema:
                type: object
  /identity/log:
    get:
      operationId: cx.identity.get_log
      responses:
        "200":
          description: DID key log
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: ../schemas/did-key-log-entry.schema.json
                  next_cursor:
                    type: string
  /identity/submit-did-operation:
    post:
      operationId: cx.identity.submit_did_operation
      security:
        - bearerAuth: []
        - httpMessageSignature: []
      responses:
        "200":
          description: DID operation accepted
          content:
            application/json:
              schema:
                type: object
  /identity/receipts:
    get:
      operationId: cx.identity.get_receipts
      responses:
        "200":
          description: Identity receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipts:
                    type: array
                    items:
                      $ref: ../schemas/identity-receipt.schema.json
  /repo/submit-commit:
    post:
      operationId: cx.repo.submit_commit
      security:
        - bearerAuth: []
        - httpMessageSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/commit.schema.json
      responses:
        "200":
          description: Commit accepted
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/IdempotencyKey"
            X-Contrix-Request-Id:
              $ref: "#/components/headers/XContrixRequestId"
          content:
            application/json:
              schema:
                type: object
  /repo/operations:
    post:
      operationId: cx.repo.get_operations
      responses:
        "200":
          description: Operation batch
          content:
            application/json:
              schema:
                type: object
  /sync:
    post:
      operationId: cx.sync.client_sync
      headers:
        X-Contrix-Wait-For:
          $ref: "#/components/headers/XContrixWaitFor"
      responses:
        "200":
          description: Client sync response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
  /sync/subscribe:
    get:
      operationId: cx.sync.subscribe
      responses:
        "200":
          description: Streaming sync subscription
  /sync/backfill:
    get:
      operationId: cx.sync.backfill
      responses:
        "200":
          description: Historical backfill
  /sync/snapshot-head:
    get:
      operationId: cx.sync.get_snapshot_head
      responses:
        "200":
          description: Snapshot manifest head
          content:
            application/json:
              schema:
                $ref: ../schemas/snapshot.schema.json
  /federation/transactions/{txn_id}:
    put:
      operationId: cx.federation.transaction
      security:
        - httpMessageSignature: []
        - mutualTls: []
      parameters:
        - in: path
          name: txn_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Federation transaction result
          content:
            application/json:
              schema:
                type: object
  /index/query:
    post:
      operationId: cx.index.query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Structured query result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RawQueryResponse"
                  - $ref: "#/components/schemas/KanbanProjectionResponse"
  /directory/resolve-handle:
    post:
      operationId: cx.directory.resolve_handle
      responses:
        "200":
          description: Handle resolution result
          content:
            application/json:
              schema:
                $ref: ../schemas/handle-claim.schema.json
  /blob/upload:
    post:
      operationId: cx.blob.upload
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Blob accepted
          headers:
            X-Contrix-Request-Id:
              $ref: "#/components/headers/XContrixRequestId"
          content:
            application/json:
              schema:
                $ref: ../schemas/blob.schema.json
  /blob/get:
    head:
      operationId: cx.blob.head
      responses:
        "200":
          description: Blob metadata
    get:
      operationId: cx.blob.get
      parameters:
        - in: header
          name: Range
          schema:
            type: string
      responses:
        "200":
          description: Blob content
          headers:
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
            Location:
              schema:
                type: string
  /push/register-device:
    post:
      operationId: cx.push.register_device
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device registration result
          content:
            application/json:
              schema:
                type: object
  /push/unregister-device:
    post:
      operationId: cx.push.unregister_device
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device unregistration result
          content:
            application/json:
              schema:
                type: object
  /push/notify:
    post:
      operationId: cx.push.notify
      security:
        - httpMessageSignature: []
      responses:
        "200":
          description: Blind push delivery result
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected:
                    type: array
                    items:
                      type: object
  /authz/check:
    post:
      operationId: cx.authz.check
      responses:
        "200":
          description: Authorization decision
          content:
            application/json:
              schema:
                type: object
  /authz/effective-grants:
    get:
      operationId: cx.authz.get_effective_grants
      responses:
        "200":
          description: Effective grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantListResponse"
  /device_messages/{txn_id}:
    put:
      operationId: cx.device_messages.put
      parameters:
        - in: path
          name: txn_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: To-device write accepted
  /keys/upload:
    post:
      operationId: cx.keys.upload
      responses:
        "200":
          description: Key upload result
  /keys/query:
    post:
      operationId: cx.keys.query
      responses:
        "200":
          description: Key query result
  /keys/claim:
    post:
      operationId: cx.keys.claim
      responses:
        "200":
          description: One-time key claim result
  /moderation/report:
    post:
      operationId: cx.moderation.report
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Moderation report created
          content:
            application/json:
              schema:
                type: object
  /auth/account/session-grants:
    post:
      operationId: cx.account.issue_session_grant
      responses:
        "200":
          description: Session grant issued from passkey/OIDC/device proof
          content:
            application/json:
              schema:
                type: object
  /auth/account/device-pair:
    post:
      operationId: cx.account.device_pair
      responses:
        "200":
          description: Device pairing accepted
          content:
            application/json:
              schema:
                type: object
  /auth/account/oidc/callback:
    post:
      operationId: cx.account.oidc_callback
      responses:
        "200":
          description: OIDC callback handled
          content:
            application/json:
              schema:
                type: object
  /admin/server/status:
    get:
      operationId: cx.admin.get_server_status
      security:
        - bearerAuth: []
        - httpMessageSignature: []
      responses:
        "200":
          description: Sodmin-compatible server admin status
          content:
            application/json:
              schema:
                type: object
  /admin/accounts/{account_id}/status:
    post:
      operationId: cx.admin.update_account_status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account lifecycle state updated
          content:
            application/json:
              schema:
                type: object
  /admin/devices/{device_id}/revoke:
    post:
      operationId: cx.admin.revoke_device
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device revoked
          content:
            application/json:
              schema:
                type: object
  /admin/moderation/queue:
    get:
      operationId: cx.admin.get_moderation_queue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationQueueResponse"
