[default]
extend-ignore-re = [
    # multibase/base58 strings (did:key, did:webvh, multibase test vectors)
    "z[1-9A-HJ-NP-Za-km-z]{20,}",
    # long base64 / base64url runs (fixture payloads, signatures, JWT segments)
    "[A-Za-z0-9+/=]{40,}",
    "[A-Za-z0-9_-]{40,}",
]

[files]
extend-exclude = [
  "site/dist",
  "site/node_modules",
  "site/.astro"
]

[default.extend-words]
